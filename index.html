const STAMP_DEFS = [
  { id: 'ent', ic: '🧭', n: 'Entdecker', d: 'In allen Gruppen angefangen', t: (m, p) => p.tried >= p.total },
  { id: 'p25', ic: '🌱', n: 'Viertel', d: '25 % der Punkte', t: (m, p) => p.pct >= 25 },
  { id: 'p50', ic: '🌿', n: 'Halbzeit', d: '50 % der Punkte', t: (m, p) => p.pct >= 50 },
  { id: 'p75', ic: '🌳', n: 'Fast da', d: '75 % der Punkte', t: (m, p) => p.pct >= 75 },
  { id: 'fer', ic: '🏁', n: 'Heft geschafft', d: 'Alle Gruppen komplett gelöst', t: (m, p) => p.done >= p.total },
  { id: 'gld', ic: '🥇', n: 'Gold überall', d: 'In jeder Gruppe mindestens Gold', t: m => m.topics.every(t => medalOf(tk(m.id, t.id)) >= 3) },
  { id: 'dia', ic: '💎', n: 'Diamant überall', d: 'In jeder Gruppe Diamant', t: m => m.topics.every(t => medalOf(tk(m.id, t.id)) >= 4) },
  { id: 'tst', ic: '⏱️', n: 'Test-Profi', d: 'Mini-Test nur mit diesem Heft: mindestens 13 von 15', t: m => S.tests.some(x => x.scope === m.id && x.score >= 13) }
];
function stampsOf(mod) {
  const m = typeof mod === 'string' ? MODULES.find(x => x.id === mod) : mod, p = modProgress(m);
  return STAMP_DEFS.map(d => ({ id: d.id, ic: d.ic, n: d.n, d: d.d, key: m.id + '.' + d.id, got: !!S.stamps[m.id + '.' + d.id], ok: !!S.stamps[m.id + '.' + d.id] || d.t(m, p) }));
}
function checkStamps() {
  MODULES.forEach(m => stampsOf(m).forEach(s => {
    if (!S.stamps[s.key] && s.ok) { S.stamps[s.key] = Date.now(); toast('🔖', `Neuer Stempel: <b>${s.n}</b> (${esc(m.title)})`); }
  }));
}
const stampCount = () => Object.keys(S.stamps || {}).length;

/* ---------- nächstes Ziel (Startbildschirm) ---------- */
function nextGoals() {
  const g = [], L = levelInfo(), n = S.daily.d === ymd() ? S.daily.n : 0;
  if (n < S.cfg.goal) g.push({ ic: 'target', label: `Tagesziel: noch ${S.cfg.goal - n} Aufgaben`, pct: Math.round(n / S.cfg.goal * 100) });
  g.push({ ic: 'coin', label: `Noch ${L.need} 🪙 bis Stufe ${L.n + 1}`, pct: L.pct });
  const shopIt = Object.values(CATALOG).filter(i => i.src.t === 'shop' && !hasItem(i.id) && i.src.cur === 'c').sort((a, b) => a.src.price - b.src.price)[0];
  if (shopIt) { const have = Math.min(S.coins, shopIt.src.price); g.push({ ic: 'bag', label: S.coins >= shopIt.src.price ? `Du kannst dir „${shopIt.name}“ kaufen!` : `Noch ${shopIt.src.price - S.coins} 🪙 bis „${shopIt.name}“`, pct: Math.round(have / shopIt.src.price * 100) }); }
  let best = null;
  MODULES.forEach(m => { const p = modProgress(m); stampsOf(m).forEach(s => { if (!s.ok && /^p\d+$/.test(s.id)) { const th = +s.id.slice(1); const c = { ic: 'stamp', label: `${m.title}: noch ${Math.max(1, Math.ceil(th / 100 * p.max - p.pts))} Punkte bis „${s.n}“`, pct: Math.round(p.pct / th * 100) }; if (!best || c.pct > best.pct) best = c; } }); });
  if (best) g.push(best);
  Object.values(FEATS).forEach(f => { if (f.goals) { try { f.goals().forEach(x => g.push(x)); } catch (e) { } } });
  return g.filter(x => x.pct < 100).sort((a, b) => b.pct - a.pct).slice(0, 3);
}

/* ---------- Ton ---------- */
let _ac = null;
function AC() {
  if (S.cfg.sound === false) return null;
  if (!_ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { _ac = new C(); } catch (e) { return null; } }
  if (_ac.state === 'suspended') { try { _ac.resume(); } catch (e) { } }
  return _ac;
}
function tone(f, t0, d, type, vol) {
  const ac = AC(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = f;
  const t = ac.currentTime + (t0 || 0); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
function sfx(k) {
  if (S.cfg.sound === false) return;
  try {
    const seq = { tap: [[660, 0, .08]], ok: [[523, 0, .12], [784, .09, .18]], pop: [[880, 0, .07], [1175, .05, .08]], magic: [[523, 0, .12], [659, .08, .12], [784, .16, .12], [1047, .24, .3]], hatch: [[392, 0, .12], [523, .1, .12], [659, .2, .12], [784, .3, .12], [1047, .4, .4]], chest: [[330, 0, .1], [415, .08, .1], [523, .16, .1], [659, .24, .1], [880, .34, .35]] }[k] || [];
    seq.forEach(([f, t, d]) => tone(f, t, d, 'triangle', .1));
  } catch (e) { }
}

/* ----- question rendering ----- */
function fieldHTML(c, i) {
  const f = c.q.fields[i], cls = ['fld'];
  if (f.digit) cls.push('dg');
  const foc = c.focus === i && c.state === 'ask' && !c.locked[i] && !c.review;
  if (foc) cls.push('foc'); if (c.marks[i]) cls.push(c.marks[i]);
  return `<span class="${cls.join(' ')}" data-act="foc" data-arg="${i}">${esc(c.vals[i])}${foc ? '<i class="cur"></i>' : ''}</span>`;
}
function qInner(c) {
  const q = c.q; let h = '<div class="qbody">';
  if (q.fields) h += q.html.replace(/\[\[(\d+)\]\]/g, (m, i) => fieldHTML(c, +i));
  else h += q.prompt + '<div class="choices">' + q.choices.map((t, i) => {
    let cl = 'ch'; if (c.badCh.includes(i)) cl += ' bad'; else if (c.sel === i && c.state === 'ask') cl += ' sel';
    if (c.state !== 'ask' && c.sel === i && !c.review) cl += ' ok';
    if (c.review) { if (i === q.correct) cl += ' ok'; else if (c.sel === i) cl += ' bad'; }
    return `<button class="ch ${cl}" data-act="pick" data-arg="${i}">${t}</button>`;
  }).join('') + '</div>';
  return h + '</div>';
}
const qBody = c => `<div class="qtitle">${c.q.title}</div>` + qInner(c);
function keypad(c) {
  const f = c.q.fields[c.focus], comma = f && /,/.test(f.a) && !f.digit;

/* ----- engine ----- */
function startDeck(key) {
  if (limitHit()) return go('limit');
  const d = getDeck(key);
  if (d.i >= DECK_N) { toast('✔', 'Diese Gruppe ist komplett geschafft.'); return go('topic', { key }); }
  S.lastKey = key;
  R = { kind: 'deck', key, mod: key.split('.')[0], idx: d.i, ctx: newCtx(d.qs[d.i]), coins: 0, bc: {}, lastDelta: 0, blockPending: false };
  go('play', { key });
}
function startMistakes() {
  if (limitHit()) return go('limit');
  const items = shuffle(S.mistakes).slice(0, 10).map(m => ({ tid: m.tid, q: m.q }));
  if (!items.length) return;
  R = { kind: 'mistakes', items, idx: 0, ctx: newCtx(items[0].q), first: 0, n: items.length, fixed: 0 };
  go('play');
}
function settle(res) {
  const c = R.ctx; c.res = res; const first = res === 'first'; R.lastDelta = 0;
  if (R.kind === 'deck') {
    const key = R.key, d = S.decks[key], i = R.idx, b = Math.floor(i / BLOCK);
    d.res[i] = res; d.ans[i] = first ? null : c.firstAns; d.i = Math.max(d.i, i + 1);
    noteAnswer(key, first);
    if (!first) addMistake(key, c.q, c.firstAns);
    R.lastDelta = creditDeckAnswer(key, d, i); R.coins += R.lastDelta; R.bc[b] = (R.bc[b] || 0) + R.lastDelta;
    if (R.lastDelta) coinPop('+' + R.lastDelta + ' 🪙');
    if (blockDone(d, b)) { R.blockInfo = completeBlock(key, d, b); R.blockInfo.coins = R.bc[b] || 0; R.blockPending = true; }
  } else {
    const tid = R.items[R.idx].tid; noteAnswer(tid, first);
    if (first) { R.first++; removeMistake(tid, c.q); R.fixed++; } else addMistake(tid, c.q, c.firstAns);
  }
  dailyCheck(); checkTrophies(); save();
}
function check() {
  if (view !== 'play') return;
  const c = R.ctx, q = c.q;
  if (c.state !== 'ask' || !q.fields) return;
  const empty = c.vals.findIndex((v, i) => !c.locked[i] && normIn(v) === '');
  if (empty >= 0) { c.focus = empty; render(); return; }
  const ok = q.fields.map((f, i) => fieldOK(f, c.vals[i]));
  c.tries++;
  if (c.tries === 1 && !ok.every(Boolean)) c.firstAns = { vals: c.vals.slice() };
  if (ok.every(Boolean)) { ok.forEach((_, i) => c.marks[i] = 'ok'); c.state = 'right'; const f1 = c.tries === 1 && !c.hinted; c.say = rnd(f1 ? SAY.ok1 : SAY.ok2); settle(f1 ? 'first' : 'second'); }
  else if (c.tries === 1) { ok.forEach((o, i) => { c.marks[i] = o ? 'ok' : 'bad'; c.locked[i] = o; }); c.showHint = true; c.say = rnd(SAY.w1); c.focus = ok.findIndex(o => !o); }
  else { q.fields.forEach((f, i) => { if (!ok[i]) c.vals[i] = f.a; c.marks[i] = 'show'; }); c.state = 'revealed'; c.say = rnd(SAY.w2); settle('fail'); }
  render();
}
function pickChoice(i) {
  if (view === 'test') { const c = T.qs[T.i].c; c.sel = i; render(); return; }
  if (view !== 'play') return;
  const c = R.ctx, q = c.q;
  if (c.state !== 'ask' || q.fields || c.badCh.includes(i)) return;
  c.tries++; c.sel = i;
  if (c.tries === 1 && i !== q.correct) c.firstAns = { sel: i };
  if (i === q.correct) { c.state = 'right'; const f1 = c.tries === 1 && !c.hinted; c.say = rnd(f1 ? SAY.ok1 : SAY.ok2); settle(f1 ? 'first' : 'second'); }
  else if (c.tries === 1) { c.badCh.push(i); c.showHint = true; c.say = rnd(SAY.w1); c.sel = null; }
  else { c.badCh.push(i); c.sel = q.correct; c.state = 'revealed'; c.say = rnd(SAY.w2); settle('fail'); }
  render();
}
function next() {
  if (view !== 'play') return;
  if (R.kind === 'deck') {
    if (R.blockPending) { R.blockPending = false; return go('block'); }
    if (limitHit()) return go('limit');
    const d = S.decks[R.key]; R.idx = d.i; R.ctx = newCtx(d.qs[R.idx]); render();
  } else if (R.idx < R.items.length - 1) { R.idx++; R.ctx = newCtx(R.items[R.idx].q); render(); }
  else { checkTrophies(); save(); go('result'); if (R.first >= R.n - 1) confetti(60); }
}

function pinKey(k) {
  const P = PIN; if (!P || P.mode === 'recshow') return;
  const max = P.mode === 'recover' ? 8 : 4;
  if (k === 'back') P.buf = P.buf.slice(0, -1); else if (/^\d$/.test(k) && P.buf.length < max) P.buf += k;
  if (P.buf.length === max) {
    if (P.mode === 'enter') { if (pinOk(P.buf)) return pinSucceed(); P.buf = ''; P.msg = 'Falsche PIN – bitte noch einmal.'; }
    else if (P.mode === 'create1') { P.first = P.buf; P.buf = ''; P.mode = 'create2'; P.msg = 'Zur Sicherheit noch einmal eingeben.'; }
    else if (P.mode === 'create2') {

      else { P.buf = ''; P.first = ''; P.mode = 'create1'; P.msg = 'Die PINs waren verschieden. Bitte neu festlegen.'; }
    } else if (P.mode === 'recover') {

/* =====================================================================
   ACTIONS + EVENTS
   ===================================================================== */
function press(k) {
  let c;
  if (view === 'play') { c = R.ctx; if (c.state !== 'ask') { if (k === 'enter') next(); return; } }
  else if (view === 'test') c = T.qs[T.i].c;
  else return;
  const q = c.q; if (!q.fields) { if (k === 'enter' && view === 'test') ACT.nextQ(); return; }
  const fs = q.fields;
  if (k === 'enter') { if (view === 'play') check(); else ACT.nextQ(); return; }
  if (k === 'tab') { move(c, 1); render(); return; }
  if (k === 'shifttab') { move(c, -1); render(); return; }
  if (c.locked[c.focus]) { move(c, 1); if (c.locked[c.focus]) return; }
  const fo = fs[c.focus];
  if (k === 'back') {
    if (c.vals[c.focus] !== '') { c.vals[c.focus] = c.vals[c.focus].slice(0, -1); c.marks[c.focus] = null; }
    else {
      const j = fs.findIndex((x, i) => x.next === c.focus && !c.locked[i]);
      if (j >= 0) { c.focus = j; c.vals[j] = ''; c.marks[j] = null; }
      else { for (let t = 1; t < fs.length; t++) { const p = (c.focus - t + fs.length) % fs.length; if (!c.locked[p] && p < c.focus) { c.focus = p; break; } } }   // zurück zum vorigen Feld
    }
  } else if (k === ',') {
    if (/,/.test(fo.a) && !fo.digit && c.vals[c.focus] !== '' && !c.vals[c.focus].includes(',')) { c.vals[c.focus] += ','; c.marks[c.focus] = null; }
  } else if (/^\d$/.test(k)) {

/* ---------- Namen: Besitz-Form und Fino-Ersetzung ---------- */
const dzPoss = n => /[sßxzSßXZ]$/.test(n) ? n + '’' : n + 's';
const DZ_FN_SKIP = 'script,style,input,textarea,[data-keepfino]';
function dzFinoText(t) {
  const n = (typeof FN === 'function') ? FN() : 'Fino';
  if (!n || n === 'Fino' || /Fino/.test(n)) return t;
  return t.replace(/\bFinos\b/g, dzPoss(n)).replace(/\bFino\b/g, n);
}
function dzFinoNode(root) {
  if (!root || (typeof FN === 'function' && FN() === 'Fino')) return;
  if (root.nodeType === 3) { const p = root.parentElement; if (p && !p.closest(DZ_FN_SKIP) && /Fino/.test(root.nodeValue)) root.nodeValue = dzFinoText(root.nodeValue); return; }
  if (root.nodeType !== 1 || root.matches(DZ_FN_SKIP)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const list = []; let x;
  while ((x = w.nextNode())) if (/Fino/.test(x.nodeValue)) list.push(x);
  list.forEach(t => { if (!t.parentElement.closest(DZ_FN_SKIP)) t.nodeValue = dzFinoText(t.nodeValue); });
  root.querySelectorAll('[aria-label*="Fino"],[title*="Fino"],[alt*="Fino"]').forEach(e => {
    if (e.closest('[data-keepfino]')) return;
    ['aria-label', 'title', 'alt'].forEach(a => { const v = e.getAttribute(a); if (v && /Fino/.test(v)) e.setAttribute(a, dzFinoText(v)); });
  });
}
if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(dzFinoNode))).observe(document.documentElement, { childList: true, subtree: true });
}

const NAV = { stack: [], isBack: false, sentinel: false };
const DZ_TRANSIENT = new Set(['play', 'test', 'result', 'testResult', 'geoPlay', 'geoResult', 'limit', 'storyread']);
const DZ_PARENT = { storyread: 'story' };                   // Seiten, die nicht im Verlauf stehen: Zurück geht hierhin
const DZ_LABEL = { home: 'Start', hefte: 'Meine Hefte', extra: 'Extra Spaß', rewards: 'Meine Welt', geo: 'Europa Entdecker', profile: 'Profil', shop: 'Shop', trophies: 'Pokale', schatz: 'Karten', look: 'Farben & Töne', avatar: 'Das bin ich', musik: 'Musik', story: 'Geschichte', welt: 'Weltreise', weltPass: 'Mein Reisepass', weltReise: 'Reise', fakten: 'Lustige Fakten', geoCards: 'Länderkarten', geoPass: 'Stempel', parent: 'Eltern', module: 'Heft', topic: 'Übung', mistakes: 'Fehler-Heft', testSetup: 'Mini-Test', buch: 'Mein Buch', insel: 'Meine Insel', wesen: 'Meine Wesen' };
const DZ_KEEP_UI = k => !['say', 'pending', 'pinUntil', 'pinCreative', 'ro', 'wNew', 'wFlight'].includes(k);
const dzSnap = () => { const o = {}; Object.keys(UI).forEach(k => { const v = UI[k]; if (DZ_KEEP_UI(k) && (v === null || ['string', 'number', 'boolean'].includes(typeof v))) o[k] = v; }); return o; };
function dzNavPush(from, to) {
  if (NAV.isBack) return;
  if (to === 'home') { NAV.stack.length = 0; return; }
  const i = NAV.stack.map(e => e.v).lastIndexOf(to);
  if (i >= 0) { NAV.stack.length = i; return; }                 // zurück zu einer Seite, die schon im Verlauf ist
  if (DZ_TRANSIENT.has(from) || from === to) return;
  NAV.stack.push({ v: from, ui: dzSnap() });
  if (NAV.stack.length > 40) NAV.stack.shift();
  dzSentinel();
}
function dzBack(fb) {
  if (DZ_PARENT[view] && VIEWS[DZ_PARENT[view]]) { go(DZ_PARENT[view]); return; }
  let e;
  while ((e = NAV.stack.pop()) && (!VIEWS[e.v] || e.v === view)) { e = null; }
  if (e) { NAV.isBack = true; try { go(e.v, e.ui); } finally { NAV.isBack = false; } return; }
  if (fb && fb !== 'home' && VIEWS[fb]) { go(fb); return; }
  if (fb && fb !== 'home' && typeof ACT[fb] === 'function' && fb !== 'back') { ACT[fb](); return; }
  go('home');
}
function dzBackLabel(fb) {
  const e = NAV.stack[NAV.stack.length - 1];
  const v = e ? e.v : (fb && DZ_LABEL[fb] ? fb : 'home');
  return DZ_LABEL[v] || 'Zurück';
}
/* Android-Zurück: ein Eintrag im Browser-Verlauf wird immer nachgefüllt, solange man nicht auf der Startseite ist */
function dzSentinel() { if (NAV.sentinel) return; try { history.pushState({ dz: 1 }, ''); NAV.sentinel = true; } catch (e) { } }
window.addEventListener('popstate', () => {
  NAV.sentinel = false;

  if (typeof closeModal === 'function' && document.getElementById('modal')) { closeModal(); dzSentinel(); return; }

function dzTreeStage(pct) { return pct >= 100 ? 5 : pct >= 75 ? 4 : pct >= 50 ? 3 : pct >= 25 ? 2 : pct > 0 ? 1 : 0; }

  let g = '';
  if (st === 0) g = '<ellipse cx="60" cy="98" rx="7" ry="4.6" transform="rotate(-14 60 98)" fill="var(--dz-trunk)"/><path d="M57 96q3-2 6 0" stroke="#f4efe4" stroke-width="1.6" fill="none" stroke-linecap="round"/>';

  else if (st === 2) g = `<path d="M60 102V70" stroke="var(--dz-green)" stroke-width="4" stroke-linecap="round"/>${L(50, 82, 10, -28)}${L(70, 78, 10, 28)}${L(52, 68, 9, -30)}${L(68, 64, 9, 30)}`;
  else if (st === 3) g = '<path d="M60 102V62" stroke="var(--dz-trunk)" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="52" r="20" fill="var(--dz-green)"/><circle cx="48" cy="60" r="12" fill="var(--dz-green)" opacity=".85"/><circle cx="73" cy="58" r="11" fill="var(--dz-green)" opacity=".85"/>';
  else if (st === 4) g = '<path d="M60 102V58M60 80l-12-12M60 74l11-10" stroke="var(--dz-trunk)" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="44" r="25" fill="var(--dz-green)"/><circle cx="42" cy="56" r="16" fill="var(--dz-green)" opacity=".85"/><circle cx="79" cy="55" r="15" fill="var(--dz-green)" opacity=".85"/>';

/* ---------- Bausteine als HTML ---------- */
const dzChip = (ic, val, label, act, o) => `<button class="dz-chip${o && o.pulse ? ' dz-pulse' : ''}" data-act="${act}" aria-label="${esc(label)}: ${val}" title="${esc(label)}">${dzIc(ic, 19)}<b>${val}</b></button>`;
/* Profil links, daneben Münzen · Sterne · Karten · Pokale */
function dzHead() {
  const L = levelInfo();
  return `<header class="dz-head"><button class="dz-me" data-act="profile" aria-label="Mein Profil: ${esc(profileName())}, Level ${L.n}">${avArt(44)}<span><strong>${esc(profileName())}</strong><small>Level ${L.n}</small></span></button>
    <div class="dz-wallet">${dzChip('coin', S.coins, 'Münzen (zum Shop)', 'shop')}${dzChip('star', S.starsLife, 'Sterne (zum Profil)', 'profile')}${dzChip('cards', Object.keys(S.cards).length, S.chests ? 'Karten – neue Karte wartet' : 'Karten', 'schatz', { pulse: S.chests > 0 })}${dzChip('trophy', Object.keys(S.trophies).length, 'Pokale', 'trophies')}</div></header>`;
}
/* Quadratische Kachel. o: {art|html, title, sub, act, arg, cls, bar, state, tag, pulse, pct, locked, label} */
function dzTile(o) {
  const lab = o.label || (o.title + (o.sub ? ', ' + o.sub : ''));
  const art = o.html != null ? o.html : (o.art ? dzArt(o.art) : '');
  /* .dz-tile ist nur der Container (cqw-Maße gelten für Kinder); das Layout steckt in .dz-in */
  const inner = `${o.state ? `<span class="dz-state">${o.state}</span>` : ''}${o.tag ? `<span class="dz-tag">${o.tag}</span>` : ''}${o.pct != null ? `<span class="dz-pct">${o.pct}%</span>` : ''}<span class="dz-in"><span class="dz-art">${art}</span><strong>${esc(o.title)}</strong>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span>${o.bar != null ? `<span class="dz-bar"><i style="width:${Math.max(0, Math.min(100, o.bar))}%"></i></span>` : ''}`;
  const cls = `dz-tile ${o.cls || ''}${o.bar != null ? ' has-bar' : ''}${o.pulse ? ' pulse' : ''}${o.locked ? ' locked' : ''}`;
  if (o.locked && !o.act) return `<div class="${cls}" role="img" aria-label="${esc(lab)}">${inner}</div>`;
  return `<button class="${cls}" data-act="${o.act}"${o.arg == null ? '' : ` data-arg="${esc(o.arg)}"`} aria-label="${esc(lab)}">${inner}</button>`;
}
const dzSlot = (flag) => (flag && flagOn(flag)) ? '' : '<span class="dz-slot" aria-hidden="true"></span>';       // reservierter, unsichtbarer Platz
const dzGrid = (n, tiles, cls) => `<div class="dz-grid ${cls || ''}" style="--n:${n}">${tiles}</div>`;
const dzSec = (title, sub, extra) => `<div class="dz-sec"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${extra || ''}</div>`;
const dzHero = (small, title, text, art, cls) => `<section class="dz-hero ${cls || ''}"><div class="dz-hero-copy">${small ? `<small>${esc(small)}</small>` : ''}<h1>${title}</h1>${text ? `<p>${text}</p>` : ''}</div>${art ? `<div class="dz-hero-art">${art}</div>` : ''}</section>`;
/* Seite mit Kopfzeile (Zurück · Titel · Münzen/Sterne), wie die inneren Seiten – für Hub-Seiten */
const dzPage = (title, back, body, extra) => `${topBar(title, back, extra)}${body}`;
/* Akkordeon: es ist immer nur ein Eintrag offen. items: [{id, badge, title, sub, body}] */
function dzAcc(items, openId, key) {
  return `<div class="dz-acc" data-key="${key}">${items.map(it => `<section class="dz-acc-item${it.id === openId ? ' open' : ''}" data-id="${esc(it.id)}">
    <button class="dz-acc-head" data-act="dzAcc" data-arg="${key}|${esc(it.id)}" aria-expanded="${it.id === openId}"><span class="dz-acc-badge">${esc(it.badge)}</span><span class="dz-acc-text"><strong>${esc(it.title)}</strong><small>${it.sub}</small></span>

    <div class="dz-acc-body"><div class="dz-acc-inner"><div class="dz-acc-pad">${it.body}</div></div></div></section>`).join('')}</div>`;
}
Object.assign(ACT, {
  dzAcc: a => {                                                  // Auf- und Zuklappen ohne neu zu zeichnen, damit die Bewegung weich bleibt
    const [key, id] = String(a).split('|'), root = document.querySelector(`.dz-acc[data-key="${key}"]`); if (!root) return;
    const cur = UI['acc_' + key], next = cur === id ? '' : id; UI['acc_' + key] = next;
    root.querySelectorAll('.dz-acc-item').forEach(el => { const on = el.dataset.id === next; el.classList.toggle('open', on); const b = el.querySelector('.dz-acc-head'); if (b) b.setAttribute('aria-expanded', on); });
  }
});

/* =====================================================================
   SHELL: Startseite · Hefte · Belohnungen · Darstellung · Kreativzeit · Fino-Name
   Läuft nach app.js. Ablauf des Kindes: üben → sehen, was man gelernt hat → etwas Verdientes bekommen → kurz genießen.
   ---------------------------------------------------------------------
   Regeln, die alle Funktionen (feat_*.js) einhalten:
   - Münzen sind die einzige Währung und werden NUR im Shop ausgegeben. Alles andere wird verdient (Meilenstein) oder ist gratis (nur das Nötigste).
   - Ein Feature kann registerFeature({ ..., creative:'view'|'closed' }) setzen:
       'closed' = ohne Kreativzeit nur ein Schloss-Bildschirm   'view' = Ansehen geht immer, Gestalten nur in der Kreativzeit (UI.ro === true heißt: nur ansehen)
   - registerFeature({ leave: () => {} }) wird beim Verlassen der Ansicht aufgerufen (Musik anhalten usw.).
   ===================================================================== */

/* ---------- Kapitel A–D mit je 5 Heften (fest), dazu Extra-Training ---------- */
const CHAPTERS = [{ id: 'A', season: 'Herbstferien' }, { id: 'B', season: 'Weihnachtsferien' }, { id: 'C', season: 'Osterferien' }, { id: 'D', season: 'Sommerferien' }];
const chapIdx = m => Math.max(0, CHAPTERS.findIndex(c => c.id === (m.id || '')[0]));
const modNum = m => +String(m.id).slice(1) || 0;
const isExtra = m => !!m.extra || !/^[A-D][1-5]$/.test(m.id);
const chapMods = c => MODULES.filter(m => !isExtra(m) && m.id[0] === c);
const FN = () => (S.finoName || 'Fino');                         // ein früher gespeicherter Fino-Name bleibt erhalten (Umbenennen gibt es nicht mehr)

/* Preise im alten Fino-Shop auf Münzen umstellen (Flamme = 3 Münzen, Stern = 12 Münzen); Besitz bleibt unverändert */
(function normShop() {
  Object.values(SHOP).forEach(cat => cat.items.forEach(it => {
    if (it.cur === 'f') { it.price = Math.round(it.price * 3 / 5) * 5; it.cur = 'c'; }
    else if (it.cur === 's') { it.price = Math.round(it.price * 12 / 5) * 5; it.cur = 'c'; }
  }));
})();
Object.assign(SHOP_GROUPS, { buch: { label: 'Stickerbuch', ic: 'sticker' } });

/* ---------- Fächer neben Rechnen (Europa-Entdecker, später z. B. Deutsch): feat_*.js ruft regSubject({id,name,ic,act,sub}) auf ---------- */
const SUBJECTS = [];
function regSubject(s) { if (!SUBJECTS.some(x => x.id === s.id)) SUBJECTS.push(s); }   // {id,name,ic,act,sub,card:()=>html}
/* Hauptkacheln der Startseite: Rechnen ist eingebaut, weitere Fächer liefern card() */

/* ---------- Welche Funktion gehört zu welcher Ansicht ---------- */
const featOf = v => Object.values(FEATS).find(f => f.view === v || (f.views && f.views[v]));
function leaveHook(v) { const F = featOf(v); if (F && F.leave) { try { F.leave(); } catch (e) { console.error(e); } } }

/* ---------- Kreativzeit-Anzeige ---------- */
function creativeInfo() {
  const m = creativeMode();
  if (m === 'locked' && !(UI.pinCreative && Date.now() < UI.pinCreative)) return 'Die Kreativ-Bereiche sind gerade geschlossen.';
  const goal = S.cfg.goal, n = S.daily.d === ymd() ? S.daily.n : 0;
  const c = S.daily.cr;
  if (c.grants >= (S.cfg.creativeMax || 2)) return 'Für heute ist die Kreativzeit aufgebraucht. Morgen geht es weiter!';
  const parts = [];
  if (!c.goal) parts.push(`Schaffe dein Tagesziel (noch ${Math.max(0, goal - n)} Aufgaben)`);
  if (!c.lvl) parts.push('oder beende eine Stufe');
  return parts.join(' ') + ` – dann gibt es ${S.cfg.creativeMin || 5} Minuten Kreativzeit.`;
}
function lockScreen(F) {
  return `${topBar(ico(F.icon, 26) + ' ' + F.title, 'rewards')}
  <div class="lockscr"><div class="lockic">${ico('lock', 44)}</div><h2>${esc(F.title)} öffnet nach dem Üben</h2>
  <p>${esc(creativeInfo())}</p>
  <div class="row wrap" style="justify-content:center"><button class="btn big" data-act="goNext">Jetzt üben</button></div>
  ${typeof F.peek === 'function' ? F.peek() : ''}</div>`;
}
const crBanner = ok => ok
  ? `<div class="crbar on"><span>🎨 Kreativzeit</span><b id="crT">${creativeMode() === 'always' ? 'ohne Limit' : fmtT(creativeLeft())}</b></div>`
  : `<div class="crbar"><span>👀 Nur anschauen</span><small>${esc(creativeInfo())}</small></div>`;

/* ---------- Navigation: die Startseite ist der Hub. Kein unterer Tab-Balken mehr; „Zurück“ führt zur Seite, von der man kam (dz.js) ---------- */
const avArt = (size, mood) => avatarHTML(eqAvatar(), size, mood || 'happy');            // das ausgewählte Bild (eigener Avatar oder Fino)
const profileName = () => useMe() ? (S.avName || S.name || 'Mein Zauberlehrling') : FN();

function shellRender(v, f) {
  const b = document.body;
  b.dataset.size = S.cfg.size === 'l' ? 'l' : 'm'; b.dataset.calm = S.cfg.calm ? '1' : '0'; b.dataset.screen = v;
  UI.ro = false;
  const F = featOf(v); let banner = '';
  if (F && F.creative) {
    const ok = creativeOK();
    if (!ok && F.creative === 'closed') return lockScreen(F);
    UI.ro = !ok; banner = (v === 'avatar' && !(S.av && S.av.look)) ? '' : crBanner(ok);
  }
  return banner + f();
}

/* ---------- Uhr: Shop-Zeit und Kreativzeit laufen nur, wenn man wirklich dort ist ---------- */
let tickN = 0;
setInterval(() => {
  if (document.hidden) return;
  tickN++;
  try {
    if (view === 'shop' && (S.cfg.shopMin || 0) > 0 && shopLeft() > 0) {
      touchDay(); S.daily.shopSec++;
      const el = $('#shopT'); if (el) el.textContent = fmtT(shopLeft());
      if (shopLeft() <= 0) { save(); render(); toast('🛍️', 'Die Shop-Zeit für heute ist vorbei.'); }
    }
    const F = featOf(view);
    if (F && F.creative && creativeMode() === 'after' && creativeLeft() > 0 && !(UI.pinCreative && Date.now() < UI.pinCreative)) {
      S.daily.cr.left--; S.daily.cr.used++;
      const el = $('#crT'); if (el) el.textContent = fmtT(S.daily.cr.left);
      if (S.daily.cr.left === 60) toast('⏳', 'Noch eine Minute Kreativzeit. Alles wird automatisch gespeichert.');
      if (S.daily.cr.left <= 0) {
        save(); leaveHook(view);
        modal('Kreativzeit vorbei', 'Alles ist gespeichert. Du findest es morgen genau so wieder. Jetzt üben wir weiter!', 'Weiter üben', 'goNext', '', 'Später');
        go('rewards');
      }
    }
    if (tickN % 15 === 0) save();
  } catch (e) { console.error(e); }
}, 1000);

/* ---------- Was jetzt üben? ---------- */
function nextUp() {
  const mods = MODULES.slice().sort((a, b) => (isExtra(a) - isExtra(b)) || chapIdx(a) - chapIdx(b) || modNum(a) - modNum(b));
  const info = (m, t, kind) => { const key = tk(m.id, t.id), d = S.decks[key], i = d ? d.i : 0; return { key, mod: m, topic: t, i, kind, pts: d ? deckPts(d) : 0 }; };
  const lk = S.lastKey, d0 = lk && S.decks[lk];
  if (d0 && d0.i > 0 && d0.i < DECK_N) { const f = findTopic(lk); if (f) return info(f.mod || MODULES.find(m => m.id === lk.split('.')[0]), f.topic, 'go'); }
  for (const m of mods.filter(x => !isExtra(x))) {
    const ts = m.topics.filter(t => { const d = S.decks[tk(m.id, t.id)]; return !d || d.i < DECK_N; });
    if (ts.length) { const t = ts.find(t => { const d = S.decks[tk(m.id, t.id)]; return d && d.i > 0; }) || ts[0]; return info(m, t, 'go'); }
  }
  let best = null;
  MODULES.forEach(m => m.topics.forEach(t => {
    const key = tk(m.id, t.id), rec = S.topics[key], d = S.decks[key]; if (!d || d.i < DECK_N) return;
    const ts = (rec && rec.doneTs) || 0, days = (Date.now() - ts) / 864e5;
    if (days >= REV_DAYS && (!best || ts < best.ts)) best = Object.assign(info(m, t, 'rev'), { ts });
  }));
  return best;
}
function startNext() {
  const nu = nextUp(); if (!nu) return go('mistakes');
  UI.mod = nu.mod.id; UI.key = nu.key;
  if (nu.kind === 'rev') { if (!newRound(nu.key)) return go('topic', { key: nu.key }); }
  startDeck(nu.key);
}

/* ---------- Fächer neben Rechnen: feat_*.js liefert tile() ---------- */
const subjTiles = () => SUBJECTS.filter(x => x.tile).map(x => x.tile());
const TILE_CLS = ['t1', 't2', 't3'];

/* Fehler-Heft + Mini-Test: ehrliche Angabe der heutigen Belohnung */
const heftePrizeNote = () => {
  const L = testLeft(), any = L.c || L.s || L.ch;
  return any ? `<div class="dz-note"><b>Mini-Test heute:</b> bis zu ${L.c} 🪙 + ${L.s} ⭐${L.ch ? ' und eine Karte bei voller Punktzahl' : ''}.</div>` : '';
};

/* Begrüßung nach lokaler Uhrzeit (Gerätezeit): Morgen 5–10, Tag 11–13, Nachmittag 14–17, Abend 18–21, sonst Nacht */
const greetWord = (h = new Date().getHours()) => h >= 5 && h < 11 ? 'Guten Morgen' : h < 14 && h >= 11 ? 'Guten Tag' : h >= 14 && h < 18 ? 'Schönen Nachmittag' : h >= 18 && h < 22 ? 'Guten Abend' : 'Hallo Nachteule';
const homeGreeting = (h) => { const nm = S.name || S.avName || '', w = greetWord(h); return nm ? `${w}, ${esc(nm)}!` : `${w}!`; };

/* ---------- Startseite: der Hub ---------- */
VIEWS.home = () => {
  const n = S.daily.d === ymd() ? S.daily.n : 0, goal = S.cfg.goal, nu = nextUp();
  const progress = Math.min(n, goal), pct = Math.min(100, Math.round(n / goal * 100)), done = n >= goal;
  const hello = homeGreeting();
  const sub = done ? 'Dein Tagesziel ist geschafft – super!' : useMe() ? 'Was entdeckst du heute?' : `${esc(FN())} ist bereit. Du auch?`;
  const tree = `<div class="dz-tree" aria-label="Dein Baum wächst mit jeder Aufgabe">${dzTree(pct)}<div class="dz-tree-t"><strong>${done ? 'Dein Baum ist groß!' : n ? 'Dein Baum wächst' : 'Pflanze deinen Samen'}</strong><small>Heute ${progress} von ${goal} Aufgaben</small><div class="dz-tree-bar" role="progressbar" aria-label="Tagesziel" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="${goal}"><i style="width:${pct}%"></i></div></div></div>`;
  const ex = MODULES.filter(isExtra);
  const tiles = [
    { art: 'hefte', title: 'Meine Hefte', sub: nu ? `Weiter: ${nu.mod.id}` : 'Alles geschafft', act: 'hefte' },
    ...subjTiles(),
    { art: 'extra', title: 'Extra Spaß', sub: `${ex.length} Spiele`, act: 'extra' },
    { art: 'welt', title: 'Meine Welt', sub: 'Shop, Musik & mehr', act: 'rewards' }
  ];
  return dzHead() + dzHero('', hello, sub, tree) + dzSec('Wohin heute?') +
    dzGrid(tiles.length, tiles.map((t, i) => dzTile(Object.assign({ cls: TILE_CLS[i % 3] }, t))).join(''), 'dz-home4') +
    `<div class="dz-foot"><button class="dz-linkbtn" data-act="parent">${ico('gear', 16)} Für Eltern</button></div>
    ${persistOK ? '' : '<p class="ad-save-warning" role="alert">Gerade kann nichts gespeichert werden. Bitte lass einen Erwachsenen eine Sicherung exportieren.</p>'}`;
};

/* ---------- Meine Hefte ---------- */
const dueInfo = c => {
  const ds = S.cfg.due && S.cfg.due[c.id]; if (!ds) return { txt: 'bis zu den ' + c.season, days: null };
  const days = Math.ceil((new Date(ds + 'T23:59:59') - Date.now()) / 864e5);
  return { txt: 'bis zu den ' + c.season + ' (' + new Date(ds + 'T12:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }) + ')', days };
};
const chapterOf = m => isExtra(m) ? 'Extra' : m.id[0];
const heftTile = (m, cls) => {
  const p = modProgress(m), art = { EMAL: 'mal', KOPF: 'kopf', SCHR: 'schrift', A4: 'teilen', A5: 'geld' }[m.id];
  return dzTile({ cls, html: art ? dzArt(art) : `<span class="dz-glyph">${esc(m.icon)}</span>`, title: m.extra ? m.title : m.id, sub: m.extra ? ({ EMAL: 'Mal & geteilt', KOPF: 'Plus & minus', SCHR: 'Untereinander' }[m.id] || '') : m.title, act: 'mod', arg: m.id, pct: p.pct, label: `${m.extra ? '' : 'Heft ' + m.id + ': '}${m.title}, ${p.pct} Prozent geschafft` });
};
function chapterBody(c) {
  const mods = chapMods(c.id).sort((a, b) => modNum(a) - modNum(b));
  const tiles = [1, 2, 3, 4, 5].map((k, i) => {
    const m = mods.find(x => modNum(x) === k);
    return m ? heftTile(m, TILE_CLS[i % 3]) : dzTile({ title: c.id + k, sub: 'bald', locked: true, html: dzIc('lock', 28), label: `Heft ${c.id}${k}, kommt bald` });
  }).join('');
  const missing = 5 - mods.length;
  return dzGrid(5, tiles, 'dz-hefte5') + (missing ? `<div class="dz-acc-note">${dzIc('lock', 16)}<span>${mods.length ? 'Bald dabei' : 'Kommt bald'}: ${5 - mods.length} ${5 - mods.length === 1 ? 'Heft' : 'Hefte'}</span></div>` : '');
}
VIEWS.hefte = () => {
  const nu = nextUp(), nm = S.mistakes.length;
  const openDefault = nu && !isExtra(nu.mod) ? nu.mod.id[0] : (CHAPTERS.find(c => chapMods(c.id).length) || CHAPTERS[0]).id;
  if (UI.acc_hefte === undefined) UI.acc_hefte = openDefault;
  const tiles = [
    { art: 'play', title: 'Los geht’s', sub: nu ? (nu.kind === 'rev' ? `Wiederholen: ${nu.mod.id}` : nu.i ? `Weiter bei ${nu.mod.id}` : `Start: ${nu.mod.id}`) : 'Alles geschafft', act: nu ? 'goNext' : 'mistakes', label: nu ? `Los geht’s: ${nu.mod.title}, ${nu.topic.t}` : 'Los geht’s: alle Hefte sind fertig' },
    { art: 'retry', title: 'Fehler-Heft', sub: nm ? `${nm} ${nm === 1 ? 'Aufgabe' : 'Aufgaben'}` : 'Alles richtig', act: 'mistakes' },
    { art: 'test', title: 'Mini-Test', sub: `${TEST_N} Aufgaben`, act: 'testSetup', label: `Mini-Test: ${TEST_N} Aufgaben in ${TEST_SECS / 60} Minuten` }
  ].map((t, i) => dzTile(Object.assign({ cls: TILE_CLS[i % 3] }, t))).join('') + dzSlot('slot_hefte');
  const items = CHAPTERS.map(c => {
    const mods = chapMods(c.id), due = dueInfo(c);
    const when = esc(due.txt) + (due.days !== null ? ' · ' + (due.days < 0 ? 'Termin vorbei' : 'noch ' + due.days + ' Tage') : '');
    return { id: c.id, badge: c.id, title: 'Kapitel ' + c.id, sub: `${mods.length} von 5 Heften · ${when}`, body: chapterBody(c) };
  });
  return topBar('Meine Hefte', 'home') + dzGrid(4, tiles, 'dz-hefte4') + heftePrizeNote() + dzSec('Kapitel', 'Tippe ein Kapitel an – es ist immer nur eins offen.') + dzAcc(items, UI.acc_hefte, 'hefte');
};

/* ---------- Extra Spaß: freiwillig, ohne Druck ---------- */
VIEWS.extra = () => {
  const ex = MODULES.filter(isExtra);
  const tiles = ex.map((m, i) => heftTile(m, TILE_CLS[i % 3])).join('') + dzSlot('slot_extra');
  return topBar('Extra Spaß', 'home') + dzHero('Freiwillig', 'Extra Spaß', 'Kleine Rechenspiele, wann immer du Lust hast. Es zählt jede Aufgabe, die du löst.', '', 'sm') + dzSec('Such dir was aus') + dzGrid(4, tiles, 'dz-extra4');
};

/* ---------- Meine Welt: fünf Kacheln, Wesen/Buch/Insel nur über Schalter ---------- */
function worldTile(id, i) {
  const f = FEATS[id], closed = f && f.creative && !creativeOK();
  const tag = closed ? (f.creative === 'closed' ? `${ico('lock', 13)} Noch zu` : `${ico('eye', 13)} Ansehen`) : '';
  const cls = TILE_CLS[i % 3];
  if (id === 'fakten') return dzTile({ cls, art: 'fakten', title: 'Lustige Fakten', sub: factsSub(), act: 'fakten' });
  if (id === 'shop') return dzTile({ cls, art: 'shop', title: 'Shop', sub: `${S.coins} Münzen`, act: 'shop' });
  if (id === 'musik') return dzTile({ cls, art: 'musik', title: 'Meine Musik', sub: closed ? 'Nach dem Üben' : (f.sub ? f.sub() : ''), act: 'musik', tag });

  if (id === 'welt') return dzTile({ cls, html: dzPassport(), title: 'Meine Weltreise', sub: (typeof wList === 'function') ? `${wList().filter(p => WA.isOpen(p.id)).length} Länder offen` : 'Entdeckerpass', act: 'welt' });
  const nm = { wesen: 'Meine Wesen', buch: 'Mein Buch', insel: 'Meine Insel' }[id];
  return dzTile({ cls, art: id === 'wesen' ? 'fino' : id === 'buch' ? 'hefte' : 'welt', title: nm, sub: f && f.sub ? f.sub() : '', act: id, tag });
}
VIEWS.rewards = () => {
  const ids = ['fakten', 'musik', 'shop', 'story', 'welt'].concat(DZ_FLAGS.map(x => x.id).filter(flagOn)).filter(id => id === 'shop' || FEATS[id]);
  return topBar('Meine Welt', 'home') + dzHero('', 'Meine Welt', 'Von dir verdient. Für dich gemacht.', '', 'sm') + dzSec('Entdecken & sammeln') +

};

/* ---------- Mein Profil: Bild, Level, alles Verdiente, Namen ----------

const avNameEditor = () => `<div class="rh-name"><label for="avNameIn">Name für meinen Avatar</label><div class="row"><input class="txt" id="avNameIn" maxlength="20" value="${esc(S.avName || '')}" placeholder="${esc(S.name || 'Spitzname')}" autocomplete="off"><button class="btn" data-act="saveAvName">Speichern</button></div><small>Steht in deinem Profil. Leer lassen = dein Name.</small></div>`;

    <div class="dz-stats">

/* =====================================================================
   GEO: Länder-Entdecker (Europa) – Quiz mit Auswertung am Ende + Länderkarten
   ---------------------------------------------------------------------
   Daten: geo_data.js (COUNTRIES, FLAGS). Weitere Kontinente = nur Daten, kein Umbau hier (alles läuft über cont).
   Fragearten (GQ.qs[].t):  cap = Land → Hauptstadt wählen · typ = Hauptstadt tippen · rev = Hauptstadt → Land wählen · nb = Nachbarland wählen
   Rückmeldung erst am Ende (wie der Mini-Test); bis zum Abgeben darf jede Antwort geändert werden.
   Belohnung (ein gemeinsamer Münz-Topf, aber mit Tageslimit): zählt pro Tag das BESTE Ergebnis, ein besseres zahlt nur die Differenz.
     ≥ 90 % → 5 Münzen + 2 Sterne · ≥ 70 % → 3 Münzen + 1 Stern · ≥ 50 % → 1 Stern · 100 % → einmal pro Tag eine Karte.
     Nur Runden mit mindestens 10 Fragen zahlen. Bis zu 10 beantwortete Fragen pro Tag zählen zum Tagesziel.
   Einmalige Meilensteine: 10 / 25 / alle Länder „sicher gewusst“ (= in 2 verschiedenen Runden richtig).
   Gespeichert in S.geo (Standardwerte in store.js DEF) – bestehende Münzen, Sterne, Karten und Pokale werden nie angefasst.
   ===================================================================== */
const GEO_NAME = 'Europa Entdecker', GEO_PASS = 'Meine Stempel';                       // Name des Fachs (eine Stelle ändern genügt)
const GEO_TIERS = [[.9, 5, 2], [.7, 3, 1], [.5, 0, 1]];    // [Anteil richtig, Münzen, Sterne]
const GEO_GOAL_CAP = 10, GEO_MIN_PAY = 10;
const GEO_MS = [[10, 1, 0, 'Länder-Kenner'], [25, 2, 5, 'Länder-Profi'], [50, 3, 10, 'Europa-Meister']];   // [Länder, Sterne, Münzen, Name] + jeweils 1 Karte
let GQ = null;                                             // laufende Runde (wird nie gespeichert)

function gS() {
  const g = S.geo || (S.geo = {});
  ['seen', 'ok', 'miss', 'k', 'cards', 'ms', 'kd'].forEach(k => { if (!g[k] || typeof g[k] !== 'object') g[k] = {}; });
  ['sessions', 'perf', 'tpf', 'kpf', 'best'].forEach(k => { if (typeof g[k] !== 'number') g[k] = 0; });
  return g;
}
const gList = cont => COUNTRIES.filter(c => c.cont === (cont || 'europa'));
const gKnown = id => (gS().k[id] || 0) >= 2;
const gKnownN = cont => gList(cont).filter(c => gKnown(c.id)).length;
const gNorm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/ae|oe|ue/g, m => m[0]).replace(/[^a-z0-9]/g, '');
const gCapOK = (c, typed) => { const t = gNorm(typed); return !!t && [c.cap].concat(c.calt || []).some(x => gNorm(x) === t); };
const gTrivial = c => gNorm(c.cap) === gNorm(c.name);     // Hauptstadt heißt wie das Land → in „tippen“ und „Land finden“ zu leicht

/* ---------- Fragen bauen ---------- */
function gWeight(id) { const g = gS(); return Math.max(.5, 1 + 1.5 * Math.min(g.miss[id] || 0, 3) - .5 * Math.min(g.k[id] || 0, 2)); }
function gPick(pool, n) {                                  // gewichtet ohne Wiederholung: früher Verpasstes kommt öfter dran
  const arr = pool.map(c => ({ c, w: gWeight(c.id) })), out = [];
  while (out.length < n && arr.length) {
    let r = Math.random() * arr.reduce((a, x) => a + x.w, 0), i = 0;
    for (; i < arr.length - 1; i++) { r -= arr[i].w; if (r <= 0) break; }
    out.push(arr[i].c); arr.splice(i, 1);
  }
  return out;
}
function gOptsCap(c, tricky) {
  const others = gList(c.cont).filter(x => x.id !== c.id && gNorm(x.cap) !== gNorm(c.cap)), seen = new Set([gNorm(c.cap)]), pick = [];
  const add = name => { if (name && !seen.has(gNorm(name)) && pick.length < 3) { seen.add(gNorm(name)); pick.push(name); } };
  if (tricky) { if (c.trap) add(c.trap); shuffle(c.tr.map(i => CBY[i]).filter(Boolean)).forEach(x => add(x.cap)); }
  shuffle(others.filter(x => x.reg === c.reg)).slice(0, tricky ? 2 : 1).forEach(x => add(x.cap));
  shuffle(others).forEach(x => add(x.cap));
  return shuffle([c.cap].concat(pick)).map(t => ({ k: t, label: esc(t) }));
}
function gOptsCountry(c, tricky, avoid) {                  // 1 richtiges + 3 falsche Länder (avoid = Länder, die NICHT als falsch erscheinen dürfen)
  const others = gList(c.cont).filter(x => x.id !== c.id && !(avoid || []).includes(x.id)), pick = [];

/* =====================================================================
   INSEL: ein Lern-Rückblick, kein Baukasten. Jede fertige Übungsgruppe (S.stats.decks) bringt den nächsten
   Gegenstand an seinen festen Platz; ein ganzes Heft bringt ein größeres Gebäude. Alles ergibt sich aus dem
   Fortschritt (nichts wird gespeichert, nichts geht verloren). Kommende Plätze sind grau umrandet.
   S.ins.n = zuletzt gezeigte Anzahl (nur für den kleinen Hinweis); alte Formen von S.ins werden ignoriert.
   ===================================================================== */
/* Gruppen-Gegenstände in fester Reihenfolge: [Emoji, Name, x, y, Größe] auf einer 1000×560-Zeichenfläche */
const INS_GROUP = [
  ['🌳', 'Baum', 190, 340, 68], ['🌷', 'Blumen', 330, 400, 42], ['🌿', 'Busch', 140, 392, 46], ['🍄', 'Pilz', 430, 452, 36],
  ['bridge', 'Brücke', 500, 380, 76], ['⛺', 'Zelt', 650, 300, 58], ['🛶', 'Kanu', 110, 486, 54], ['🌴', 'Palme', 770, 352, 68],
  ['🏡', 'Hütte', 380, 270, 72], ['⛲', 'Brunnen', 620, 440, 50], ['🌻', 'Sonnenblumen', 710, 424, 42], ['⛵', 'Segelboot', 870, 478, 56],
  ['🌈', 'Regenbogen', 520, 150, 112], ['🎡', 'Riesenrad', 850, 300, 88], ['🎈', 'Ballon', 690, 170, 52]
];
/* Heft-Gebäude: Heft-Id → [Emoji, Name, x, y, Größe] */
const INS_BOOK = { A4: ['🗼', 'Leuchtturm', 930, 392, 96], A5: ['🏰', 'Burg', 250, 235, 100] };
const INS_FLAG = ['🚩', 'Fahne', 520, 238, 54];
const insTotal = () => MODULES.reduce((a, m) => a + m.topics.length, 0);
const bookDone = m => m.topics.every(t => { const r = S.topics[tk(m.id, t.id)]; return !!(r && r.fl && r.fl.deck); });
/* alle Plätze mit Zustand; `left` = wie viele Gruppen noch fehlen */
function insSpots() {
  const dk = S.stats.decks || 0, a = [];
  INS_GROUP.forEach((g, i) => a.push({ e: g[0], n: g[1], x: g[2], y: g[3], s: g[4], got: dk >= i + 1, left: Math.max(0, i + 1 - dk), why: `Gruppe ${i + 1} beenden` }));
  MODULES.filter(m => INS_BOOK[m.id]).forEach(m => {
    const b = INS_BOOK[m.id], rest = m.topics.filter(t => !((S.topics[tk(m.id, t.id)] || {}).fl || {}).deck).length;
    a.push({ e: b[0], n: b[1], x: b[2], y: b[3], s: b[4], got: rest === 0, left: rest, why: `Alle Gruppen im Heft ${m.id} beenden`, big: true });
  });
  const tot = insTotal(); a.push({ e: INS_FLAG[0], n: INS_FLAG[1], x: INS_FLAG[2], y: INS_FLAG[3], s: INS_FLAG[4], got: dk >= tot, left: Math.max(0, tot - dk), why: 'Alle Gruppen beenden' });
  return a;
}
function insNext(sp) {
  const nx = sp.filter(s => !s.got).sort((a, b) => a.left - b.left)[0];
  return nx ? `Nächstes: ${nx.n} – beende noch ${nx.left} Gruppe${nx.left > 1 ? 'n' : ''}${nx.big ? ' im Heft' : ''}` : 'Alles geschafft – deine Insel ist fertig!';
}
const insNum = sp => sp.filter(s => s.got).length;
function insBlob(cx, cy, rx, ry, seed) {
  const pts = []; for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2, k = 1 + .04 * Math.sin(3 * a + seed) + .03 * Math.sin(5 * a + seed * 2); pts.push([(cx + Math.cos(a) * rx * k).toFixed(1), (cy + Math.sin(a) * ry * k).toFixed(1)]); }
  return 'M' + pts.map(p => p.join(' ')).join('L') + 'Z';
}
const insArt = (s, cls) => s.e === 'bridge'
  ? `<g class="${cls || ''}" transform="translate(${s.x} ${s.y})"><path d="M-62 0Q0 -58 62 0" fill="none" stroke="#B88A5A" stroke-width="15" stroke-linecap="round"/><path d="M-62 -8Q0 -66 62 -8" fill="none" stroke="#8C6440" stroke-width="4"/><path d="M-44 -24v22M0 -40v26M44 -24v22" stroke="#8C6440" stroke-width="4"/></g>`
  : `<text x="${s.x}" y="${s.y}" font-size="${s.s}" text-anchor="middle" class="${cls || ''}">${s.e}</text>`;
function insSVG(sp) {
  const sel = UI.insSel;
  let h = `<rect width="1000" height="560" fill="#EAF3F4"/><rect y="215" width="1000" height="345" fill="#CFE4EA"/>`;
  for (let i = 0; i < 4; i++) { const y = 250 + i * 80; h += `<path d="M0 ${y} Q 60 ${y - 8} 125 ${y} T 250 ${y} T 375 ${y} T 500 ${y} T 625 ${y} T 750 ${y} T 875 ${y} T 1000 ${y}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>`; }
  h += `<path d="${insBlob(500, 350, 420, 180, 1.3)}" fill="#F1E6C8"/><path d="${insBlob(500, 342, 396, 160, 1.3)}" fill="#C9DDB0"/><ellipse cx="500" cy="378" rx="120" ry="22" fill="#CFE4EA"/>`;
  sp.slice().sort((a, b) => a.y - b.y).forEach(s => {
    const i = sp.indexOf(s), on = sel === i, r = s.s * .62;
    h += `<g class="insp ${s.got ? 'got' : 'lk'} ${on ? 'on' : ''}" data-act="insTap" data-arg="${i}" role="button" aria-label="${esc(s.n)}">`
      + `<circle cx="${s.x}" cy="${s.y - s.s * .32}" r="${Math.max(r, 30)}" class="hit"/>`
      + (s.got ? insArt(s) : `<circle cx="${s.x}" cy="${s.y - s.s * .32}" r="${Math.min(Math.max(r, 26), 58)}" class="ph"/>${insArt(s, 'gh')}`)
      + `</g>`;
  });
  return `<svg viewBox="0 0 1000 560" class="insvg" role="img" aria-label="Deine Insel">${h}</svg>`;
}
VIEWS.insel = () => {
  const sp = insSpots(), sel = sp[UI.insSel], next = sp.filter(s => !s.got).sort((a, b) => a.left - b.left)[0];

};

/* =====================================================================
   MUSIK-WERKSTATT (Kreativ-Bereich, geschlossen bis Kreativzeit): kleiner Step-Sequencer mit WebAudio-Synthese (keine Samples).
   Start: EIN Schlagzeug-Klang, 8 Schritte, Play/Stopp, Tempo. Alles andere wird im Shop verdient (Katalog unten).
   Zustand: S.mus = laufendes Muster (Autosave), S.songs = „Meine Beats“. Alles hier heißt mu… / MU_… (ein gemeinsames Skript).
   Teile: 1 Klang · 2 Katalog · 3 Muster-Logik · 4 Abspielen · 5 Ansicht · 6 Aktionen
   ===================================================================== */
const MU_VIEWS = ['musik', 'musikSongs'];
const MU_SCALES = { dpent: { st: [0, 2, 4, 7, 9] }, mpent: { st: [0, 3, 5, 7, 10] }, dur: { st: [0, 2, 4, 5, 7, 9, 11] } };
const MU_NOTE = ['C', 'Cis', 'D', 'Dis', 'E', 'F', 'Fis', 'G', 'Gis', 'A', 'B', 'H'];
const muFreq = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---------- Bausteine ---------- */
const muNoiseBufs = new WeakMap();
function muNoise(c) {
  let b = muNoiseBufs.get(c);
  if (!b) { b = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0); let s = 1234567; for (let i = 0; i < d.length; i++) { s = (s * 1664525 + 1013904223) >>> 0; d[i] = s / 2147483648 - 1; } muNoiseBufs.set(c, b); }
  return b;
}
const muG = (c, v) => { const g = c.createGain(); g.gain.value = v == null ? 1 : v; return g; };
const muF = (c, type, f, q) => { const x = c.createBiquadFilter(); x.type = type; x.frequency.value = f; if (q) x.Q.value = q; return x; };
function muOsc(c, type, f, t, dur) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + .05); return o; }
function muNz(c, t, dur) { const s = c.createBufferSource(); s.buffer = muNoise(c); s.loop = true; s.start(t, (t * 7.31) % .5); s.stop(t + dur + .05); return s; }
function muEnv(g, t, a, pk, d) { const p = g.gain; p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(Math.max(pk, 0.0002), t + a); p.exponentialRampToValueAtTime(0.0001, t + a + d); }
function muNoiseHit(c, t, v, o, type, f, q, a, d) { const n = muNz(c, t, a + d), fl = muF(c, type, f, q), g = muG(c, 0); muEnv(g, t, a, v, d); n.connect(fl); fl.connect(g); g.connect(o); }
function muTone(c, t, v, o, type, f, d, a, f1, sw) { const os = muOsc(c, type, f, t, (a || .002) + d); if (f1) os.frequency.exponentialRampToValueAtTime(f1, t + (sw || .1)); const g = muG(c, 0); muEnv(g, t, a || .002, v, d); os.connect(g); g.connect(o); return os; }

/* ---------- Synthese-Rezepte: (ctx, zeit, lautstärke, ziel, midi-note) ---------- */
const MU_SYN = {
  kick(c, t, v, o) { muTone(c, t, v * .95, o, 'sine', 150, .4, .002, 45, .12); },
  snare(c, t, v, o) { muNoiseHit(c, t, v * .7, o, 'highpass', 1400, 0, .001, .17); muTone(c, t, v * .5, o, 'triangle', 190, .1, .001, 118, .08); },
  hat(c, t, v, o) { muNoiseHit(c, t, v * .55, o, 'highpass', 7000, 0, .001, .045); },
  clap(c, t, v, o) { [0, .013, .026].forEach(d => muNoiseHit(c, t + d, v * .85, o, 'bandpass', 1250, 1.2, .001, .02)); muNoiseHit(c, t + .039, v * .9, o, 'bandpass', 1250, 1, .002, .16); },
  wood(c, t, v, o) { const f = muF(c, 'bandpass', 1050, 4); f.connect(o); muTone(c, t, v * 1.1, f, 'sine', 1050, .06, .001, 880, .03); },
  cow(c, t, v, o) { const f = muF(c, 'bandpass', 830, 1.4); f.connect(o); [560, 845].forEach(fr => { const os = muOsc(c, 'square', fr, t, .3), g = muG(c, 0); muEnv(g, t, .001, v * .3, .26); os.connect(g); g.connect(f); }); },

  else if (s.phase === 'ok') body = `<p class="sc-t">${nameIn(sc.say)}</p><p class="sc-t" style="color:var(--ok)">✔ ${nameIn(sc.puzzle.ok)}</p>`;
  const needBtn = !['choice', 'puzzle'].includes(s.phase);

  <div class="sc-stage">${scBG(sc.bg)}

      ${speakerNpc ? `<div class="sc-c npc on"><span class="sc-npc">${sc.npc}</span></div>` : ''}
      <div class="sc-c du ${sc.who === 'du' ? 'on' : ''}">${duHTML}</div>

  <div class="card sc-box">${who ? `<div class="sc-who">${esc(who)}</div>` : ''}${body}
    <div class="sc-nav"><div class="dots" style="max-width:240px">${ep.scenes.map((_, k) => `<i class="${k < s.i ? 'done' : k === s.i ? 'cur' : ''}"></i>`).join('')}</div>${needBtn ? `<button class="btn big" data-act="storyNext">${last && s.phase === 'say' ? 'Ende 🏁' : 'Weiter ▶'}</button>` : ''}</div></div>`;

function scEnter(i) {
  const ep = epList().find(e => e.id === SC().ep), sc = ep.scenes[i];
  UI.sc.i = i; UI.sc.bad = []; UI.sc.pick = null;
  UI.sc.phase = sc.choice ? 'choice' : sc.puzzle ? 'puzzle' : 'say';
  S.story.read[ep.id] = Math.max(S.story.read[ep.id] || 0, i); save(); render();
}
registerFeature({
  id: 'story', title: 'Story', icon: 'story', tint: 'lav', group: 'world', order: 50, view: 'story',
  sub: () => { const nx = epList().find(ep => !epUnlocked(ep)); return nx ? `Noch ${grp(epLeft(nx))} bis zur nächsten Episode` : `${epList().length} von ${epList().length} Episoden`; },
  badge: () => epList().some(ep => epUnlocked(ep) && !S.story.done[ep.id] && !(S.story.read[ep.id] > 0)) ? 'neu' : '',
  views: {},
  acts: {
    storyOpen: id => { const ep = epList().find(e => e.id === id); if (!ep || !epUnlocked(ep)) return; const i = S.story.done[id] ? 0 : Math.min(S.story.read[id] || 0, ep.scenes.length - 1); UI.sc = { ep: id }; view = 'storyread'; scEnter(i); },

    },

    storyAns: k => { const s = SC(), ep = epList().find(e => e.id === s.ep), sc = ep.scenes[s.i]; if (+k === sc.puzzle.c) { s.phase = 'ok'; sfx('ok'); } else { s.bad.push(+k); sfx('tap'); } render(); }
  }

/* =====================================================================
   WELT: „Meine Weltreise“ – ruhige Belohnung in Meine Welt
   ---------------------------------------------------------------------
   Daten: world_data.js (WP = Länder, WSTAT = 6 Stationen). Zustand: S.world (Standardwerte in store.js DEF).
   Sterne: frei = gesammelte Sterne (S.starsLife) − für Länder ausgegebene (S.world.spent). S.stars / S.starsLife werden hier NIE geschrieben,
           Wesen, Pokale, Münzen und Karten bleiben unberührt. Weltreise zahlt weder Münzen noch Karten aus (nur Souvenirs, Stempel, Pokale).
   Ein geöffnetes Land bleibt für immer offen, alle Stationen frei wählbar. Stempel nach W_STAMP_AT von 6 Stationen.
   Die Oberfläche spricht nur mit dem Adapter WA (unten) – nie direkt mit S.
   Eltern (PIN): Name im Pass, Foto (Avatar/Fino), welche noch gesperrten Länder angeboten werden.
   ===================================================================== */
const W_NAME = 'Meine Weltreise', W_PASS = 'Mein Reisepass';
const wDay = () => ymd();
function wS() {
  const w = S.world || (S.world = {});
  ['open', 'seen', 'stamps', 'souv', 'quiz', 'pass', 'off'].forEach(k => { if (!w[k] || typeof w[k] !== 'object' || Array.isArray(w[k])) w[k] = {}; });
  if (!Array.isArray(w.log)) w.log = [];
  if (typeof w.spent !== 'number' || w.spent < 0) w.spent = 0;
  return w;
}

/* ---------- Adapter: die einzige Tür zum Zustand ---------- */
const WA = {
  freeStars: () => Math.max(0, (S.starsLife || 0) - wS().spent),
  isOpen: id => !!WP[id] && (WP[id].cost === 0 || !!wS().open[id]),
  shown: id => !!WP[id] && (WA.isOpen(id) || !wS().off[id]),                  // vom Elternteil ausgeblendete, noch gesperrte Länder
  canOpen: id => !!WP[id] && !WA.isOpen(id) && WA.freeStars() >= WP[id].cost,
  openCountry(id) {
    if (!WA.canOpen(id)) return false;
    const w = wS(); w.spent += WP[id].cost; w.open[id] = wDay(); save(); return true;
  },
  seen: id => wS().seen[id] || {},
  marks: id => WSTAT.filter(s => WA.seen(id)[s[0]]).length,
  pct: id => Math.round(100 * WA.marks(id) / WSTAT.length),
  stamped: id => !!wS().stamps[id],
  stampN: () => Object.keys(wS().stamps).length,
  souvs: id => wS().souv[id] || [],
  souvN: () => Object.values(wS().souv).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0),
  addSouv(id, st) { const w = wS(), l = w.souv[id] || (w.souv[id] = []); if (!l.includes(st)) { l.push(st); return true; } return false; },
  markSeen(id, st) {                                                       // true = neu besucht
    if (!WA.isOpen(id) || !WSTAT.some(x => x[0] === st)) return false;
    const w = wS(), sn = w.seen[id] || (w.seen[id] = {});
    if (sn[st]) return false;
    sn[st] = wDay();
    if (st !== 'quiz') WA.addSouv(id, st);
    w.log.unshift({ c: id, st, d: wDay() }); if (w.log.length > 40) w.log.length = 40;
    if (!w.stamps[id] && WA.marks(id) >= W_STAMP_AT) { w.stamps[id] = wDay(); UI.wStampNew = id; }
    save(); checkTrophies();
    return true;
  },
  saveQuiz(id, score) {
    const w = wS(), q = w.quiz[id] || (w.quiz[id] = { best: 0, tries: 0 });
    q.tries++; q.best = Math.max(q.best, score);
    if (score >= W_QUIZ_OK) { WA.addSouv(id, 'quiz'); WA.markSeen(id, 'quiz'); }
    save();
  },
  photo: size => (wS().pass.photo === 'fino') ? avatarHTML(finoLook(), size, 'happy') : avArt(size),
  childName: () => wS().pass.name || S.name || profileName(),
  exit: () => go('rewards')
};

/* ---------- Pokale (kein Geld dafür): Land · Kultur · Sprache · Orte · selten · geheim ---------- */
function worldTrophies() {
  const W = s => s.world || {}, seen = s => Object.values(W(s).seen || {}).filter(Boolean);
  const cnt = (s, st) => seen(s).filter(o => o[st]).length, culture = s => seen(s).filter(o => o.life && o.food).length;
  const stampIds = s => Object.keys(W(s).stamps || {}), conts = s => new Set(stampIds(s).map(id => (WP[id] || {}).cont).filter(Boolean)).size;
  const souvN = s => Object.values(W(s).souv || {}).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
  const masters = s => Object.keys(W(s).seen || {}).filter(id => WSTAT.every(x => W(s).seen[id][x[0]]) && ((W(s).souv || {})[id] || []).length >= WSTAT.length).length;
  const quiz4 = s => Object.values(W(s).quiz || {}).filter(q => q && q.best >= 4).length;
  const hid = (id, i, n, d, t) => ({ id, get i() { return S.trophies[id] ? i : '❓'; }, get n() { return S.trophies[id] ? n : 'Geheimer Pokal'; }, get d() { return S.trophies[id] ? d : 'Entdecke, wie du ihn bekommst.'; }, t });
  const fam = (p, i, n1, n2, n3, what, f, a, b, c) => [[1, n1, a], [2, n2, b], [3, n3, c]].map(([k, nm, num]) => ({ id: p + k, i, n: nm, d: what(num), t: s => f(s) >= num }));
  return [
    ...fam('wc', '🧭', 'Erster Stempel', 'Weltenbummler', 'Globetrotter', n => n === 1 ? '1 Stempel im Reisepass' : n + ' Stempel im Reisepass', s => stampIds(s).length, 1, 3, 10),
    { id: 'wc4', i: '🌍', n: 'Weltreisende', d: 'Alle 20 Stempel im Reisepass', t: s => stampIds(s).length >= 20 },
    ...fam('wk', '🎭', 'Kultur-Entdecker', 'Kultur-Kenner', 'Kultur-Profi', n => `Alltag und Essen in ${n} ${n === 1 ? 'Land' : 'Ländern'} besucht`, culture, 1, 5, 10),
    ...fam('ws', '💬', 'Sprachfuchs', 'Sprachtalent', 'Sprachkünstler', n => `Sprach-Station in ${n} ${n === 1 ? 'Land' : 'Ländern'} besucht`, s => cnt(s, 'language'), 1, 5, 10),
    ...fam('wl', '🏛️', 'Orte-Entdecker', 'Orte-Kenner', 'Orte-Profi', n => `Orte in ${n} ${n === 1 ? 'Land' : 'Ländern'} besucht`, s => cnt(s, 'places'), 1, 5, 10),
    ...fam('wm', '🎖️', 'Länder-Meister', 'Dreifach-Meister', 'Zehnfach-Meister', n => n === 1 ? 'Alle 6 Stationen und alle 6 Souvenirs in einem Land' : `Meister in ${n} Ländern`, masters, 1, 3, 10),
    hid('whello', '👋', 'Hallo in 5 Sprachen', 'Die Sprach-Station in 5 Ländern besucht', s => cnt(s, 'language') >= 5),
    hid('wsouv', '🧳', 'Souvenir-Fan', '12 Souvenirs gesammelt', s => souvN(s) >= 12),
    hid('wquiz', '🦊', 'Rätsel-Fuchs', 'In 3 Ländern alle 4 Rätselfragen richtig', s => quiz4(s) >= 3),
    hid('whome', '🏡', 'Zuhause entdeckt', 'Alle 6 Stationen in Deutschland besucht', s => WSTAT.every(x => ((W(s).seen || {}).deu || {})[x[0]])),
    hid('wround', '🌏', 'Rund um die Welt', 'Stempel auf 5 Kontinenten', s => conts(s) >= 5)
  ];
}

/* ---------- kleine Bausteine ---------- */

/* ---------- Reise: links Szene + Begleiter, rechts Route + Station ---------- */
const wSouvLine = (p, st) => {
  const s = p.souv[st]; if (!s || !WA.souvs(p.id).includes(st)) return '';
  return `<div class="w-souvline">${wSouvSVG(s, false)}<span>Souvenir: <b>${esc(s.n)}</b>${UI.wNew === p.id + ':' + st ? ' · neu im Pass' : ''}</span></div>`;
};
const wHead = (p, d, extra) => `<div class="w-head"><div><h2>${esc(d.title)}</h2><p>${esc(d.lead)}</p></div>${wFlag(p.id, 'w-hflag')}</div>

  views: { weltReise: VIEWS.weltReise, weltPass: VIEWS.weltPass, weltEltern: VIEWS.weltEltern },
  leave: () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { } },
  acts: {
    welt: () => go('welt'),
    wBoard: id => { if (WA.isOpen(id)) wLand(id); },
    wLock: id => {
      const p = WP[id]; if (!p) return;
      if (WA.isOpen(id)) return wLand(id);
      const free = WA.freeStars();
      if (free >= p.cost) modal(`${esc(p.name)} öffnen?`, `Das kostet <b>einmal ${p.cost} ⭐</b> von deinen freien Sternen. Du hast ${free}, danach ${free - p.cost}.<br>Deine gesammelten Sterne, Wesen und Pokale bleiben. Das Land bleibt danach für immer offen.`, 'Öffnen', 'wOpenYes', id, 'Später');
      else modal(`${esc(p.name)} ist noch zu`, `Dir fehlen noch <b>${p.cost - free} ⭐</b> (${p.cost} ⭐ kostet das Land, du hast ${free}). Sterne bekommst du beim Üben.`, null, '', '', 'Okay');
    },
    wOpenYes: id => { closeModal(); if (!WA.openCountry(id)) return; wQuietly(() => checkTrophies()); wFlight(id, () => wLand(id)); },
    wFlightSkip: () => { if (UI.wFlightEnd) UI.wFlightEnd(); },
    wStation: st => {
      const p = WP[UI.wId]; if (!p || !WSTAT.some(x => x[0] === st)) return;
      UI.wSt = st; UI.wNew = null; UI.wMsg = '';
      if (st !== 'quiz') { const fresh = wQuietly(() => WA.markSeen(p.id, st)); if (fresh) { UI.wNew = p.id + ':' + st; UI.wMsg = `${WSTAT.find(x => x[0] === st)[1]} besucht`; } }
      render(); wAfterMark(p.id);
    },
    wSay: i => { const p = WP[UI.wId], w = p && p.st.language.words[+i]; if (!w) return; if (!wSpeak(w[0], p.speech)) toast('🔇', 'Auf diesem Gerät gibt es keine Sprachausgabe. Lies die Aussprache mit.'); },
    wQuizStart: () => { UI.wQz = wQuizBuild(WP[UI.wId]); render(); },
    wQuizPick: k => { const Q = UI.wQz, q = Q && Q.qs[Q.i]; if (!q || q.pick != null) return; q.pick = +k; if (q.opts[q.pick] === q.ok) Q.score++; sfx(q.opts[q.pick] === q.ok ? 'tap' : 'pop'); render(); },
    wQuizNext: () => {
      const Q = UI.wQz; if (!Q) return;
      if (Q.i < Q.qs.length - 1) Q.i++;
      else { Q.done = true; const had = WA.souvs(Q.id).includes('quiz'), all = Q.score === Q.qs.length; if (all) { WA.saveQuiz(Q.id, Q.score); sfx('ok'); confetti(70); toast('🏆', 'Alles richtig! Stark gemacht!'); } else wQuietly(() => WA.saveQuiz(Q.id, Q.score)); if (!had && Q.score >= W_QUIZ_OK) { UI.wNew = Q.id + ':quiz'; UI.wMsg = 'Rätsel geschafft'; } }
      render(); wAfterMark(Q.id);
    },
    wPassGo: () => { UI.wBookSeen = false; go('weltPass'); },
    wParent: () => requirePin('weltEltern'),
    weltEltern: () => go('weltEltern'),
    wSaveEltern: () => {
      const w = wS(), n = $('#wpName'), ph = document.querySelector('input[name=wpPhoto]:checked');
      w.pass.name = ((n && n.value) || '').trim().slice(0, 20);
      const gv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      w.pass.birth = /^\d{4}-\d\d-\d\d$/.test(gv('wpBirth')) ? gv('wpBirth') : ''; w.pass.bplace = gv('wpBplace').slice(0, 24); w.pass.res = gv('wpRes').slice(0, 24); w.pass.photo = ph && ph.value === 'fino' ? 'fino' : 'avatar';
      document.querySelectorAll('[data-wpack]').forEach(el => { if (el.checked) delete w.off[el.dataset.wpack]; else w.off[el.dataset.wpack] = 1; });
      save(); toast('✅', 'Gespeichert'); go('weltPass');
    }
  }
});

/* =====================================================================
   WESEN: acht Eier schlüpfen nacheinander, wenn die gesammelten Sterne (S.starsLife) ihre Marke erreichen,
   und wachsen mit weiteren Sternen (3 Stufen). Alles ergibt sich aus den Sternen – keine Pflege, keine Strafe,
   keine Zeitgeber. S.wes.hn = Anzahl der schon gemeldeten Schlüpf-Momente (alte Formen von S.wes werden ignoriert).
   ===================================================================== */
const WESEN = [                                   // [Emoji, Name, Sterne bis zum Schlüpfen, Eifarbe]
  ['🐼', 'Panda', 3, '#E3E3EC'], ['🐸', 'Frosch', 10, '#CFE8C8'], ['🦉', 'Eule', 20, '#E8DCC8'], ['🐢', 'Schildkröte', 32, '#C9E6DA'],
  ['🐙', 'Krake', 46, '#D9D2F2'], ['🐧', 'Pinguin', 62, '#CFE1F2'], ['🐇', 'Hase', 80, '#F0E2D2'], ['🐲', 'Drache', 100, '#CDEBD3']
].map(([e, name, at, col]) => ({ e, name, at, col }));
const wesStage = w => { const d = S.starsLife - w.at; return d >= 25 ? 3 : d >= 10 ? 2 : 1; };
const wesHatched = () => WESEN.filter(w => S.starsLife >= w.at);
const wesEgg = (col, size) => `<svg class="egg" viewBox="0 0 100 120" width="${size}" height="${size * 1.2}"><path d="M50 8C74 8 90 48 90 74a40 40 0 0 1-80 0C10 48 26 8 50 8Z" fill="${col}" stroke="#9AA0B0" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="38" cy="62" r="5" fill="#9AA0B0" opacity=".4"/><circle cx="62" cy="80" r="5" fill="#9AA0B0" opacity=".4"/><circle cx="46" cy="96" r="4" fill="#9AA0B0" opacity=".4"/></svg>`;
const wesIcon = (w, size) => `<span class="wes-i st${wesStage(w)}" style="font-size:${size || 56}px">${w.e}</span>`;
VIEWS.wesen = () => {
  const got = wesHatched(), nx = WESEN.find(w => S.starsLife < w.at), sel = WESEN[UI.wesSel];
  const next = nx ? `Nächstes Ei: noch ${nx.at - S.starsLife} ⭐ bis es schlüpft` : 'Alle Eier sind geschlüpft!';
  const detail = sel && S.starsLife >= sel.at ? `<div class="card wes-detail"><div class="wd-art">${wesIcon(sel, 110)}</div><div class="sp"><h2>${esc(sel.name)}</h2><p class="mute small" style="margin:4px 0 0">Wachstum ${wesStage(sel)} von 3${wesStage(sel) < 3 ? ` · wächst weiter bei ${sel.at + (wesStage(sel) === 1 ? 10 : 25)} ⭐` : ' · ausgewachsen'}</p></div></div>` : '';
  return topBar(ico('egg', 26) + ' Wesen') + `
  <div class="card insnx"><b>${next}</b><span class="small mute">${got.length} von ${WESEN.length} Wesen · du hast ${S.starsLife} ⭐ gesammelt</span></div>
  ${detail}
  <div class="wgrid">${WESEN.map((w, i) => S.starsLife >= w.at
    ? `<button class="wtile ${UI.wesSel === i ? 'on' : ''}" data-act="wesSel" data-arg="${i}">${wesIcon(w, 56)}<b>${esc(w.name)}</b></button>`
    : `<div class="wtile lk rh-wes"><span class="rh-lock" aria-label="Gesperrt">${ico('lock', 13)}</span><div class="rh-wes-preview"><span>${w.e}</span>${wesEgg(w.col, 30)}</div><b>${esc(w.name)}</b><small>Schlüpft bei ${w.at} ⭐</small></div>`).join('')}</div>`;
};
registerFeature({
  id: 'wesen', title: 'Wesen', icon: 'egg', tint: 'peach', group: 'world', order: 40, view: 'wesen',
  sub: () => `${wesHatched().length} von ${WESEN.length} Wesen`,
  check: () => {                                   // ein leiser Hinweis pro neu geschlüpftem Wesen
    const n = wesHatched().length;
    if (typeof S.wes.hn !== 'number') { S.wes.hn = n; return; }
    if (n > S.wes.hn) { S.wes.hn = n; toast('🐣', `Ein Ei ist geschlüpft: <b>${esc(WESEN[n - 1].name)}</b>`); save(); }
  },
  acts: { wesSel: i => { UI.wesSel = UI.wesSel === +i ? null : +i; sfx('tap'); render(); } }
});

/* BOOT – läuft als Letztes, wenn alle Module (app.js, feat_*.js) geladen sind */
/* ---------- boot ---------- */
window.__app = {
  get S() { return S; }, set S(v) { S = v; }, get R() { return R; }, get T() { return T; }, get view() { return view; }, get PIN() { return PIN; }, UI, MODULES, SHOP, CARDS, ACT, VIEWS, FEATS, CATALOG, hasItem, unlock, buyItem, checkUnlocks, openChest, stampsOf, nextGoals,
  startDeck, startMistakes, startTest, press, check, pickChoice, next, fieldOK, newCtx, isCorrect, levelInfo, medalOf, trophyList, checkTrophies, finishTest, remaining,
  mergeState, render, go, giveCoins, buy, equip, topicRec, importData, tk, qBody, mascotSVG, getDeck, deckPts, deckMax, deckFinished, newRound, bestRound, blockMax, qPts, ptsOf, newDeck, starNeed, NEW_DECK_MAX, NEW_BLOCK_MAX, TIER, deckWrong, blockPts, resetDeck, requirePin, pinKey, limitHit, openChest, save, load, dailyCheck, touchDay, creativeOK, creativeLeft, grantCreative, creativeMode, shopLeft, goalItem, nextUp, startNext, FN, shopAt, noteEarn, CHAPTERS, KIND, itemsOf, itemTile, featOf
};
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
touchDay();
Object.values(FEATS).forEach(f => { if (f.boot) { try { f.boot(); } catch (e) { console.error(e); } } });
try { checkUnlocks(); } catch (e) { console.error(e); }
render();
idbGet().then(j => {                                // zweite Kopie: falls der Hauptspeicher leer/älter ist
  try {
    const o = j ? JSON.parse(j) : null;
    if (o && (o.saved || 0) > (S.saved || 0) + 1000) { S = mergeState(o); touchDay(); try { checkUnlocks(); } catch (e) { } toast('♻️', 'Fortschritt wiederhergestellt'); render(); }
  } catch (e) { }
  save();
});

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }

</script>
