<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1764d5">
<title>Denkzauber · Klasse 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ===== Mathe-Abenteuer · weicher Pastell-Look (kein Pink) ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Nunito","Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.4;font-weight:600;color:var(--ink);background:var(--bg);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;letter-spacing:.005em;
}
/* Ruhige Basis: warmes Off-White. Das Thema (Shop „Farben“) bestimmt nur den Akzent: --pri (Fläche/Text), --pri2 (hell), --acs (zarte Akzentfläche) */
body{--bg:#FBF8F2;--card:#fff;--ink:#2B2A33;--mute:#6F6B7A;--priInk:#fff;--soft:#F5F1E8;--line:#E6E0D3;--head:#EFE9DC;--ia:#E6E0D3;--acs:#ECE9FB}
body[data-theme="sonne"],body:not([data-theme]){--pri:#5B4BD6;--pri2:#8576F0;--acs:#ECE9FB}
body[data-theme="butter"]{--pri:#B26F00;--pri2:#E29A14;--acs:#FFF1CC}
body[data-theme="ocean"]{--pri:#2F6FD6;--pri2:#5A93EE;--acs:#E3EEFF}
body[data-theme="wald"]{--pri:#1B8A5E;--pri2:#47BE8C;--acs:#DFF3E8}
body[data-theme="sunset"]{--pri:#C9531D;--pri2:#F08350;--acs:#FFE9DB}
body[data-theme="regen"]{--pri:#5B4BD6;--pri2:#20BF9B;--acs:#E8F4F0}
body[data-theme="tuerkis"]{--pri:#12808E;--pri2:#2BB5C1;--acs:#DDF3F1}
body[data-theme="nacht"]{--bg:#17172F;--card:#22223F;--ink:#F1F0FF;--mute:#B1AEDD;--pri:#8B7DF0;--pri2:#A396FF;--priInk:#fff;--soft:#1E1E3A;--line:#3A3A66;--head:#2D2D55;--ia:#3A3A66;--acs:#2D2D55;--ok:#4be08d;--okBg:#1f5a45;--bad:#ff8a8a}
body{--ok:#1f9a62;--okBg:#DDF6E8;--bad:#D6453D;--badBg:#FDE6E3;--gold:#E0A800;--sh:none;--r:20px}
body[data-theme="nacht"]{--ok:#4be08d;--okBg:#1f5a45;--bad:#ff8a8a;--badBg:#5f2b3c;--sh:none}
/* Farbtöne für Kacheln */
.t-lav{--tb:#E9E4FF;--ti:#5B4BD6}.t-mint{--tb:#D9F5E8;--ti:#16875B}.t-peach{--tb:#FFE3D3;--ti:#C9531D}.t-sky{--tb:#DCEBFF;--ti:#2961C4}.t-butter{--tb:#FFF1B8;--ti:#9A6A00}.t-sage{--tb:#E4EFD3;--ti:#4F7A1F}
body[data-theme="nacht"] .t-lav{--tb:#3A3A78;--ti:#C4BCFF}body[data-theme="nacht"] .t-mint{--tb:#1F5A45;--ti:#8DF0C0}body[data-theme="nacht"] .t-peach{--tb:#5C3A33;--ti:#FFC2A0}body[data-theme="nacht"] .t-sky{--tb:#2B4A7E;--ti:#B7D6FF}body[data-theme="nacht"] .t-butter{--tb:#5A4C1E;--ti:#FFE08A}body[data-theme="nacht"] .t-sage{--tb:#34502A;--ti:#CDEFA6}

#app{max-width:1120px;margin:0 auto;padding:14px 16px 44px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.005em}
h2{font-size:1.5rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute)}
.center{text-align:center}
.ico{display:block;flex:none;--ia:inherit}
.ico .a{fill:var(--ia,transparent)}
.small{font-size:.9rem}

/* ===== Buttons / Karten ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:999px;font-weight:800;font-size:1.02rem;color:var(--priInk);background:var(--pri);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--sh);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.big{min-height:60px;font-size:1.18rem;padding:12px 32px}
.btn.sm{min-height:40px;padding:6px 16px;font-size:.93rem}
.btn.ic{padding:0;width:46px;min-height:46px;border-radius:50%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.red{background:#E2574C}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px 5px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;white-space:nowrap;box-shadow:0 1px 2px rgba(42,36,87,.04)}
.chip b{font-size:1.05rem}
.cur{display:inline-flex}.cur-c{color:#C98A00;--ia:#FFE08A}.cur-s{color:#D79A00;--ia:#FFE680}.cur-f{color:#E5632B;--ia:#FFC9A8}

/* ===== Kopfzeile ===== */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .back{min-width:46px;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%}
.top h2{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
.top h2 .ico{color:var(--pri)}
.stats{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Avatar + Rahmen ===== */
.avatar{position:relative;border-radius:50%;overflow:hidden;background:var(--acs);flex:none}
.avwrap{display:inline-block;padding:0;border-radius:50%;flex:none;width:var(--s,96px);height:var(--s,96px)}
.avwrap>.avatar{width:100%;height:100%}
.avwrap.fr-gold{padding:6px;background:conic-gradient(#fff0a0,#f5b400,#fff0a0,#d89500,#fff0a0)}
.avwrap.fr-regen{padding:6px;background:conic-gradient(#ff7a6b,#ffc34d,#7ed957,#5aa7ff,#8c7bff,#ff7a6b)}
.avwrap.fr-sterne{padding:6px;background:conic-gradient(#2a2f7a,#8c9bff,#2a2f7a,#ffe27a,#2a2f7a,#8c9bff,#2a2f7a)}
.avwrap:not([class*="fr-"]){padding:4px;background:var(--card);box-shadow:var(--sh)}
.avatar svg,.mascot{display:block;width:100%;height:100%}
.m-cheer .avatar>svg{animation:hop .55s ease-in-out 3}
.m-cheer .mbody{animation:hop .55s ease-in-out 3;transform-origin:50% 100%}
.m-sad .mbody{animation:sway 1.1s ease-in-out 2;transform-origin:50% 100%}
.m-think .mbody{animation:sway 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}

/* ===== Startbildschirm: siehe unten (Shell) ===== */
.hello{font-size:1.7rem;font-weight:800;line-height:1.15}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .5s}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px;margin-top:10px;font-weight:700}
.badge{position:absolute;top:10px;right:10px;min-width:24px;height:24px;border-radius:99px;background:var(--pri);color:var(--priInk);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 7px}
.sec-h{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:1.05rem;font-weight:800;color:var(--mute)}
.parentlink{display:flex;justify-content:center;margin-top:22px}

/* ===== Gegenstände (Shop & Katalog) ===== */
.itiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.itile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);text-align:center;position:relative;transition:transform .1s}
.itile:active{transform:scale(.96)}
.itile.sel{border-color:var(--pri);background:var(--acs)}
.itile .ith{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--acs);overflow:hidden;font-size:2.4rem}
.itile .ith svg{width:100%;height:100%}
.itile .itn{font-size:.82rem;font-weight:800;line-height:1.1;min-height:1.7em;display:flex;align-items:center}
.itile .tag{font-size:.68rem;font-weight:800;color:var(--mute);display:inline-flex;align-items:center;gap:3px;line-height:1.1}
.itile .tag.on{color:var(--ok)}
.itile.lk{background:var(--soft);border-style:dashed}
.itile.lk .ith{opacity:.5;filter:grayscale(1)}
.itile.lk .itn{color:var(--mute)}
.itile .tag.pr{color:var(--ink);font-size:.8rem}
.itile .tag.need{color:var(--mute)}
.itile .tag.ready{color:var(--ok)}
.itile.goal{border-color:var(--pri);border-style:solid}
.itile.mys .ith>*{filter:brightness(0) opacity(.35)}
.ithumb{font-size:2.4rem;line-height:1}

/* ===== Gruppen / Themen ===== */
/* ===== topics ===== */
.topic{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh);width:100%;position:relative}
.topic:active{transform:translateY(3px)}
.topic .ic{font-size:2rem}
.topic h3{font-size:1.15rem}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:9px;border-radius:9px;background:var(--line)}
.pips i.on{background:var(--pri)}
.medal{position:absolute;top:12px;right:12px;font-size:1.9rem}
.lvsel{display:flex;gap:8px;margin:6px 0 14px}
.lvsel button{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800}
.lvsel button.on{background:var(--pri);color:var(--priInk);border-color:transparent}

/* ===== play ===== */
.dots{display:flex;gap:6px;flex:1;min-width:150px}
.dots i{flex:1;height:12px;border-radius:9px;background:var(--line);transition:background .2s}
.dots i.cur{background:var(--pri2);box-shadow:0 0 0 3px var(--soft),0 0 0 5px var(--pri2)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.dots i.done{background:var(--pri)}
.play{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:880px){.play{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.qcard{padding:26px 28px;min-height:340px}
.qtitle{font-size:1.4rem;font-weight:800;margin-bottom:18px}
.qbody{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:2.3rem;font-weight:800}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:4px 10px;border-radius:14px;line-height:1.7;text-align:center}
.eq.big{font-size:3rem}
.eq.u{color:var(--mute)}
.eq.done{opacity:.85}
.eq.info{font-size:1.15rem;font-weight:700;background:var(--soft);border:2px dashed var(--line);display:block}
.eq.sum{border-top:3px solid var(--line);border-radius:0;padding-top:8px}
.eq.q{font-size:2.2rem}
.story{font-size:1.3rem;font-weight:700;font-style:normal;background:var(--soft);border-radius:16px;padding:12px 16px;line-height:1.5;text-align:center}
.fld{display:inline-flex;align-items:center;justify-content:center;min-width:2.6ch;height:1.6em;padding:0 .35em;border-radius:12px;border:3px solid var(--line);background:var(--soft);color:var(--ink);font-weight:900;cursor:pointer;vertical-align:middle;transition:background .15s,border-color .15s}
.fld.dg{min-width:1.25em;padding:0}
.fld.foc{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--soft)}
.fld.ok{border-color:var(--ok);background:var(--okBg);color:var(--ok)}
.fld.bad{border-color:var(--bad);background:var(--badBg);animation:shake .35s}
.fld.show{border-color:var(--ok);background:var(--okBg);color:var(--ok)}
.fld .cur{display:inline-block;width:2px;height:1.1em;background:var(--pri);margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gt{border-collapse:separate;border-spacing:6px;font-size:1.5rem}
.gt th{background:var(--head);border-radius:10px;padding:4px 14px;font-weight:900}
.gt td{text-align:center}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:1.6rem}
.chain .node{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;padding:2px 10px;border-radius:50%/60%;background:var(--soft);border:3px solid var(--line);font-weight:900}
.chain .node.s{background:var(--head);border-color:var(--pri)}
.chain .node.z{background:#fff6c9;border-color:var(--gold);color:#6b4b00;font-size:1.15rem}
.chain .arr{font-weight:900;color:var(--pri);font-size:1.3rem;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:2px 8px}
.cmp{display:flex;align-items:center;gap:18px;font-size:2.2rem;font-weight:900}
.cmp .qm{width:72px;height:72px;border-radius:50%;background:var(--soft);border:3px dashed var(--pri);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--pri)}
.cmp span:not(.qm){background:var(--head);border-radius:16px;padding:6px 16px}
.col{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:8px 14px;background:var(--soft);border-radius:18px}
.crow{display:flex;align-items:center}
.col .cell{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.55em}
.col .sg{width:1.1em;text-align:center;color:var(--pri)}
.col .cu{width:1.6em;text-align:left;padding-left:.2em;color:var(--mute);font-size:.8em}
.col .cline{align-self:stretch;height:4px;background:var(--ink);border-radius:4px;margin:3px 0}
.col .fld{width:1.15em;min-width:0;height:1.4em;padding:0;border-radius:9px;font-size:.95em}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;width:100%}
.ch{flex:1;min-width:130px;max-width:360px;min-height:72px;padding:10px 16px;border-radius:18px;background:var(--card);border:3px solid var(--line);box-shadow:0 1px 2px rgba(42,36,87,.05);font-weight:800;font-size:1.25rem}
.ch.sel{border-color:var(--pri);background:var(--head)}
.ch.bad{border-color:var(--bad);background:var(--badBg);animation:shake .35s;pointer-events:none}
.ch.ok{border-color:var(--ok);background:var(--okBg)}
.ch:active{transform:translateY(3px);box-shadow:none}
.side{display:flex;flex-direction:column;gap:12px}
.coach{display:flex;gap:10px;align-items:center}
.coach .avwrap{width:92px;height:92px}
.coach .avatar{width:100%;height:100%}
.coach .bubble{margin:0;flex:1;font-size:1rem;line-height:1.3}
.fb{border-radius:18px;padding:12px 14px;font-weight:700;font-size:1rem;line-height:1.4}
.fb.ok{background:var(--okBg);color:var(--ok)}
.fb.bad{background:var(--badBg);color:var(--bad)}
.fb.hint{background:#fff6c9;color:#5a4300;border:2px solid #f5d76e}
.fb .ex{color:var(--ink);font-weight:600;display:block;margin-top:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:72px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(42,36,87,.05);font-size:1.7rem;font-weight:900}
.key:active{transform:translateY(3px);box-shadow:none}
.key.fn{background:var(--soft);font-size:1.3rem}
.key[disabled]{opacity:.25}
.coinpop{position:fixed;pointer-events:none;font-size:2rem;font-weight:900;color:#c68a00;animation:pop 1s ease-out forwards;z-index:50}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}

/* ===== result ===== */
.result{text-align:center;padding:24px 16px}
.stars{font-size:3.2rem;letter-spacing:6px}
.stars span{display:inline-block;filter:grayscale(1);opacity:.35}
.stars span.on{filter:none;opacity:1;animation:starin .5s ease backwards}
@keyframes starin{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(1)}}
.bigav{width:190px;height:190px;margin:6px auto}
.bigav .avwrap,.bigav .avatar{width:100%;height:100%}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.list{display:flex;flex-direction:column;gap:10px;text-align:left}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft);border:1.5px solid var(--line)}
.li.ok{border-color:var(--ok)}
.li.bad{border-color:var(--bad)}
.li .n{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.li .t{font-size:.95rem;font-weight:700}
.li .e{font-size:.95rem;color:var(--mute);font-weight:600}
.li .mini{font-size:1rem;margin-top:6px}

/* ===== test ===== */
.timer{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.timer .bar{flex:1;height:18px}
.timer .bar>i{background:var(--pri)}
.timer.low .bar>i{background:var(--bad)}
.timer b{font-size:1.4rem;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800}
.qnav button.cur{border-color:var(--pri);background:var(--head)}
.qnav button.has{background:var(--pri);color:var(--priInk);border-color:transparent}

/* ===== shop ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.tabs button{flex:none;min-height:48px;padding:6px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:800}
.tabs button.on{background:var(--pri);color:var(--priInk);border-color:transparent}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;text-align:center}
.item .pv{width:112px;height:112px}
.item .pv .avwrap,.item .pv .avatar{width:100%;height:100%}
.item.eq{border-color:var(--ok)}
.item .nm{font-weight:800;font-size:.95rem}
.swatch{width:112px;height:112px;border-radius:50%;display:flex;overflow:hidden;border:4px solid var(--line)}
.swatch i{flex:1}
.price{font-weight:900;color:#a77700}
body[data-theme="nacht"] .price{color:#ffd166}
.preview{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.preview .pavatar{width:150px;height:150px}
.preview .pavatar .avwrap,.preview .pavatar .avatar{width:100%;height:100%}
.nonepv{width:112px;height:112px;border-radius:50%;border:4px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--mute)}

/* ===== trophies ===== */
.tro{display:flex;gap:12px;align-items:center;padding:14px}
.tro .ic{font-size:2.6rem;width:64px;text-align:center}
.tro.lock .ic{filter:grayscale(1);opacity:.35}
.tro.lock{opacity:.8}
.tro b{display:block}
.tro .d{font-size:.9rem;color:var(--mute)}

/* ===== parent ===== */
table.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
table.tbl th,table.tbl td{padding:8px 8px;border-bottom:2px solid var(--line);text-align:left}
table.tbl th{background:var(--soft)}
.pct{display:inline-block;min-width:48px;padding:2px 8px;border-radius:99px;font-weight:800;text-align:center}
.pct.g{background:var(--okBg);color:var(--ok)}
.pct.y{background:#fff3c4;color:#8a6500}
.pct.r{background:var(--badBg);color:var(--bad)}
.pct.n{background:var(--soft);color:var(--mute)}
input.txt{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:180px;-webkit-user-select:text;user-select:text}
textarea.txt{width:100%;min-height:90px;font:12px monospace;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px;-webkit-user-select:text;user-select:text}

/* ===== v2: Gruppen, Review, Album, PIN, Einstellungen ===== */
.dots i.half{background:#f5c542}
.stars.sm{font-size:1.25rem;letter-spacing:2px}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.blk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:18px;background:var(--soft);border:1.5px solid var(--line);text-align:center}
.blk.done{border-color:var(--ok);background:var(--okBg)}
.dotsm{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dotsm i{width:14px;height:14px;border-radius:50%;background:var(--line);display:inline-block}
.dotsm i.ok{background:var(--ok)}.dotsm i.half{background:#f5c542}.dotsm i.bad{background:var(--bad)}.dotsm i.cur{box-shadow:0 0 0 3px var(--pri2)}
.rv{margin:8px 0 4px;font-weight:900;font-size:1.1rem}
.tile .sub{font-size:.75rem;font-weight:700;color:var(--mute);text-align:center}
.cardx{display:flex;flex-direction:column;gap:8px;min-height:130px}
.cardx .ct{font-weight:900;color:var(--pri)}
.cardx .cq{font-weight:700}
.cardx .ca{font-weight:600;background:var(--soft);border-radius:12px;padding:8px 10px}
.cardx.hot{border-color:var(--gold)}
.cardx.lock{opacity:.55;border-style:dashed;align-items:center;justify-content:center;text-align:center}
.pindots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--pri);display:inline-block}
.pindots i.on{background:var(--pri)}
.pinpad{max-width:300px;margin:0 auto 12px}
.reccode{font-size:2.2rem;font-weight:900;letter-spacing:4px;background:var(--soft);border:3px dashed var(--pri);border-radius:16px;padding:12px;margin:12px 0;-webkit-user-select:text;user-select:text}
.cfg{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:2px solid var(--line)}
select.txt{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.fb.sp{flex:1}

/* ===== v3: Punkte-Abzeichen, Feld-Taste ===== */
.ptbadge{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:2px 12px;border-radius:99px;font-weight:900;font-size:1.5rem;line-height:1.3;margin:0 0 12px;border:2px solid transparent}
.ptbadge.t1{background:#E8F7EC;color:#1e7a45;border-color:#b9e3c8}
.ptbadge.t2{background:#E6F0FF;color:#1d4fa3;border-color:#bcd3f6}
.ptbadge.t3{background:#FFEBD6;color:#a83f00;border-color:#ffc99a}
.ptbadge.t4{background:#FFE9A8;color:#5e4200;border-color:#f0b400}
.ptb{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:900;margin-right:4px;vertical-align:1px}
.ptb.t1{background:#E8F7EC;color:#1e7a45}.ptb.t2{background:#E6F0FF;color:#1d4fa3}.ptb.t3{background:#FFEBD6;color:#a83f00}.ptb.t4{background:#ffd54a;color:#5e4200}
.key.wide{grid-column:1/-1;font-size:1.15rem;min-height:54px;background:var(--head)}

/* ===== overlays ===== */
.toasts{pointer-events:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px)}
.toast{background:var(--card);border:1.5px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:18px;padding:10px 14px;font-weight:800;display:flex;gap:12px;align-items:center;animation:tin .3s ease}
.toast .ic{font-size:2rem}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(20,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal .card{max-width:440px;width:100%;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:560px){
  body{font-size:16px}
  .qbody{font-size:1.5rem}.eq.big{font-size:2rem}.col{font-size:1.6rem}.chain{font-size:1.3rem}
  .cmp{font-size:1.7rem;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ===== print (Eltern-Ansicht) ===== */
@media print{
  body{background:#fff!important;color:#000;font-size:12px}
  .noprint,.toasts,.top .back,.btn{display:none!important}
  .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
  #app{max-width:none;padding:0}
}


/* ===== Shell: Start, Hefte, Belohnungen, Navigation ===== */
#app{padding-bottom:96px}
.cb{cursor:pointer}
.homehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.homemain{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:stretch}
.homeleft{display:flex;flex-direction:column;gap:14px}
.nowcard{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}
.nowcard h1{font-size:2rem;line-height:1.1}
.what{display:flex;gap:16px;align-items:center}
.what .wic{font-size:3rem;line-height:1}
.what b{font-size:1.35rem;line-height:1.2}
.nowcard .go{align-self:flex-start;min-width:240px;min-height:68px;font-size:1.3rem}
.daybar{padding:0 4px}
.finobox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.finobox .fino{width:190px;height:190px;border-radius:50%}
.newbox{margin-top:16px;display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:20px;background:var(--acs)}
.newrow{display:block;text-align:left;font-size:.95rem;font-weight:700}
button.newrow{color:var(--pri);font-weight:800;padding:2px 0}
.goalline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 18px;border-radius:16px;border:1.5px dashed var(--line);text-align:left}
.secrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.secrow .btn{flex:1;min-width:150px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:14px;font-weight:800;font-size:.82rem;color:var(--mute)}
.nav button.on{color:var(--pri);background:var(--acs)}
.chap{margin:0 0 26px}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chead h2{font-size:1.3rem}
.chead .cp{margin-left:auto;font-size:1.1rem}
.chap .bar{height:8px;margin-bottom:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.book{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 14px 14px 18px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--pri);min-height:150px}
.book:active{transform:scale(.98)}
.book .bid{font-size:.8rem;font-weight:800;color:var(--pri)}
.book .bic{font-size:2rem;line-height:1}
.book h3{font-size:1.05rem;line-height:1.15}
.book .bar{width:100%;margin-top:auto;height:8px}
.book .bn{font-size:.78rem;color:var(--mute);font-weight:700}
.book.empty{background:transparent;border:1.5px dashed var(--line);border-left:1.5px dashed var(--line);color:var(--mute);justify-content:center;min-height:100px}
.book.empty .bid{color:var(--mute)}
.rwtop,.rwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.rwgrid{margin-top:4px}
.rw{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.rw:active{transform:scale(.98)}
.rw .ib{width:48px;height:48px;border-radius:14px;background:var(--acs);color:var(--pri);display:flex;align-items:center;justify-content:center;--ia:transparent}
.rw b{font-size:1.05rem}
.rw .sub{font-size:.82rem;color:var(--mute);line-height:1.25}
.rw.dim{background:var(--soft)}
.rw.dim .ib{color:var(--mute);background:var(--head)}
.shopbtn{background:var(--acs);border-color:transparent}
.crbar{pointer-events:none;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;margin:-4px -4px 10px;border-radius:14px;background:var(--soft);font-weight:800;font-size:.92rem}
.crbar.on{background:var(--acs);color:var(--pri)}
.crbar b{margin-left:auto;font-variant-numeric:tabular-nums}
.crbar small{font-weight:600;color:var(--mute)}
.lockscr{text-align:center;padding:48px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.lockic{width:90px;height:90px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.shophead{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.goalcard{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--acs);border:0}
.goalcard .gth{width:56px;height:56px;border-radius:14px;overflow:hidden;background:#fff8;display:flex;align-items:center;justify-content:center;font-size:2rem;flex:none}
.goalcard .gth svg{width:100%;height:100%}
.goalcard .bar{margin:6px 0;background:#fff8}
.ithumb.nm{font-size:1.1rem;font-weight:800}
.item.lk{background:var(--soft);border-style:dashed}
.item.lk .pv{opacity:.55;filter:grayscale(1)}
body[data-size="l"]{font-size:20px}
body[data-calm="1"] *{animation:none!important;transition:none!important}
@media (max-width:760px){
  .homemain{grid-template-columns:1fr}
  .finobox{flex-direction:row;text-align:left}
  .finobox .fino{width:110px;height:110px}
  .nowcard{padding:20px}.nowcard h1{font-size:1.6rem}
  .nowcard .go{width:100%}
}
.finobox .fino .avwrap{--s:100%!important;width:100%;height:100%}
.finobox .fino .avatar{width:100%;height:100%}

/* ===== Avatar „Mein Avatar“ (alle Klassen mit av-) – ruhig, Theme-Variablen, keine Schatten ===== */
.av-wrap{display:flex;flex-direction:column;gap:14px}
.av-left{display:contents}
.av-stage{order:1;position:sticky;top:0;z-index:20;margin:0 -16px;padding:6px 16px 8px;background:var(--bg);background-attachment:fixed}
.av-tools{order:2;min-width:0}
.av-side{order:3;padding:14px}
.av-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.av-pv{position:relative;display:block;flex:none;width:130px;height:130px;border-radius:50%;padding:0;cursor:pointer}
.av-circ{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--soft);border:3px solid var(--line)}
.av-circ svg{display:block;width:100%;height:100%}
.av-mood{display:none}
.av-bar{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px 2px;border-radius:16px;background:var(--soft);border:1.5px solid var(--line);font-size:.74rem;font-weight:800;color:var(--ink);line-height:1.1;transition:transform .1s}
.av-btn .ico{color:var(--pri)}
.av-btn:active{transform:scale(.94)}
.av-count{display:flex;flex-direction:column;gap:2px;font-size:1.1rem}
.av-sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 2px 8px}
.av-sh:first-child{margin-top:2px}
.av-sh b{font-size:1.02rem}
.av-sub{margin:12px 2px 6px;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.av-tip{margin:18px 2px 2px}
.av-cats .ico{color:var(--pri);vertical-align:-5px}
.av-cats .on .ico{color:var(--priInk)}
.av-panel{padding:14px 14px 16px}
.av-clear{margin:2px 0 8px}
.av-grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.av-grid .itile .ith{width:84px;height:84px}
.av-grid .itile.sel .ith{background:var(--head)}
div.itile{cursor:default}
/* Farben: eigene als Punkte, gesperrte als Feld mit Preis */
.av-sws{display:flex;flex-wrap:wrap;gap:9px;margin:2px 2px 6px;align-items:center}
.av-sw{display:inline-block;position:relative;width:40px;height:40px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.14);transition:transform .1s}
button.av-sw:active{transform:scale(.92)}
.av-sw.on{outline:3px solid var(--pri);outline-offset:2px}
.av-lks{margin-top:4px}
.av-chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:4px 12px 4px 5px;border-radius:99px;border:1.5px dashed var(--line);background:var(--card);color:var(--mute);font-size:.78rem;font-weight:800}
.av-chip i{display:block;flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);opacity:.55;border:2px solid rgba(0,0,0,.12)}
.av-chip span{display:inline-flex;align-items:center;gap:3px}
button.av-chip:active{transform:scale(.96)}
/* Meine Looks */
.av-looks{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:thin}
.av-look{position:relative;flex:none}
.av-lk{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px}
.av-lc{display:block;width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid var(--line)}
.av-lc svg{display:block;width:100%;height:100%}
.av-lk i{font-style:normal;font-size:.68rem;font-weight:800;color:var(--mute);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-lk:active .av-lc{transform:scale(.94)}
.av-lk.add .av-lc{display:flex;align-items:center;justify-content:center;color:var(--pri);border:2px dashed var(--pri)}
.av-x{position:absolute;top:-4px;right:-3px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.av-x:hover{color:var(--bad)}
/* Schalter */
.av-tog{display:flex;align-items:center;justify-content:space-between;gap:12px}
.av-side .av-looks+.av-tog{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.av-sw2{width:56px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.av-sw2 i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.av-sw2.on{background:var(--pri)}
.av-sw2.on i{transform:translateX(24px)}
.av-mp{display:inline-block;width:96px;height:96px;border-radius:50%;overflow:hidden;margin-bottom:6px;border:3px solid var(--line)}
.av-mp svg{display:block;width:100%;height:100%}
.av-name{width:100%;margin-top:10px;text-align:center;font-weight:800;-webkit-user-select:text;user-select:text}
/* Ersteinrichtung */
.av-setup .av-stage{order:0}
.av-setup{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.av-one{justify-content:center;flex-direction:column;gap:8px}
.av-dots{display:flex;gap:8px}
.av-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.av-dots i.on{background:var(--pri)}
.av-st{margin:2px 2px 0;font-size:1.25rem}
.av-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
/* Bewegung */
@keyframes avpop{0%{transform:scale(.6);opacity:.15}55%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.av-pop{animation:avpop .5s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:50% 55%}
@keyframes avbounce{0%{transform:scale(1)}35%{transform:scale(1.05) translateY(-5px)}70%{transform:scale(.99)}100%{transform:scale(1)}}
.av-bounce{animation:avbounce .45s ease}
@keyframes avshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.03)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.av-shake{animation:avshake .48s ease}
@keyframes avroll{to{transform:rotate(360deg)}}
.av-roll{animation:avroll .48s ease}
@keyframes avtw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}
.av-tw{animation:avtw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.av-pop,.av-bounce,.av-shake,.av-roll,.av-tw{animation:none}}
/* Tablet / Laptop: große Vorschau links, Sammlung rechts */
@media (min-width:900px){
  .av-wrap{display:grid;grid-template-columns:minmax(380px,430px) minmax(0,1fr);gap:20px;align-items:start}
  .av-left{display:flex;flex-direction:column;gap:10px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;padding:2px 4px 4px 2px;margin:-2px -4px -4px -2px;scrollbar-width:thin}
  .av-stage{position:static;margin:0;padding:0;background:none}
  .av-card{flex-direction:column;padding:12px 14px 12px;gap:12px}
  .av-pv{width:min(100%,340px);height:auto;aspect-ratio:1}
  .av-mood{display:block;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:2px 14px;font-size:.8rem;font-weight:800;color:var(--mute);white-space:nowrap}
  .av-bar{width:100%}
  .av-side{padding:10px 14px}
  .av-side .av-lc{width:46px;height:46px}
  .av-side .av-lk{width:56px}
  .av-side .av-sh{margin:0 2px 4px}
  .av-tools{order:0}
  .av-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  .av-grid .itile .ith{width:92px;height:92px}
  .av-one .av-pv{width:200px}
  .av-one{padding:14px}
}
@media (max-width:899px){
  .av-stage{border-bottom:1px solid var(--line)}
  .av-one .av-pv{width:120px;height:120px}
}

/* ===== Mein Buch ===== */
.bk-head{margin:0 0 6px}
.bk-idx button{min-width:64px;display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:4px 12px}
.bk-idx button small{font-size:.68rem;color:var(--mute);font-weight:800}
.bk-idx button.on{border-color:var(--pri);background:var(--soft)}
.bk-page{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px}
.bk-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bk-t{flex:1;text-align:center}.bk-t h2{margin:2px 0 0}
.bk-nav{width:52px;min-height:52px;padding:0;flex:none}
.bk-prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.bk-stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.bk-st{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.bk-st .sc{width:60px;height:60px;border-radius:50%;border:2.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--mute);filter:grayscale(1);opacity:.7}
.bk-st.got .sc{border:3px solid var(--ti);background:var(--tb);filter:none;opacity:1;transform:rotate(-6deg)}
.bk-st b{font-size:.82rem;line-height:1.1}
.bk-st small{font-size:.66rem;color:var(--mute);line-height:1.15}
.bk-spaces{display:grid;grid-template-columns:repeat(4,minmax(0,120px));gap:10px;justify-content:center}
.bk-slot{aspect-ratio:1;border-radius:18px;border:2px dashed var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.6rem;min-height:64px}
.bk-slot i{font-style:normal;font-size:1.8rem;color:var(--mute)}
.bk-slot.full{border-style:solid;background:var(--card)}
.bk-slot.sel{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}

/* ===== Musik-Werkstatt: ruhig, flach, ein Akzent (--pri) ===== */

/* Transport */
.mu-bar{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap;padding:14px 16px;margin-bottom:12px}

.mu-play:active{transform:scale(.97)}

.mu-sl{display:flex;flex-direction:column;gap:2px;flex:2 1 220px;min-width:150px}
.mu-sl.sm{flex:1 1 130px}

.mu-slr{display:flex;align-items:center;gap:8px}
.mu-slr b{min-width:2.4ch;text-align:right;font-variant-numeric:tabular-nums;font-size:1.05rem}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:32px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--pri);border:3px solid var(--card)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--pri);border:3px solid var(--card)}
.mu-opts{display:flex;gap:12px 20px;flex-wrap:wrap}
.mu-opt{display:flex;flex-direction:column;gap:4px}
.mu-seg{display:inline-flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}

.mu-seg button.on{background:var(--pri);color:var(--priInk)}
/* Raster */
.mu-gridcard{padding:14px 14px 8px;margin-bottom:12px}

.mu-hdl{margin-bottom:2px;padding-bottom:0;border:0}

.mu-inst.sel{border-color:var(--c);background:var(--card)}
.mu-ie{font-size:1.5rem;width:32px;text-align:center;flex:none}
.mu-in{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:800;line-height:1.1;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mu-d .mu-pad{min-height:76px}

.mu-pad.on{background:var(--c);border-color:transparent;animation:mupop .16s ease-out}
.mu-pad:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
@keyframes mupop{0%{transform:scale(.88)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.mu-pad.ph{border-color:var(--c);background:var(--head)}

.mu-auto{margin:0 0 18px}

.mu-lib{margin-top:6px}

.mu-lg{margin-bottom:12px}

/* Namens-Dialog */
.mu-ov{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}

/* Meine Beats */
.mu-sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* Handy */
@media (max-width:719px){

@media (prefers-reduced-motion:reduce){.mu-pad.on{animation:none}.mu-pad,.mu-play{transition:none}}

/* ===== Schatzkammer ===== */

.sc-puz b{font-size:1.5rem}
.sc-puz .btn.bad{border-color:var(--bad);color:var(--bad);background:var(--badBg)}
.sc-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.sc-nav .dots{flex:1;min-width:120px}
@media (max-width:620px){.sc-t{font-size:1.08rem}}

/* Meine Weltreise: ruhig, kompakt, alle Farben folgen dem gewählten Thema (Illustrationen behalten feste helle Farben, nie Pink) */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.w-bar-x{display:flex;gap:8px;flex:none}
.w-pill{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--dz-surface);border:0;box-shadow:var(--dz-sh-soft);font-weight:720;cursor:pointer;color:var(--dz-ink);font-family:inherit}
.w-pill .ico{flex:none}
.w-sec{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:1.15rem}
.w-sec small{color:var(--mute);font-weight:800}
.w-depart{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--acs);border:0;box-shadow:var(--dz-sh-card);border-radius:22px;padding:14px 18px}
.w-depart h2{margin:0 0 4px;font-size:1.3rem}.w-depart p{margin:0;color:var(--mute);font-size:.92rem;max-width:520px}
.w-bal{flex:none;min-width:104px;text-align:center;background:var(--card);border-radius:18px;padding:8px 12px;border:0;box-shadow:var(--dz-sh-soft)}
.w-bal b{display:block;font-size:1.7rem;line-height:1.1;color:var(--pri)}.w-bal span{font-size:.8rem;font-weight:800}.w-bal small{display:block;color:var(--mute);font-size:.7rem;line-height:1.25}
.w-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.w-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;min-height:150px;text-align:left;background:var(--card);border:0;box-shadow:var(--dz-sh-card);border-radius:20px;cursor:pointer;color:var(--ink)}
.w-card.open{border-color:var(--pri2)}
.w-card b{font-size:1.05rem;line-height:1.15}.w-card small{color:var(--mute);font-weight:700;font-size:.8rem;line-height:1.25}
.w-cflag{width:56px;height:37px;border-radius:7px}
.w-cflagwrap{position:relative;display:inline-block}
.w-lockic{position:absolute;right:-10px;bottom:-8px;width:26px;height:26px;border-radius:50%;background:var(--card);border:0;box-shadow:var(--dz-sh-soft);display:grid;place-items:center;color:var(--pri);font-style:normal}
.w-card.locked{background:var(--acs);border-style:dashed}
.w-card.locked.can{border-style:solid;border-color:var(--ok)}
.w-price{margin-top:auto;padding:3px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--pri2);font-weight:800;font-size:.85rem}
.w-card.can .w-price{border-color:var(--ok);color:var(--ok)}
.w-cstamp{margin-top:auto;display:inline-flex;gap:4px;align-items:center;font-size:.78rem;font-weight:800;color:var(--ok)}
.w-dots{display:inline-flex;gap:3px;margin-top:auto;color:var(--pri)}
.w-mk{width:15px;height:15px;color:var(--pri)}.w-prog .w-dots{margin:0}.w-mk:not(.on){color:var(--mute)}
.w-foot{margin:20px 2px 0;color:var(--mute);font-size:.88rem;text-align:center}
/* Reise */
.w-journey{display:grid;grid-template-columns:318px minmax(0,1fr);gap:14px;align-items:start}
.w-scene{position:sticky;top:10px;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:26px;background:var(--sc);color:#303536;overflow:hidden;isolation:isolate}
.w-scene:before,.w-scene:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(32px);opacity:.7}
.w-scene:before{width:210px;height:210px;right:-80px;top:-80px;background:var(--g1)}.w-scene:after{width:200px;height:200px;left:-90px;bottom:-80px;background:var(--g2)}
.w-entry{display:inline-flex;gap:5px;align-items:center;background:#fbfaf7;border-radius:14px;padding:6px 10px;font-size:.78rem;font-weight:800}
.w-scene-vis{display:grid;place-items:center}.w-scene-svg{width:100%;height:172px;filter:drop-shadow(0 8px 10px rgba(48,55,56,.09))}
.w-guide{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;background:#fbfaf7;border-radius:20px;padding:10px 12px}
.w-guide-pic svg{width:62px;height:72px}.w-guide small{font-weight:800;color:#697071;font-size:.74rem}.w-guide h2{margin:0;font-size:1.3rem;color:#303536}.w-guide p{margin:2px 0 0;font-size:.82rem;line-height:1.35;color:#596263;font-weight:700}
.w-work{display:grid;gap:10px;min-width:0}
.w-route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:6px;background:var(--acs);border-radius:20px}
.w-stop{position:relative;min-height:66px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:2px solid transparent;border-radius:15px;color:var(--mute);font-weight:800;font-size:.8rem;cursor:pointer}
.w-stop.active{background:var(--card);border-color:var(--pri2);color:var(--pri)}
.w-stop .w-mk{position:absolute;right:4px;top:4px;width:16px;height:16px}
.w-panel{background:var(--card);border:0;box-shadow:var(--dz-sh-card);border-radius:22px;padding:16px 18px;min-height:360px;outline:0}
.w-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.w-head h2{margin:0;font-size:1.35rem}.w-head p{margin:5px 0 0;color:var(--mute);font-size:.93rem;line-height:1.4;max-width:560px}
.w-hflag{flex:none;width:52px;height:35px;border-radius:7px}
.w-note{display:flex;align-items:center;gap:10px;background:var(--acs);border-radius:16px;padding:8px 12px;margin:12px 0}
.w-note p{margin:0;font-size:.9rem;line-height:1.4}.w-note-pic svg{width:36px;height:42px;display:block}
.w-story{display:flex;gap:12px;align-items:center;background:var(--acs);border-radius:18px;padding:10px 14px;margin-bottom:12px}
.w-story p{margin:0;line-height:1.45}.w-note-pic.big svg{width:62px;height:72px}
.w-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.w-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border:0;box-shadow:var(--dz-sh-soft);border-radius:14px}
.w-info-ico{flex:none;width:30px;height:30px;color:var(--pri)}.w-item small{display:block;color:var(--mute);font-weight:800;font-size:.76rem}.w-item b{font-size:.93rem;line-height:1.25}
.w-rich{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.w-rich>div{background:var(--soft);border-radius:14px;padding:9px 12px}.w-rich p{margin:2px 0 0;font-size:.86rem;color:var(--mute);line-height:1.35}
.w-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.w-pc{border:0;box-shadow:var(--dz-sh-soft);border-radius:16px;padding:8px}.w-pc b{display:block;margin-top:6px}.w-pc p{margin:2px 0 0;font-size:.84rem;color:var(--mute);line-height:1.35}
.w-art{display:block;width:100%;height:84px;background:#eceee9;border-radius:11px}
.w-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.w-word{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px 8px 12px;border:0;box-shadow:var(--dz-sh-soft);border-radius:14px}
.w-word-t b{font-size:1.2rem}.w-word-t span{display:block;color:var(--pri);font-weight:800;font-size:.86rem}
.w-word-m{grid-column:1}.w-word-m span{font-weight:800;font-size:.92rem}.w-word-m small{display:block;color:var(--mute);font-size:.78rem}
.w-spk{grid-column:2;grid-row:1/3;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:var(--priInk);display:grid;place-items:center;cursor:pointer}
.w-souvline{display:flex;align-items:center;gap:10px;margin-top:14px;padding:6px 14px 6px 8px;border-radius:16px;background:var(--okBg);color:var(--ink);font-size:.92rem}
.w-souv{width:40px;height:40px;flex:none}.w-souv.big{width:66px;height:66px}
.w-quiz-intro,.w-quiz-res{text-align:center;padding:20px 0 6px}.w-quiz-res h3{font-size:1.6rem;margin:0 0 6px}
.w-q{margin-top:14px}.w-q small{color:var(--mute);font-weight:800}.w-q h3{margin:4px 0 12px;font-size:1.25rem}
.w-qopts{display:grid;gap:8px;max-width:480px}
.w-qo{min-height:52px;text-align:left;border:0;box-shadow:var(--dz-sh-card);border-radius:14px;background:var(--card);color:var(--ink);font-weight:800;padding:8px 14px}
.w-qo.ok{border-color:var(--ok);background:var(--okBg)}.w-qo.bad{border-color:var(--bad);background:var(--badBg)}.w-qo.dim{opacity:.78}
.w-qfb{margin:12px 0 8px;font-weight:800}
/* Flug */
.w-flight{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;text-align:center}
.w-flight-in{--lw:min(390px,75vw);padding:20px}.w-fflag{width:104px;height:69px;border-radius:10px;margin:0 auto 10px}
.w-flight small{color:var(--mute);font-weight:800}.w-flight h2{font-size:clamp(1.6rem,5vw,2.4rem);margin:4px 0}
.w-fline{position:relative;width:var(--lw);height:50px;margin:18px auto;border-top:2px dashed var(--line);border-radius:50%}
.w-plane{position:absolute;left:0;top:-14px;width:28px;height:28px;color:var(--pri);animation:wFly 1.7s cubic-bezier(.2,0,0,1) forwards}
@keyframes wFly{to{transform:translateX(calc(var(--lw) - 28px)) rotate(5deg)}}
/* Mein Reisepass: Papier und Tinte behalten feste Farben (wie ein echter Pass), nur der Rahmen folgt dem Thema */
.rp{--paper:#f4efe1;--pi:#2c3236;--pl:#6b7479;--bur:#5b2431;--bur2:#7a3a47;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:20px;overflow:hidden;box-shadow:var(--dz-sh-panel);border:1px solid var(--dz-bd);background:var(--paper)}
.rp:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(60,50,30,0),rgba(60,50,30,.16) 50%,rgba(60,50,30,0))}
.rp-page{position:relative;min-width:0;padding:16px 18px 18px;color:var(--pi);container-type:inline-size;background:
  repeating-radial-gradient(circle at 50% 120%,rgba(91,36,49,.045) 0 2px,transparent 2px 7px),var(--paper)}
.rp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bur);color:var(--bur)}
.rp-hd span{font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:.84rem}.rp-hd i{font-style:normal;font-weight:700;letter-spacing:.06em;opacity:.8}
.rp-hd b{display:grid;place-items:center;min-width:32px;font-size:1.2rem}.rp-hd svg{width:30px;height:30px;display:block}
.rp-body{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.rp-pic{display:grid;gap:10px;justify-items:center}
.rp-photo{display:block;width:104px;height:128px;border-radius:6px;overflow:hidden;background:#cfd9dc;border:1px solid rgba(44,50,54,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.rp-photo .avwrap{--s:104px;width:104px;height:128px;border-radius:0;background:none;display:grid;place-items:end center;overflow:hidden}.rp-photo .avwrap>*{max-width:100%}
.rp-sig{display:block;width:104px;border-bottom:1px solid var(--pi);padding-bottom:2px;text-align:center}.rp-sig small{display:block;font-size:.6rem;color:var(--pl);font-weight:800;text-align:left}.rp-sig small i{font-style:normal;font-weight:600}
.rp-sig em{display:block;font:italic 700 1.25rem/1.15 "Segoe Script","Snell Roundhand","Brush Script MT","Lucida Handwriting",cursive;color:#27408b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform:rotate(-4deg)}
.rp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;min-width:0}
.rp-f{min-width:0}.rp-f.full{grid-column:1/-1}
.rp-f small{display:block;font-size:.62rem;line-height:1.15;color:var(--pl);font-weight:800;letter-spacing:.03em}.rp-f small i{font-style:normal;font-weight:600}
.rp-f b{display:block;font-size:.95rem;line-height:1.25;font-weight:800;color:var(--pi);overflow-wrap:anywhere;font-feature-settings:"tnum"}
.rp-f.big b{font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase}
.rp-f b em{display:block;font-style:normal;font-size:.8rem;font-weight:700;color:var(--pl)}
.rp-data .rp-grid .sm,.rp-data .rp-grid .wide{grid-column:auto}
.rp-data .rp-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.rp-data .rp-f{grid-column:span 2}.rp-data .rp-f.sm{grid-column:span 1}.rp-data .rp-f.wide{grid-column:span 2}.rp-data .rp-f.full{grid-column:1/-1}
.rp-mrz{display:grid;gap:0;margin:14px -6px -4px;padding:8px 6px 6px;background:rgba(44,50,54,.05);border-top:1px dashed rgba(44,50,54,.25);font:700 min(12.5px,calc((100cqw - 36px)/26.8))/1.35 "Courier New",Courier,monospace;color:var(--pi);letter-spacing:0;overflow:hidden}
.rp-mrz span{white-space:nowrap}
.rp-grid.trips{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:12px;border-bottom:1px dashed rgba(44,50,54,.28);margin-bottom:6px}
.rp-stamps{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:0;min-height:230px;padding:10px 0}
.rp-none{margin:30px 12px;text-align:center;color:var(--pl);font-weight:700;line-height:1.5;max-width:30em}
.rp-st{--ink:#25508f;margin:0 -2px -4px;width:clamp(120px,36%,170px);color:var(--ink);transform:translate(var(--dx),var(--dy)) rotate(var(--rot));filter:url(#rpInk);mix-blend-mode:multiply;opacity:.9}
.rp-st svg{display:block;width:100%;height:auto;overflow:visible}
.rp-st.fresh{animation:rpThump .62s .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes rpThump{0%{opacity:0;transform:translate(var(--dx),calc(var(--dy) - 26px)) rotate(calc(var(--rot) + 9deg)) scale(1.7)}55%{opacity:.95;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.94)}100%{opacity:.9;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
/* Umschlag: bordeauxrot mit Goldprägung, klappt beim ersten Öffnen auf */
.rp-cover{display:none}
.rp.anim .rp-cover{display:grid;place-items:center;position:absolute;z-index:6;inset:0;border-radius:20px;background:linear-gradient(145deg,var(--bur2),var(--bur) 55%,#431a25);color:#e6c777;text-align:center;transform-origin:left center;animation:rpOpen 1.1s .35s cubic-bezier(.2,0,0,1) forwards}
.rp-cover svg{width:68px;height:68px}.rp-cover small{display:block;margin-top:8px;font-weight:900;letter-spacing:.2em;font-size:.78rem}.rp-cover b{display:block;font-size:1.6rem;margin-top:6px;letter-spacing:.04em}
@keyframes rpOpen{0%{transform:perspective(1100px) rotateY(0);opacity:1}70%{opacity:1}100%{transform:perspective(1100px) rotateY(-108deg);opacity:0;visibility:hidden}}
.w-prog{list-style:none;margin:0;padding:0;display:grid;gap:8px}.w-prog button{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--card);border:0;box-shadow:var(--dz-sh-soft);border-radius:14px;cursor:pointer;text-align:left;color:var(--ink)}
.w-prog b{flex:1}.w-prog small{color:var(--mute);font-weight:800;min-width:42px;text-align:right}.w-lflag{width:30px;height:20px;border-radius:4px}
/* Eltern */
.w-par{display:grid;gap:8px;max-width:560px}.w-par h3{margin:10px 0 0}.w-par label{font-weight:800}
.w-radio{border:0;padding:0;margin:6px 0;display:grid;gap:6px}.w-radio legend{font-weight:800;margin-bottom:4px}
.w-toggle{display:flex;align-items:center;gap:10px;min-height:44px}.w-toggle input,.w-radio input{width:22px;height:22px}
/* Kachel in Meine Welt */
@media(max-width:860px){.w-journey{grid-template-columns:minmax(0,1fr)}.w-scene{position:relative;top:auto}.w-scene-svg{height:128px}.w-depart{flex-direction:column;align-items:stretch}.w-bal{align-self:flex-start}}
@media(max-width:560px){.w-route{padding:4px}.w-panel{padding:14px}.w-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.rp{grid-template-columns:minmax(0,1fr)}.rp:before{display:none}.rp-visa{border-top:1px solid rgba(44,50,54,.18)}.rp-st{width:clamp(118px,44%,170px)}}
@media(prefers-reduced-motion:reduce){.rp.anim .rp-cover{display:none}.rp-st.fresh{animation:none}.w-plane{animation:none}}
/* Kachel in Meine Welt: eine breite Zeile statt einer einsamen Kachel */
@media(max-width:560px){.w-route{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.w-stop{flex-direction:row;min-height:50px;gap:6px;font-size:.84rem;padding:6px 8px;justify-content:flex-start}.w-stop svg:first-child{flex:none}.w-stop .w-mk{position:static;margin-left:auto;width:16px;height:16px}}
.w-qo[aria-disabled=true]{cursor:default}

/* Mein Reisepass: nichts darf breiter als der Bildschirm werden */
.w-prog li,.w-prog button{min-width:0}.w-prog b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* Alle Stationen im gleichen Karten-Look wie Orte und Essen: Bildfläche oben, Titel, kurzer Text */
.w-iart,.w-wart,.w-qart{display:grid;place-items:center;position:relative;color:#52676c}
.w-iart .w-info-ico{width:44px;height:44px;color:#52676c}
.w-ic p.short{font-weight:800;color:var(--ink);font-size:1.02rem;margin-top:3px}
.w-wart b{display:block;margin:0;font-size:1.5rem;line-height:1.2;color:#2c3236;text-align:center;padding:0 38px 0 8px}.w-wart b.long{font-size:1.1rem}
.w-wart .w-spk{position:absolute;right:6px;bottom:6px;width:34px;height:34px;grid-column:auto;grid-row:auto}
.w-qart svg{width:auto;height:72px;display:block}
.w-one{grid-template-columns:minmax(0,340px);justify-content:center;margin-top:12px}
.w-qc{text-align:center}.w-qc .row{justify-content:center;margin-top:12px}.w-qc>b{font-size:1.15rem}
.w-cards{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.w-wcards{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
@media(max-width:560px){.w-cards,.w-wcards{grid-template-columns:repeat(2,minmax(0,1fr))}.w-one{grid-template-columns:minmax(0,1fr)}}

/* ===== Wesen ===== */
.wes-detail{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.wes-i{display:inline-block;line-height:1;transform-origin:50% 100%}
.wes-i.st1{transform:scale(.72)}.wes-i.st2{transform:scale(.9)}.wes-i.st3{transform:scale(1.08)}
.wd-art{width:140px;height:140px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:34px;flex:none}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.wtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;padding:14px 8px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.wtile.on{border-color:var(--pri);background:var(--soft)}
