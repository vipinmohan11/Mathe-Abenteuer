/* =====================================================================
   RECHENHELDEN-OBERFLÄCHE (zuletzt geladen, überschreibt style.css / feat_*.css)
   Ursprünglich als Codex-Layer gebaut, jetzt fester Teil des Builds.
   Themes: nur die 8 Theme-IDs (sonne, butter, ocean, wald, sunset, nacht, regen, tuerkis) setzen Farben.
   HINWEIS: Die ID "sonne" wird als "Himmelblau" angezeigt – die ID NICHT umbenennen (gespeicherte Daten/Besitz hängen daran).
   Schriften (Baloo 2, Nunito, OFL) werden von build.py aus src/fonts/*.woff2 eingebettet.
   ===================================================================== */


/* Shared, offline, theme-aware styling. The existing eight theme IDs are retained. */
.avatar{background:var(--head)}
.ad-earned{margin-top:16px;border-top:1px solid var(--line);padding:14px 0 0;color:var(--mute);font-size:.85rem}
.ad-earned summary{cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--ink);min-height:35px}.ad-earned summary span{font-weight:800;margin-left:auto}
.ad-earned ul{padding-left:26px;margin-bottom:0}.ad-earned li{margin:8px 0}
.ad-goal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;text-align:left;width:100%;padding:15px 0;margin-top:8px;color:var(--ink);font-size:.86rem}.ad-goal>span{flex:1;min-width:180px}.ad-goal>b{color:var(--pri)}
.ad-parent{display:flex;justify-content:flex-end;margin-top:16px}.ad-text{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--mute);min-height:40px;padding:7px 10px}
.ad-world-tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.ad-tool{display:flex;align-items:center;gap:9px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:12px 16px;font-size:.9rem;min-height:48px}
.ad-creative-note{font-size:.85rem;color:var(--mute);margin:17px 0 0}.ad-save-warning{padding:14px;border:2px solid var(--bad);color:var(--bad);background:var(--badBg);border-radius:13px}
.ad-play .qcard{position:relative;overflow:hidden;border:3px solid var(--line);border-bottom-width:7px;border-radius:26px;padding:28px 24px}
.ad-play.ad-right .qcard{border-color:var(--ok);background:var(--okBg)}
.ad-play.ad-retry .qcard,.ad-play.ad-revealed .qcard{border-color:var(--bad)}
.ad-play .fld.ok,.ad-play .ch.ok{background:var(--okBg);color:var(--ok);border-color:var(--ok)}
.ad-play .fld.bad,.ad-play .ch.bad{background:var(--card);color:var(--bad);border-color:var(--bad);animation:none}
.ad-play .fb{border:2px solid transparent;font-size:.95rem}.ad-play .fb.ok{border-color:var(--ok)}.ad-play .fb.bad{border-color:var(--bad)}
.ad-feedback-title{display:flex;align-items:center;gap:7px;font-size:1.08rem;margin-bottom:4px}.ad-feedback-title .ico{flex:none}.ad-play .fb .ex{font-size:.9rem}
.ad-play .coach .avwrap{background:none;box-shadow:none}.ad-play .coach .avatar{background:transparent}
.ad-play.ad-right .side>.btn.big{background:var(--ok);color:var(--card)}
.ad-play .keypad{gap:8px}.ad-play .key{min-height:62px;border:2px solid var(--line);border-bottom-width:4px;box-shadow:none;background:var(--card)}
.ad-play .key.fn{background:var(--head)}
.ad-answer-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:22px;z-index:5}.ad-answer-stars i{position:absolute;top:58%;left:50%;color:var(--star);font-size:23px;font-style:normal;animation:ad-burst .85s ease-out forwards}
@keyframes ad-burst{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(140deg);opacity:0}}
body[data-theme="nacht"] .ad-play.ad-right .side>.btn.big{background:#248944;color:#fff}
body[data-calm="1"] .ad-answer-stars{display:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.ad-answer-stars,.confetti{display:none}}
@media(max-width:760px){.ad-play .qcard{padding:22px 16px}.ad-play .key{min-height:56px}}

/* Softer surfaces; interface colours all come from the selected theme.
   Artwork, collectible swatches and green/red answer feedback keep their meaning. */
.itile.sel{box-shadow:inset 0 0 0 2px var(--pri)}.itile.lk,.item.lk{background:var(--card);border:0;position:relative}
.itile.lk .ith,.item.lk .pv{opacity:.82;filter:saturate(.8)}.itile.lk .itn{color:var(--ink)}
.itile.mys .ith>*{filter:saturate(.8);opacity:.82}.tro.lock .ic{filter:saturate(.8);opacity:.8}
.insp .gh{filter:saturate(.8);opacity:.6}.insp .ph{stroke:var(--pri);stroke-width:1;stroke-dasharray:3 5;fill:transparent}
.epc.lk{opacity:1;background:var(--soft)}.epc.lk .epn{background:var(--acs);color:var(--pri)}.wtile.lk{background:var(--art-b);border:0;color:var(--ink)}
.rh-lock{display:flex;align-items:center;justify-content:center;position:absolute;right:8px;top:8px;padding:5px;border-radius:50%;background:var(--card);color:var(--ink);z-index:2;box-shadow:0 1px 3px #0001}
.rh-stamp-preview{position:relative;filter:saturate(.8)!important;opacity:.8!important;background:var(--acs);border:0!important}.rh-stamp-preview .rh-lock{right:-4px;top:-3px}
.rh-story-preview{position:relative}.rh-story-preview .rh-lock{right:-4px;top:-3px}
.rh-wes{position:relative}.rh-wes-preview{position:relative;min-height:70px;width:85px}.rh-wes-preview>span{font-size:52px;opacity:.75}.rh-wes-preview .egg{position:absolute;right:0;bottom:0}.rh-wes small{font-size:.72rem;color:var(--mute)}
.rh-topics{gap:18px}.rh-topics .topic{border-radius:16px;padding:24px;gap:10px;min-height:220px}.rh-topics .topic h3{font-size:1.35rem}.rh-topics .topic .bar{height:7px;margin-top:auto}
.rh-topic-icon{height:50px;min-width:55px;align-self:flex-start;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--pri);background:var(--acs);border-radius:10px;padding:7px 10px}
.rh-section-note{color:var(--mute);margin:0 0 20px}
.rh-test-prizes{background:var(--acs);border-radius:16px;padding:20px;margin:20px 0;text-align:left}.rh-test-prizes>div{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.rh-test-prizes span{font-size:.85rem}.rh-test-prizes strong{display:block;margin-top:5px}.rh-test-prizes p{font-size:.8rem;margin:12px 0 0}
.rh-island-intro{margin:20px 0}.rh-island-intro h2{font-size:1.8rem}.rh-island-intro p{max-width:740px;color:var(--mute);line-height:1.6}
.inswrap{border:0}.rh-island-next{display:flex;align-items:center;gap:22px;background:var(--card);padding:22px;margin-top:18px;border-radius:16px}.rh-island-next>span{font-size:2.8rem}.rh-island-next>div{flex:1}.rh-island-next small{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--pri)}.rh-island-next p{margin:7px 0 0;color:var(--mute);font-size:.9rem}
.rh-book-picker{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin:16px 0}.rh-book-picker label,.rh-name label{display:block;font-weight:800;font-size:.85rem}.rh-book-picker select{display:block;margin-top:7px;width:100%;min-width:0;border:0;background:var(--card);color:var(--ink);padding:14px 12px;border-radius:10px;font:inherit;min-height:48px}
.rh-sessions{background:var(--card);border-radius:14px;margin-bottom:18px;padding:0 18px}.rh-sessions summary{padding:16px 0;font-weight:800;cursor:pointer}.rh-sessions>div{max-height:330px;overflow:auto}.rh-sessions button{display:grid;grid-template-columns:28px 1fr auto 20px;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left;border-top:1px solid var(--line);font-size:.9rem}.rh-sessions button .ico{transform:rotate(180deg)}
.bk-page{background:var(--card);--tb:var(--acs);--ti:var(--pri);border:0}.bk-st.got .sc{border:0}.bk-top h2{font-size:1.6rem}
body[data-theme] [class*="t-"]{--tb:var(--acs);--ti:var(--pri)}
@media(max-width:760px){.rh-test-prizes>div{grid-template-columns:1fr}.rh-island-next{flex-wrap:wrap;gap:14px}.rh-island-next .btn{width:100%}.rh-island-next>div{min-width:190px}.rh-book-picker{grid-template-columns:1fr}}
@media(max-width:440px){.rh-sessions button{grid-template-columns:20px 1fr auto;gap:8px}.rh-sessions button .ico{display:none}.rh-name .row{flex-wrap:wrap}.rh-name input{width:100%}}

/* ADVENTURE DESIGN CSS END */

/* Tablet: kein Zoom per Doppeltipp (Pinch ist per viewport aus) */
html,body{touch-action:manipulation}
/* Avatar-Bühne passt zum schmaleren Rand am Handy (#app hat dort 14px) */
@media(max-width:760px){.av-stage{margin:0 -14px;padding:6px 14px 8px}}
/* Import-Vergleich (Eltern) */
.sumtbl{width:100%;margin:10px 0;font-size:.9rem}.sumtbl td,.sumtbl th{padding:5px 8px;text-align:left}.sumtbl td+td,.sumtbl th+th{text-align:right;font-weight:800}
.modal .card{max-height:90vh;overflow:auto}

/* =====================================================================
   DENKZAUBER DESIGN-SYSTEM  (Quelle: „Meine Weltreise“-Demo)
   Eine Datei für alles Sichtbare: Tokens → Themes → Grundlagen → Komponenten → Seiten.
   Wird als LETZTE Datei geladen und ersetzt die alte Rechenhelden-Oberfläche.
   Regeln:
   - Farben, Radien, Schatten, Abstände, Schrift kommen NUR aus den --dz-* Tokens.
   - Die alten Variablen (--bg, --card, --ink, --mute, --line, --soft, --head, --acs, --pri, --pri2, --priInk) werden hier auf die Tokens gelegt,
     damit alle inneren Seiten (Üben, Test, Shop …) automatisch im neuen Stil erscheinen.
   - Die 8 Theme-IDs (sonne, butter, ocean, wald, sunset, nacht, regen, tuerkis) setzen nur Akzent + ruhige Flächen.
   ===================================================================== */

/* ---------- 1. Tokens ---------- */
body{
  --dz-bd:color-mix(in srgb,var(--dz-accent) 24%,var(--dz-line));--dz-bd-w:1px;
  --dz-font:ui-rounded,"SF Pro Rounded","Avenir Next","Adventure Nunito","Nunito",system-ui,"Segoe UI",sans-serif;
  /* Formen (aus der Demo: 15 · 19 · 24 · 28 · 30 · Pille) */
  --dz-r-xs:12px;--dz-r-s:15px;--dz-r-m:19px;--dz-r-l:24px;--dz-r-xl:28px;--dz-r-pill:999px;
  /* Schatten */
  --dz-sh-card:0 5px 16px rgba(45,52,53,.07);--dz-sh-lift:0 12px 27px rgba(45,52,53,.11);--dz-sh-soft:0 4px 13px rgba(40,48,49,.06);--dz-sh-panel:0 10px 30px rgba(48,54,55,.09);
  /* Bewegung */
  --dz-ease:cubic-bezier(.2,0,0,1);--dz-t:.28s var(--dz-ease);
  /* Abstände */
  --dz-gap:12px;--dz-pad:16px;
  /* Farben (Standard = Theme „sonne“, die ruhige Demo-Palette) */
  --dz-bg:#f3f1ec;--dz-surface:#fbfaf7;--dz-surface2:#e8ece8;
  --dz-ink:#303536;--dz-mute:#697071;--dz-line:#d8d5ce;
  --dz-accent:#526a70;--dz-accent2:#7f9a9f;--dz-accent-ink:#fff;
  --dz-t1:#efede8;--dz-t2:#e7edeb;--dz-t3:#eee6e5;
  --dz-hero-a:#dfe8e6;--dz-hero-b:#ede9e1;--dz-glow:#e9d9da;
  --dz-ok:#3f7a56;--dz-ok-bg:#e3ece6;--dz-bad:#a24a43;--dz-bad-bg:#f3e3e0;--dz-gold:#b08a3a;
  --dz-green:#6f8979;--dz-trunk:#a88c75;
}
body[data-theme="butter"]{--dz-bg:#f5f0e3;--dz-surface:#fcfaf4;--dz-surface2:#ebe9d8;--dz-ink:#3a3426;--dz-mute:#7a705c;--dz-line:#ddd4bc;--dz-accent:#8a6a1f;--dz-accent2:#c49a3a;--dz-t1:#f1ead9;--dz-t2:#ece9d6;--dz-t3:#f0e3dc;--dz-hero-a:#efe6cc;--dz-hero-b:#f3eddf;--dz-glow:#efd9c4}
body[data-theme="ocean"]{--dz-bg:#eef1f2;--dz-surface:#f9fbfb;--dz-surface2:#e1eaee;--dz-ink:#2b3a42;--dz-mute:#637680;--dz-line:#d0dadd;--dz-accent:#3f6f8a;--dz-accent2:#7aa6bd;--dz-t1:#e8eef0;--dz-t2:#e3ecef;--dz-t3:#ebe8ee;--dz-hero-a:#d9e7ec;--dz-hero-b:#e8edee;--dz-glow:#dcdcec}
body[data-theme="wald"]{--dz-bg:#f0f1eb;--dz-surface:#fafbf7;--dz-surface2:#e2eae2;--dz-ink:#2c3a30;--dz-mute:#667568;--dz-line:#d3d9ca;--dz-accent:#4f7358;--dz-accent2:#86a88c;--dz-t1:#e9ede4;--dz-t2:#e2eae2;--dz-t3:#ede8e1;--dz-hero-a:#dbe8dc;--dz-hero-b:#eaeee2;--dz-glow:#ece0cf}
body[data-theme="sunset"]{--dz-bg:#f5efe9;--dz-surface:#fcf9f5;--dz-surface2:#eee3d9;--dz-ink:#3b2f2a;--dz-mute:#7c6c63;--dz-line:#e0d3c6;--dz-accent:#9a5a3c;--dz-accent2:#cc8a68;--dz-t1:#f1e8df;--dz-t2:#eee6dc;--dz-t3:#f1e1e0;--dz-hero-a:#f0ddd0;--dz-hero-b:#f4ebdf;--dz-glow:#f0cfc9}
body[data-theme="regen"]{--dz-bg:#f2f0f4;--dz-surface:#fbfafc;--dz-surface2:#e6e4ee;--dz-ink:#35324a;--dz-mute:#6f6c82;--dz-line:#d9d5e1;--dz-accent:#66608f;--dz-accent2:#9a95bf;--dz-t1:#ece9f0;--dz-t2:#e6ebef;--dz-t3:#efe6ea;--dz-hero-a:#e4e1ee;--dz-hero-b:#ece9ef;--dz-glow:#dbe9e2}
body[data-theme="tuerkis"]{--dz-bg:#eef2f0;--dz-surface:#f9fcfb;--dz-surface2:#dfeceb;--dz-ink:#244042;--dz-mute:#5d7778;--dz-line:#cfdcd9;--dz-accent:#3c7d80;--dz-accent2:#78afb0;--dz-t1:#e6eeec;--dz-t2:#dfeceb;--dz-t3:#e9ece8;--dz-hero-a:#d6e8e6;--dz-hero-b:#e6eeea;--dz-glow:#e3dfd0}
body[data-theme="nacht"]{--dz-bg:#1f2528;--dz-surface:#2a3236;--dz-surface2:#323d41;--dz-ink:#eef1ef;--dz-mute:#aab4b4;--dz-line:#3c474b;--dz-accent:#8fb3b8;--dz-accent2:#b6d0d3;--dz-accent-ink:#1f2528;--dz-t1:#2f383c;--dz-t2:#2b3638;--dz-t3:#34303a;--dz-hero-a:#2e3b3d;--dz-hero-b:#343236;--dz-glow:#4a3a40;--dz-ok:#8fd0a6;--dz-ok-bg:#25402f;--dz-bad:#f0a79f;--dz-bad-bg:#43302d;--dz-gold:#e0c070;--dz-green:#8fb59a;--dz-trunk:#c1a58d;--dz-sh-card:none;--dz-sh-lift:none;--dz-sh-soft:none;--dz-sh-panel:none}

/* ---------- 2. Alte Variablen auf Tokens legen (alle inneren Seiten folgen automatisch) ---------- */
body,body[data-theme],body:not([data-theme]){
  font-family:var(--dz-font);
  --bg:var(--dz-bg);--card:var(--dz-surface);--ink:var(--dz-ink);--mute:var(--dz-mute);--line:var(--dz-line);
  --soft:var(--dz-t1);--head:var(--dz-t2);--acs:var(--dz-t2);--ia:var(--dz-line);
  --pri:var(--dz-accent);--pri2:var(--dz-accent2);--priInk:var(--dz-accent-ink);
  --ok:var(--dz-ok);--okBg:var(--dz-ok-bg);--bad:var(--dz-bad);--badBg:var(--dz-bad-bg);
  --r:var(--dz-r-l);--sh:var(--dz-sh-card);--star:var(--dz-gold);
  --accent-dark:var(--dz-accent);--cta:var(--dz-accent);--cta-ink:var(--dz-accent-ink);
  --art-a:var(--dz-hero-a);--art-b:var(--dz-hero-b);--art-c:var(--dz-t2);
  background:var(--dz-bg);color:var(--dz-ink);
}
html{background:var(--dz-bg)}
body[data-theme] [class*="t-"]{--tb:var(--dz-t2);--ti:var(--dz-accent)}

/* ---------- 3. Grundlagen ---------- */
#app{max-width:980px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3,.hello{font-family:var(--dz-font);font-weight:800;line-height:1.1;letter-spacing:-.02em}
h1{letter-spacing:-.035em}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--dz-accent);outline-offset:3px}
.small{font-size:.86rem}
.mute{color:var(--dz-mute)}

/* Buttons: Pille, ruhig, hebt sich bei Hover/Tap leicht */
.btn{border:0;border-bottom:0;border-radius:var(--dz-r-pill);min-height:46px;padding:8px 20px;font-weight:760;font-size:1rem;background:var(--dz-accent);color:var(--dz-accent-ink);box-shadow:none;transition:transform var(--dz-t),box-shadow var(--dz-t),filter .15s}
.btn:hover{filter:none;transform:translateY(-2px);box-shadow:var(--dz-sh-soft)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--dz-surface);color:var(--dz-ink);border:0;box-shadow:var(--dz-sh-soft)}
.btn.ghost{background:transparent;color:var(--dz-ink);border:1.5px solid var(--dz-line);box-shadow:none}
.btn.big{min-height:54px;font-size:1.08rem;padding:10px 26px}
.btn.sm{min-height:38px;padding:5px 14px;font-size:.9rem}
.btn.red{background:var(--dz-bad);color:#fff}
.btn[disabled]{opacity:.45}
.card{background:var(--dz-surface);border:0;border-radius:var(--dz-r-l);box-shadow:var(--dz-sh-card);padding:16px}
.chip{background:var(--dz-surface);border:0;border-radius:var(--dz-r-pill);box-shadow:var(--dz-sh-soft);min-height:38px;padding:0 13px 0 10px;font-weight:720}
.bar{height:10px;background:var(--dz-t2)}
.bar>i{background:var(--dz-accent)}
.txt,input.txt,select.txt,textarea.txt{border:1.5px solid var(--dz-line);border-radius:var(--dz-r-s);background:var(--dz-surface);color:var(--dz-ink);font-family:inherit}

/* Kopfzeile innerer Seiten: Zurück-Pille · Titel · Münzen/Sterne */
.top{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-height:62px;margin:0 0 6px}
.top .back,.top .dz-home{width:auto;min-width:40px;height:40px;min-height:40px;padding:0 13px 0 9px;border-radius:var(--dz-r-pill);background:var(--dz-surface);color:var(--dz-ink);box-shadow:var(--dz-sh-soft);display:inline-flex;align-items:center;gap:4px;font-weight:720;font-size:.9rem;border:0;flex:none}
.top .dz-home{padding:0;width:40px;justify-content:center}
.top .back .ico,.top .dz-home .ico{width:20px;height:20px}
.top h2{flex:1;min-width:0;font-size:clamp(1.15rem,3.2vw,1.55rem);gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h2 .ico{color:var(--dz-accent)}
.top .stats{flex:none;flex-wrap:nowrap}
.top .noprint{flex:none}
@media(max-width:560px){.top{flex-wrap:wrap;row-gap:6px}.top h2{order:3;flex-basis:100%}.top .back span{display:none}.top .back{padding:0 9px}.top .stats{margin-left:auto}}

/* ---------- 4. Komponenten ---------- */
/* Wallet-Chips (Startseite, Profil) */
.dz-chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 10px;border:0;border-radius:var(--dz-r-pill);background:var(--dz-surface);color:var(--dz-ink);font:inherit;font-weight:760;box-shadow:var(--dz-sh-soft);cursor:pointer;position:relative;transition:transform var(--dz-t),box-shadow var(--dz-t);white-space:nowrap}
.dz-chip:hover{transform:translateY(-2px);box-shadow:var(--dz-sh-lift)}.dz-chip:active{transform:scale(.97)}
.dz-chip svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--dz-accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dz-chip b{font-size:1rem}
.dz-chip.dz-pulse:after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--dz-gold);box-shadow:0 0 0 0 rgba(176,138,58,.5);animation:dzPulse 2.2s var(--dz-ease) infinite}
@keyframes dzPulse{70%{box-shadow:0 0 0 8px rgba(176,138,58,0)}100%{box-shadow:0 0 0 0 rgba(176,138,58,0)}}

/* Startseiten-Kopf: Profil links, Wallet daneben */
.dz-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:62px}
.dz-me{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 16px 0 5px;border:0;border-radius:var(--dz-r-pill);background:var(--dz-surface);box-shadow:var(--dz-sh-soft);cursor:pointer;text-align:left;color:var(--dz-ink);font:inherit;transition:transform var(--dz-t),box-shadow var(--dz-t)}
.dz-me:hover{transform:translateY(-2px);box-shadow:var(--dz-sh-lift)}.dz-me:active{transform:scale(.98)}
.dz-me .avwrap{--s:44px;width:44px;height:44px;padding:0;background:var(--dz-t2);box-shadow:none}
.dz-me .avwrap .avatar{background:var(--dz-t2)}
.dz-me span{display:block;line-height:1.15}.dz-me strong{display:block;font-size:.98rem;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dz-me small{display:block;font-size:.72rem;color:var(--dz-mute);font-weight:700}
.dz-wallet{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media(max-width:560px){.dz-wallet{margin-left:0;width:100%}.dz-chip{height:36px;padding:0 10px 0 8px;font-size:.9rem}}

/* Hero (aus „departure-head“) */
.dz-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,var(--dz-hero-a),var(--dz-hero-b));border-radius:var(--dz-r-xl);padding:22px 25px;min-height:132px;box-shadow:var(--dz-sh-panel);margin-top:8px}
.dz-hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-70px;top:-95px;background:var(--dz-glow);filter:blur(22px);pointer-events:none}
.dz-hero-copy{position:relative;z-index:1;min-width:0}
.dz-hero-copy small{display:block;font-weight:760;color:var(--dz-accent)}
.dz-hero-copy h1{font-size:clamp(26px,4vw,40px);margin:5px 0 7px}
.dz-hero-copy p{margin:0;color:var(--dz-mute);line-height:1.45}
.dz-hero.sm{min-height:0;padding:16px 20px}
.dz-hero.sm h1{font-size:clamp(22px,3.4vw,30px);margin:2px 0 4px}
.dz-hero-art{position:relative;z-index:1;flex:none}

/* Abschnittstitel */
.dz-sec{display:flex;align-items:flex-end;justify-content:space-between;margin:20px 3px 10px;gap:10px}
.dz-sec h2{font-size:20px;margin:0;letter-spacing:-.01em}.dz-sec p{margin:3px 0 0;color:var(--dz-mute);font-size:13px}

/* Quadratische Kachel („destination-card“): Kachelraster mit --n Spalten, Inhalt skaliert mit der Kachelbreite */
.dz-grid{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:var(--dz-gap)}
.dz-tile{container-type:inline-size;position:relative;aspect-ratio:1/1;min-width:0;border:0;border-radius:var(--dz-r-l);background:var(--dz-surface);box-shadow:var(--dz-sh-card);padding:0;cursor:pointer;color:var(--dz-ink);font:inherit;text-align:center;overflow:hidden;display:block;transition:transform var(--dz-t),box-shadow var(--dz-t)}
.dz-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw}
.dz-tile:hover{transform:translateY(-3px);box-shadow:var(--dz-sh-lift)}.dz-tile:active{transform:scale(.98)}
.dz-tile.t1{background:var(--dz-t1)}.dz-tile.t2{background:var(--dz-t2)}.dz-tile.t3{background:var(--dz-t3)}
.dz-tile .dz-art{width:56cqw;height:46cqw;display:grid;place-items:center;flex:none}
.dz-tile .dz-art svg{width:100%;height:100%;overflow:visible}
.dz-tile .dz-art .avwrap{--s:46cqw;width:46cqw;height:46cqw;padding:0;background:none;box-shadow:none}
.dz-tile .dz-art .avatar{background:none;overflow:visible}
.dz-tile strong{display:block;font-size:max(11px,9.6cqw);font-weight:800;line-height:1.1;letter-spacing:-.01em;padding:0 5cqw;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dz-tile small{display:block;font-size:max(9px,7.6cqw);color:var(--dz-mute);font-weight:700;line-height:1.2;padding:0 5cqw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width:84px){.dz-tile small{display:none}}
.dz-tile .dz-state{position:absolute;right:5cqw;top:5cqw;border-radius:999px;background:var(--dz-ok-bg);color:var(--dz-ok);padding:.3em .65em;font-size:max(8px,7cqw);font-weight:800;display:inline-flex;align-items:center;gap:3px}
.dz-tile .dz-state svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.2}
.dz-tile .dz-bar{position:absolute;left:10cqw;right:10cqw;bottom:6cqw;height:max(4px,2.6cqw);border-radius:99px;background:rgba(48,54,55,.1);overflow:hidden}
body[data-theme=nacht] .dz-tile .dz-bar{background:rgba(255,255,255,.14)}
.dz-tile .dz-bar i{display:block;height:100%;border-radius:99px;background:var(--dz-accent);transition:width .5s var(--dz-ease)}
.dz-tile.has-bar .dz-in{justify-content:flex-start;padding-top:10cqw;gap:2cqw}
.dz-tile.has-bar .dz-art{width:46cqw;height:34cqw}
.dz-tile.locked{background:#e9e7e2;box-shadow:none;color:#626667;cursor:default}
body[data-theme=nacht] .dz-tile.locked{background:var(--dz-t1);color:var(--dz-mute)}
.dz-tile.locked:hover{transform:none}
.dz-tile.locked .dz-art{filter:grayscale(.8);opacity:.6}
.dz-tile.done{outline:2px solid var(--dz-ok);outline-offset:-2px}
.dz-tile.wide-only small{display:none}
@container (min-width:96px){.dz-tile.wide-only small{display:block}}
.dz-slot{visibility:hidden;aspect-ratio:1/1;pointer-events:none}            /* reservierter Platz für spätere Funktionen */
.dz-slot[hidden]{display:block}
.dz-tile .dz-pct{position:absolute;right:5cqw;top:5cqw;font-size:max(8px,7.6cqw);font-weight:800;color:var(--dz-mute)}
.dz-tile .dz-tag{position:absolute;left:5cqw;top:5cqw;border-radius:999px;background:var(--dz-surface);box-shadow:var(--dz-sh-soft);padding:.3em .65em;font-size:max(8px,7cqw);font-weight:800;display:inline-flex;align-items:center;gap:3px;color:var(--dz-ink)}
.dz-tile .dz-tag svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2}
.dz-tile.pulse:after{content:"";position:absolute;right:6cqw;top:6cqw;width:9px;height:9px;border-radius:50%;background:var(--dz-gold);animation:dzPulse 2.2s var(--dz-ease) infinite}
@media(max-width:439px){.dz-grid.dz-home4{--n:2!important}}

/* Akkordeon (Kapitel) – nur eines offen */
.dz-acc{display:grid;gap:10px}
.dz-acc-item{background:var(--dz-surface);border-radius:var(--dz-r-l);box-shadow:var(--dz-sh-card);overflow:hidden}
.dz-acc-head{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--dz-ink);font:inherit;min-height:64px}
.dz-acc-head:hover .dz-acc-chev{transform:translateY(1px)}
.dz-acc-badge{flex:none;width:40px;height:40px;border-radius:var(--dz-r-s);background:var(--dz-t2);display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:var(--dz-accent)}
.dz-acc-item:nth-child(3n+2) .dz-acc-badge{background:var(--dz-t3)}.dz-acc-item:nth-child(3n) .dz-acc-badge{background:var(--dz-t1)}
.dz-acc-text{flex:1;min-width:0}.dz-acc-text strong{display:block;font-size:1.05rem}.dz-acc-text small{display:block;color:var(--dz-mute);font-size:.8rem;font-weight:700;margin-top:2px}
.dz-acc-chev{flex:none;width:22px;height:22px;stroke:var(--dz-mute);fill:none;stroke-width:2;stroke-linecap:round;transition:transform var(--dz-t)}
.dz-acc-item.open .dz-acc-chev{transform:rotate(180deg)}
.dz-acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dz-t)}
.dz-acc-item.open .dz-acc-body{grid-template-rows:1fr}
.dz-acc-inner{overflow:hidden;min-height:0}
.dz-acc-pad{padding:2px 14px 16px}
.dz-acc-note{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:var(--dz-r-m);background:var(--dz-t2);color:var(--dz-mute);font-size:.82rem;font-weight:700}
.dz-acc-note svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex:none}

/* Hinweis-Box (aus „departure-note“) */
.dz-note{margin-top:14px;border-radius:var(--dz-r-m);background:var(--dz-t2);padding:12px 15px;font-size:13px;line-height:1.45;color:var(--dz-mute)}
.dz-note b{color:var(--dz-ink)}
.dz-panel{background:var(--dz-surface);border-radius:var(--dz-r-xl);padding:18px 20px;box-shadow:var(--dz-sh-card)}
.dz-info{background:var(--dz-t1);border-radius:var(--dz-r-m);padding:13px}
.dz-info:nth-child(3n+2){background:var(--dz-t2)}.dz-info:nth-child(3n){background:var(--dz-t3)}
.dz-pill{display:inline-flex;align-items:center;gap:6px;height:38px;border:0;border-radius:var(--dz-r-pill);background:var(--dz-surface);box-shadow:var(--dz-sh-soft);padding:0 14px;font:inherit;font-weight:720;color:var(--dz-ink);cursor:pointer;transition:transform var(--dz-t)}
.dz-pill:hover{transform:translateY(-2px)}.dz-pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9}
.dz-linkbtn{border:0;background:transparent;color:var(--dz-mute);font:inherit;font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;cursor:pointer}

<noscript>Bitte JavaScript aktivieren.</noscript>
<script>
/* =====================================================================
   QUESTION GENERATORS + MODULE REGISTRY
   ---------------------------------------------------------------------
   A question is a plain object (JSON-safe, so it can be stored in the
   Fehler-Heft):
     { title, html, fields:[{a, digit?, strict?, money?, next?}], hint, explain }
        html uses [[0]], [[1]] ... as placeholders for answer fields
     { title, prompt, choices:[html...], correct:int, hint, explain }

   TO ADD A NEW BOOK MODULE (ids A1–A5, B1–B5, C1–C5, D1–D5 – Kapitel A–D je 5 Hefte):
     Extra-Training (nicht im Arbeitsheft): beliebige ID ohne dieses Muster + extra:true (siehe EMAL/KOPF/SCHR).
     1. write generator functions  g_xyz(level)  (level 1..5)
        Levels used in practice decks: 2..5  ->  worth 1..4 points
        (2 = leicht, 3 = mittel, 4 = schwer, 5 = Boss). Level 1 is only a warm-up level.
     2. add an entry to MODULES at the bottom of this file
   Home screen, topic screens, trophies, parent view, Mini-Test and
   progress saving all pick the new module up automatically.
   ===================================================================== */

/* ---------- utils ---------- */
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');
const eur = c => Math.floor(c / 100) + ',' + pad2(c % 100);      // cents -> "12,05"
const E = c => eur(c) + ' €';
const F = (a, o) => Object.assign({ a: String(a) }, o || {});
const FM = c => F(eur(c), { money: true });                      // money, lenient format
const FS = a => F(a, { strict: true });                          // exact format required
const T10 = [10, 20, 30, 40, 50, 60, 70, 80, 90];
const gcd = (x, y) => y ? gcd(y, x % y) : x;
const lcm = (a, b) => a * b / gcd(a, b);
const eqLine = (txt, cls) => `<div class="eq${cls ? ' ' + cls : ''}">${txt}</div>`;

/* =====================================================================
   A4  DIVISION
   ===================================================================== */

function g_umkehr(L) {
  let a, b;
  if (L >= 4) { a = ri(L === 4 ? 11 : 12, L === 4 ? 25 : 45); b = pick(L === 4 ? T10 : [...T10, 100, 200]); }
  else { a = ri(2, 9); b = pick(L === 1 ? T10 : [...T10, 100]); }
  const p = a * b, swap = L >= 2 && Math.random() < .5;
  const first = swap ? `${b} · ${a}` : `${a} · ${b}`;
  let html = eqLine(`${first} = [[0]]`) + eqLine(`U: [[1]] : ${b} = ${a}`, 'u');
  const fields = [F(p), F(p)];
  if (L >= 2) { html += eqLine(`U: [[2]] : ${a} = ${b}`, 'u'); fields.push(F(p)); }
  return {
    title: 'Rechne aus. Schreibe die passende Umkehraufgabe.',
    html, fields,
    hint: `Denke an die kleine Aufgabe: ${a} · ${b / 10} = ${a * b / 10}. Das Ergebnis wird zehnmal so groß.`,
    explain: `${first} = ${p}  →  ${p} : ${b} = ${a}` + (L >= 2 ? `  und  ${p} : ${a} = ${b}` : '')
  };
}

function g_kleine(L) {
  const typeB = L >= 2 && Math.random() < (L === 2 ? .4 : .55);
  if (!typeB) {
    let q, d, D;
    do {
      q = L >= 4 ? ri(L === 4 ? 10 : 12, L === 4 ? 20 : 30) : ri(2, L === 1 ? 5 : 9);
      d = ri(L >= 4 ? 2 : 1, 9) * 10; D = q * d;
    } while (D > (L === 4 ? 2000 : L >= 5 ? 6000 : 1000));
    return {
      title: 'Rechne erst die kleine Geteiltaufgabe, dann die große.',
      html: eqLine(`${D / 10} : ${d / 10} = [[0]]`) + eqLine(`${D} : ${d} = [[1]]`),
      fields: [F(q), F(q)],
      hint: `Streiche bei beiden Zahlen eine Null: ${D / 10} : ${d / 10}.`,
      explain: `${D / 10} : ${d / 10} = ${q}  →  ${D} : ${d} = ${q}`
    };
  }
  const d = ri(2, 9), q = L >= 4 ? ri(12, L === 4 ? 30 : 60) : ri(2, 9), small = q * d, D = small * 10;
  return {
    title: 'Rechne erst die kleine Geteiltaufgabe, dann die große.',
    html: eqLine(`${small} : ${d} = [[0]]`) + eqLine(`${D} : ${d} = [[1]]`),
    fields: [F(q), F(q * 10)],
    hint: `Rechne zuerst ${small} : ${d}. Bei ${D} : ${d} wird das Ergebnis zehnmal so groß.`,
    explain: `${small} : ${d} = ${q}  →  ${D} : ${d} = ${q * 10}`
  };
}

function g_divtens(L) {
  let q, d, D;
  if (L >= 4) { q = ri(11, L === 4 ? 25 : 45); d = ri(2, L === 4 ? 9 : 19) * 10; D = q * d; }
  else do { q = ri(1, L === 1 ? 5 : L === 2 ? 9 : 10); d = ri(1, L === 3 ? 10 : 9) * 10; D = q * d; } while (D > 1000);
  return {
    title: 'Rechne aus.',
    html: eqLine(`${D} : ${d} = [[0]]`, 'big'),
    fields: [F(q)],
    hint: `Streiche bei beiden Zahlen eine Null: ${D / 10} : ${d / 10}. Oder frage: ${d} mal wie viel ist ${D}?`,
    explain: `${D} : ${d} = ${q}, denn ${q} · ${d} = ${D}`
  };
}

const GT_SETS = {
  1: [[1, 10, 100], [2, 20, 200], [5, 50, 500]],
  2: [[10, 50, 100], [20, 40, 80], [10, 100, 200], [25, 50, 100], [10, 50, 500]],
  3: [[30, 60, 90], [40, 80, 160], [20, 50, 100], [15, 30, 60], [12, 60, 120]],
  4: [[30, 60, 120], [40, 80, 160], [50, 100, 200], [25, 50, 100], [45, 90, 180]],
  5: [[25, 75, 150], [40, 120, 240], [45, 90, 270], [35, 70, 140], [60, 90, 180]]
};
function g_geteilt(L) {
  const cols = pick(GT_SETS[L]), m = cols.reduce(lcm, 1);
  const mult = []; for (let x = m; x <= (L >= 4 ? 3000 : 1000); x += m) mult.push(x);
  const rows = shuffle(mult).slice(0, 2).sort((a, b) => b - a);
  let k = 0; const fields = [], ex = [];
  let html = '<table class="gt"><tr><th>:</th>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    html += `<tr><th>${r}</th>`;
    cols.forEach(c => { html += `<td>[[${k++}]]</td>`; fields.push(F(r / c)); ex.push(`${r} : ${c} = ${r / c}`); });
    html += '</tr>';
  });
  html += '</table>';
  return {
    title: 'Rechne die Geteilttabelle aus.',
    html, fields,
    hint: 'Teile die Zahl in der Zeile durch die Zahl oben in der Spalte. Die kleine Geteiltaufgabe hilft dir.',
    explain: ex.join('; ')
  };
}

function g_paeckchen(L) {
  const r = Math.random(), hard = L >= 4;
  const v = L === 1 ? (r < .45 ? 1 : r < .9 ? 2 : 3) : hard ? (r < .3 ? 1 : r < .6 ? 2 : 3) : (r < .3 ? 1 : r < .55 ? 2 : 3);
  if (v === 1) {                       // gleiches Ergebnis
    let q, s;
    do {

function buildOps(n, L) {

    title: op === '+' ? 'Rechne schriftlich: addieren.' : 'Rechne schriftlich: subtrahieren.',

    hint: op === '+' ? 'Von rechts nach links: Einer, Zehner, Hunderter … Denke an den Übertrag.' : 'Von rechts nach links. Reicht die obere Ziffer nicht, entbündle einen Zehner von links.',

  // Knobelfragen (neu)
  { id: 'q21', t: 'frage', e: '🚆', q: 'Ein Zug hat 6 Wagen mit je 80 Plätzen. Wie viele Plätze sind das zusammen?', a: '480 Plätze, denn 6 · 80 = 480.' },
  { id: 'q22', t: 'frage', e: '👟', q: 'Am ersten Tag läufst du 3 km, an jedem weiteren Tag 2 km mehr als am Tag davor. Wie viele Kilometer sind es nach 4 Tagen insgesamt?', a: '24 km: 3 + 5 + 7 + 9 = 24.' },
  { id: 'q23', t: 'frage', e: '🔢', q: 'Wie geht die Reihe weiter? 2, 4, 8, 16, …', a: '32. Jede Zahl ist das Doppelte der Zahl davor.' },
  { id: 'q24', t: 'frage', e: '🟦', q: 'Wie geht die Reihe weiter? 1, 4, 9, 16, 25, …', a: '36. Das sind die Quadratzahlen: 1·1, 2·2, 3·3, … und 6·6 = 36.' },
  { id: 'q25', t: 'frage', e: '🐚', q: 'Wie geht die Reihe weiter? 1, 1, 2, 3, 5, 8, …', a: '13. Jede Zahl ist die Summe der beiden davor (5 + 8 = 13). Das ist die Fibonacci-Reihe.' },
  { id: 'q26', t: 'frage', e: '🎣', q: 'Zwei Väter und zwei Söhne gehen angeln. Jeder fängt genau einen Fisch, aber insgesamt sind es nur 3 Fische. Wie geht das?', a: 'Es sind nur 3 Personen: Großvater, Vater und Sohn. Der Vater ist beides – Vater und Sohn.' },
  { id: 'q27', t: 'frage', e: '🐑', q: 'Ein Bauer hat 17 Schafe. Alle bis auf 9 laufen weg. Wie viele Schafe sind noch da?', a: '9 Schafe. „Alle bis auf 9“ heißt: 9 bleiben.' },
  { id: 'q28', t: 'frage', e: '🍕', q: 'Eine Pizza ist in 8 gleich große Stücke geschnitten. Du isst 3 Stücke. Welcher Bruchteil der Pizza ist noch übrig?', a: '5/8, denn 8 − 3 = 5 Stücke von 8.' },
  { id: 'q29', t: 'frage', e: '🍬', q: 'Du hast 24 Gummibärchen und gibst ein Drittel davon deiner Freundin. Wie viele bekommt sie?', a: '8 Stück, denn 24 : 3 = 8.' },
  { id: 'q30', t: 'frage', e: '⚖️', q: 'Was ist größer: 1/2 oder 1/3?', a: '1/2. Je mehr Teile, desto kleiner ist jedes einzelne Teil: Ein Drittel ist kleiner als ein Halbes.' },
  { id: 'q31', t: 'frage', e: '✂️', q: 'Wie viel ist die Hälfte von der Hälfte von 80?', a: '20. Die Hälfte von 80 ist 40, die Hälfte davon ist 20.' },
  { id: 'q32', t: 'frage', e: '🥚', q: 'Du kaufst ein Dutzend Eier und noch ein halbes Dutzend dazu. Wie viele Eier sind das?', a: '18 Eier, denn 12 + 6 = 18.' },
  { id: 'q33', t: 'frage', e: '🎂', q: 'Mia ist doppelt so alt wie ihr Bruder Ben. Ben ist 5. Wie alt ist Mia, wenn Ben 10 ist?', a: '15. Mia ist jetzt 10, also immer 5 Jahre älter als Ben. Das Doppelte wäre 20 – aber der Altersunterschied bleibt gleich!' },
  { id: 'q34', t: 'frage', e: '📐', q: 'Ein Rechteck ist 6 m lang und 4 m breit. Wie groß sind Umfang und Fläche?', a: 'Umfang: 20 m (6 + 4 + 6 + 4). Fläche: 24 m² (6 · 4).' },
  { id: 'q35', t: 'frage', e: '🧊', q: 'Wie viele Ecken und wie viele Kanten hat ein Würfel?', a: '8 Ecken und 12 Kanten.' },
  { id: 'q36', t: 'frage', e: '⏱️', q: 'Wie viele Minuten haben 3 Stunden?', a: '180 Minuten, denn 3 · 60 = 180.' },
  { id: 'q37', t: 'frage', e: '🕒', q: 'Es ist 14:45 Uhr. Wie spät ist es in 50 Minuten?', a: '15:35 Uhr. Erst 15 Minuten bis 15:00 Uhr, dann noch 35 Minuten dazu.' },
  { id: 'q38', t: 'frage', e: '🎬', q: 'Ein Film dauert 1 Stunde und 45 Minuten und beginnt um 16:30 Uhr. Wann ist er zu Ende?', a: '18:15 Uhr. 16:30 + 1 Stunde = 17:30, plus 45 Minuten = 18:15.' },
  { id: 'q39', t: 'frage', e: '👕', q: 'Du hast 3 Hosen und 4 T-Shirts. Wie viele verschiedene Outfits kannst du daraus kombinieren?', a: '12 Outfits, denn 3 · 4 = 12.' },
  { id: 'q40', t: 'frage', e: '🍨', q: 'Es gibt 5 Eissorten und 3 verschiedene Soßen. Du nimmst eine Kugel und eine Soße. Wie viele Möglichkeiten gibt es?', a: '15 Möglichkeiten, denn 5 · 3 = 15.' },
  { id: 'q41', t: 'frage', e: '⚖️', q: 'Wie viele Gramm sind 5 Kilogramm?', a: '5000 Gramm, denn 1 kg = 1000 g.' },
  { id: 'q42', t: 'frage', e: '📏', q: 'Wie viele Zentimeter sind 2,5 Meter?', a: '250 cm, denn 1 m = 100 cm.' },
  { id: 'q43', t: 'frage', e: '📅', q: 'Wie viele Tage sind 5 Wochen und 3 Tage?', a: '38 Tage, denn 5 · 7 = 35 und 35 + 3 = 38.' },
  { id: 'q44', t: 'frage', e: '🐞', q: 'Wie viele Beine haben 7 Marienkäfer und 3 Spinnen zusammen?', a: '66 Beine: 7 · 6 = 42 und 3 · 8 = 24. Zusammen 42 + 24 = 66.' },
  { id: 'q45', t: 'frage', e: '🐌', q: 'Eine Schnecke will aus einem 10 m tiefen Brunnen klettern. Tagsüber schafft sie 3 m nach oben, nachts rutscht sie 2 m zurück. Am wievielten Tag ist sie draußen?', a: 'Am 8. Tag! Jeden Tag kommt sie netto 1 m weiter. Nach 7 Tagen und Nächten ist sie bei 7 m, am 8. Tag klettert sie noch 3 m – und ist oben, bevor sie wieder zurückrutschen kann.' },
  { id: 'q46', t: 'frage', e: '🕵️', q: 'Ich bin ein Vielfaches von 6, kleiner als 50 und meine Quersumme ist 12. Wer bin ich?', a: '48, denn 8 · 6 = 48 und 4 + 8 = 12.' },
  { id: 'q47', t: 'frage', e: '🕵️', q: 'Ich bin eine ungerade Zahl zwischen 20 und 30 und lasse mich durch 9 teilen. Wer bin ich?', a: '27, denn 3 · 9 = 27.' },
  { id: 'q48', t: 'frage', e: '🔟', q: 'Welche Primzahlen gibt es zwischen 10 und 20?', a: '11, 13, 17 und 19. Die haben keine anderen Teiler außer 1 und sich selbst.' },
  { id: 'q49', t: 'frage', e: '🧠', q: 'Rechne im Kopf: 99 + 99 + 99. Gibt es einen Trick?', a: '297. Trick: 3 · 100 = 300, dann 3 abziehen.' },
  { id: 'q50', t: 'frage', e: '⚡', q: 'Rechne möglichst schlau: 25 · 4 · 7.', a: '700. Erst 25 · 4 = 100 und dann 100 · 7 = 700.' },
  { id: 'q51', t: 'frage', e: '♻️', q: 'Du gibst 8 Flaschen mit je 25 Cent Pfand zurück. Wie viel Geld bekommst du?', a: '2,00 €, denn 8 · 25 ct = 200 ct.' },
  { id: 'q52', t: 'frage', e: '🥐', q: 'Du kaufst 3 Brötchen zu je 0,45 € und bezahlst mit 2 €. Wie viel Rückgeld bekommst du?', a: '0,65 €. Die Brötchen kosten 3 · 0,45 € = 1,35 €, und 2,00 € − 1,35 € = 0,65 €.' },
  { id: 'q53', t: 'frage', e: '✏️', q: 'Ein Stift kostet 1,20 € und ein Heft 2,30 €. Du zahlst mit einem 5-Euro-Schein. Wie viel Rückgeld bekommst du?', a: '1,50 €, denn 1,20 € + 2,30 € = 3,50 € und 5,00 € − 3,50 € = 1,50 €.' },
  { id: 'q54', t: 'frage', e: '🍕', q: '8 Kinder teilen sich 2 Pizzen, jede mit 8 Stücken. Wie viele Stücke bekommt jedes Kind?', a: '2 Stücke, denn 2 · 8 = 16 Stücke und 16 : 8 = 2.' },
  { id: 'q55', t: 'frage', e: '🚌', q: 'Im Bus sitzen 24 Leute. An der Haltestelle steigen 9 aus und 5 ein. Wie viele Leute sind jetzt im Bus?', a: '20 Leute, denn 24 − 9 + 5 = 20.' },
  { id: 'q56', t: 'frage', e: '😴', q: 'Eine Katze schläft etwa 16 Stunden am Tag. Wie viele Stunden schläft sie in einer Woche?', a: '112 Stunden, denn 7 · 16 = 112.' },
  { id: 'q57', t: 'frage', e: '♟️', q: 'Ein Schachbrett hat 8 mal 8 Felder. Wie viele Felder sind es insgesamt und wie viele davon sind weiß?', a: '64 Felder, davon 32 weiße, denn 8 · 8 = 64 und die Hälfte ist weiß.' },
  { id: 'q58', t: 'frage', e: '🚗', q: 'Ein Auto fährt 80 km pro Stunde. Wie weit kommt es in 2 ½ Stunden?', a: '200 km: 2 Stunden sind 160 km, eine halbe Stunde sind 40 km.' },
  { id: 'q59', t: 'frage', e: '🕰️', q: 'Wie viele Sekunden hat eine Stunde?', a: '3600 Sekunden, denn 60 · 60 = 3600.' },
  { id: 'q60', t: 'frage', e: '🏫', q: 'Dein Schulweg ist 1,2 km lang. Wie viele Kilometer gehst du in einer Schulwoche (5 Tage), wenn du immer hin und zurück läufst?', a: '12 km, denn 1,2 km · 2 · 5 = 12 km.' },
  { id: 'q61', t: 'frage', e: '🎩', q: 'Zaubertrick: Denk dir eine Zahl. Verdopple sie, addiere 10, halbiere das Ergebnis und zieh deine Zahl wieder ab. Was kommt heraus?', a: 'Immer 5! Zum Beispiel mit 7: 7 → 14 → 24 → 12 → 12 − 7 = 5.' },
  { id: 'q62', t: 'frage', e: '➕', q: 'Wie viel ist 1 + 2 + 3 + … + 10? Tipp: Bilde Paare.', a: '55. Die Paare 1+10, 2+9, 3+8, 4+7, 5+6 ergeben je 11. Das sind 5 Paare: 5 · 11 = 55.' },
  { id: 'q63', t: 'frage', e: '🧑‍🎓', q: 'Der berühmte Mathematiker Gauß soll als Kind in Sekunden 1 + 2 + 3 + … + 100 ausgerechnet haben. Kannst du das auch?', a: '5050. Es gibt 50 Paare (1+100, 2+99, …), jedes ergibt 101. Und 50 · 101 = 5050.' },
  { id: 'q64', t: 'frage', e: '🐓', q: 'Im Stall stehen Hühner und Kühe. Zusammen sind es 10 Tiere und 28 Beine. Wie viele Hühner sind es?', a: '6 Hühner und 4 Kühe, denn 6 · 2 + 4 · 4 = 12 + 16 = 28.' },
  { id: 'q65', t: 'frage', e: '👔', q: 'Ein Hemd braucht in der Sonne 1 Stunde zum Trocknen. Wie lange brauchen 5 Hemden, die nebeneinander hängen?', a: 'Auch 1 Stunde. Sie trocknen gleichzeitig.' },
  { id: 'q66', t: 'frage', e: '9️⃣', q: 'Wie viele Zahlen von 1 bis 100 enthalten mindestens eine Ziffer 9?', a: '19 Zahlen: 9, 19, 29, … 89 (das sind 9 Zahlen) und 90 bis 99 (das sind 10 Zahlen).' },
  { id: 'q67', t: 'frage', e: '🎲', q: 'Du wirfst zwei Würfel und zählst die Augen zusammen. Welche Summe kommt am häufigsten vor?', a: 'Die 7. Dafür gibt es 6 Möglichkeiten (1+6, 2+5, 3+4, 4+3, 5+2, 6+1). Bei jeder anderen Summe sind es weniger.' },
  { id: 'q68', t: 'frage', e: '🧊', q: 'Ein Würfel hat 2 cm Kantenlänge. Wie viele kleine Würfel mit 1 cm Kantenlänge passen hinein?', a: '8 Würfel. Unten 2 · 2 = 4 Stück, und das ganze zweimal übereinander.' },
  { id: 'q69', t: 'frage', e: '🚸', q: 'Zehn Kinder stehen in einer Reihe. Mia steht an vierter Stelle von vorne. An welcher Stelle steht sie von hinten?', a: 'An 7. Stelle, denn 10 − 4 + 1 = 7. Hinter ihr stehen 6 Kinder.' },
  { id: 'q70', t: 'frage', e: '🚶', q: 'In einer Schlange stehen vor dir 5 Kinder und hinter dir 3. Wie viele Kinder stehen in der Schlange?', a: '9 Kinder, denn 5 + dich + 3 = 9.' },
  { id: 'q71', t: 'frage', e: '🏡', q: 'Ein gerader Zaun hat 10 Pfosten. Wie viele Zaunstücke sind dazwischen?', a: '9 Zaunstücke. Zwischen 10 Pfosten sind 9 Lücken.' },
  { id: 'q72', t: 'frage', e: '🥂', q: '5 Kinder stoßen mit ihren Gläsern an, jedes mit jedem genau einmal. Wie oft klirrt es?', a: '10-mal: 4 + 3 + 2 + 1 = 10.' },
  { id: 'q73', t: 'frage', e: '🔀', q: 'Du hast die Ziffernkärtchen 1, 2 und 3. Wie viele verschiedene dreistellige Zahlen kannst du damit legen, wenn du jedes Kärtchen genau einmal nimmst?', a: '6 Zahlen: 123, 132, 213, 231, 312 und 321.' },
  { id: 'q74', t: 'frage', e: '🔡', q: 'Wie viele Ziffern musst du schreiben, um alle Zahlen von 1 bis 20 aufzuschreiben?', a: '31 Ziffern: Die Zahlen 1 bis 9 brauchen 9 Ziffern, die Zahlen 10 bis 20 sind 11 Zahlen mit je 2 Ziffern = 22. Zusammen 31.' },
  { id: 'q75', t: 'frage', e: '⏰', q: 'Wie viele Minuten hat eine Dreiviertelstunde?', a: '45 Minuten, denn 60 : 4 = 15 und 3 · 15 = 45.' },
  { id: 'q76', t: 'frage', e: '🟫', q: 'Wie viele Quadratzentimeter hat ein Quadratmeter?', a: '10.000 cm², denn 1 m = 100 cm und 100 · 100 = 10.000.' },

  { id: 'r01', t: 'raetsel', e: '🦷', q: 'Was hat viele Zähne, aber kann nicht beißen?', a: 'Ein Kamm. (Auch eine Säge oder ein Zahnrad passen!)' },

  { id: 'r11', t: 'raetsel', e: '🔮', q: 'Was ist immer vor dir, aber du kannst es nicht sehen?', a: 'Die Zukunft.' },
  { id: 'r12', t: 'raetsel', e: '🌧️', q: 'Was fällt vom Himmel, ohne sich wehzutun?', a: 'Der Regen (oder der Schnee).' },
  { id: 'r13', t: 'raetsel', e: '🤫', q: 'Was geht kaputt, sobald du seinen Namen sagst?', a: 'Die Stille.' },
  { id: 'r14', t: 'raetsel', e: '💨', q: 'Was ist leichter als eine Feder, aber trotzdem kann es kaum jemand länger als ein paar Minuten halten?', a: 'Der Atem.' },
  { id: 'r15', t: 'raetsel', e: '🌑', q: 'Was folgt dir überallhin, verschwindet aber im Dunkeln?', a: 'Dein Schatten.' },
  { id: 'r16', t: 'raetsel', e: '🗺️', q: 'Ich habe Städte, aber keine Häuser. Ich habe Flüsse, aber kein Wasser. Ich habe Berge, aber keine Steine. Was bin ich?', a: 'Eine Landkarte.' },
  { id: 'r17', t: 'raetsel', e: '🌫️', q: 'Je mehr du davon hast, desto weniger siehst du. Was ist das?', a: 'Dunkelheit (oder dichter Nebel).' },
  { id: 'r18', t: 'raetsel', e: '🧤', q: 'Was hat einen Daumen, aber keine anderen Finger?', a: 'Ein Fäustling.' },
  { id: 'r19', t: 'raetsel', e: '🎂', q: 'Was wird jedes Jahr größer, aber nie kleiner?', a: 'Dein Alter.' },
  { id: 'r20', t: 'raetsel', e: '🍄', q: 'Was hat einen Hut, aber keinen Kopf?', a: 'Ein Pilz.' },
  { id: 'r21', t: 'raetsel', e: '✍️', q: 'Welches Wort schreibt man immer falsch?', a: 'Das Wort „falsch“.' },
  { id: 'r22', t: 'raetsel', e: '👣', q: 'Je mehr du davon machst, desto mehr bleibt hinter dir zurück. Was ist das?', a: 'Schritte (oder Fußspuren).' },
  { id: 'r23', t: 'raetsel', e: '🃏', q: 'Was hat 13 Herzen, aber keinen einzigen Herzschlag?', a: 'Ein Kartenspiel mit 52 Karten: Von jeder der vier Farben gibt es 13 Karten, also 13 Herzkarten.' },
  { id: 'r24', t: 'raetsel', e: '👨‍👧‍👦', q: 'Ein Mann hat 4 Töchter. Jede Tochter hat einen Bruder. Wie viele Kinder hat der Mann?', a: '5 Kinder: 4 Töchter und 1 Sohn. Der Sohn ist der Bruder von allen.' },
  { id: 'r25', t: 'raetsel', e: '🐘', q: 'Wie bekommt man einen Elefanten in den Kühlschrank?', a: 'Tür auf, Elefant rein, Tür zu.' },
  { id: 'r26', t: 'raetsel', e: '🌙', q: 'Es ist Mitternacht und es regnet. Kann in 72 Stunden die Sonne scheinen?', a: 'Nein! In 72 Stunden ist wieder Mitternacht – da ist es dunkel.' },
  { id: 'r27', t: 'raetsel', e: '🔑', q: 'Was hat einen Bart, ist aber kein Mann?', a: 'Ein Schlüssel. Der Teil mit den Zacken heißt Schlüsselbart.' },
  { id: 'r28', t: 'raetsel', e: '👟', q: 'Was hat eine Zunge, aber kann nicht sprechen?', a: 'Ein Schuh.' },
  { id: 'r29', t: 'raetsel', e: '👃', q: 'Welche Brücke kann man nicht überqueren?', a: 'Die Nasenbrücke (oder die Zahnbrücke).' },
  { id: 'r30', t: 'raetsel', e: '🚂', q: 'Eine Elektrolok fährt nach Norden, der Wind kommt aus dem Westen. In welche Richtung weht der Rauch?', a: 'Gar nicht – eine Elektrolok hat keinen Rauch!' },
  { id: 'r31', t: 'raetsel', e: '🐐', q: 'Ein Bauer will einen Wolf, eine Ziege und einen Kohlkopf über einen Fluss bringen. Sein Boot trägt nur ihn und eines davon. Allein gelassen frisst der Wolf die Ziege und die Ziege den Kohl. Wie klappt es?', a: 'Zuerst die Ziege rüber. Zurück, den Wolf holen und rüberbringen, dabei die Ziege wieder mit zurücknehmen. Dann den Kohl rüber, wieder zurück und zum Schluss die Ziege holen.' },
  { id: 'r32', t: 'raetsel', e: '🪣', q: 'Du hast einen 3-Liter-Eimer und einen 5-Liter-Eimer, beide ohne Markierung, und genug Wasser. Wie misst du genau 4 Liter ab?', a: '5-Liter-Eimer füllen, daraus 3 Liter in den kleinen Eimer gießen (2 bleiben übrig). Kleinen Eimer leeren, die 2 Liter hineingießen. Großen Eimer wieder füllen und den kleinen auffüllen: 1 Liter geht hinein, also bleiben 4 Liter im großen Eimer.' },
  { id: 'r33', t: 'raetsel', e: '⚖️', q: 'Du hast 9 Münzen, eine ist schwerer als die anderen. Du hast eine Balkenwaage. Mit wie wenigen Wägungen findest du die schwere Münze?', a: 'Mit nur 2 Wägungen: Teile die Münzen in 3 Dreierhaufen. Wiege zwei Haufen gegeneinander, so findest du den schwersten Haufen. Aus ihm wiegst du zwei Münzen gegeneinander und weißt es.' },
  { id: 'r34', t: 'raetsel', e: '💡', q: 'Draußen vor dem Zimmer sind 3 Schalter, im Zimmer brennt nur eine Glühbirne, die zu einem der Schalter gehört. Du darfst nur einmal ins Zimmer gehen. Wie findest du den richtigen Schalter?', a: 'Schalter 1 einige Minuten anlassen, dann aus. Schalter 2 an und rein ins Zimmer. Leuchtet die Birne: Schalter 2. Ist sie aus und warm: Schalter 1. Aus und kalt: Schalter 3.' },
  { id: 'r35', t: 'raetsel', e: '🪙', q: 'Ich habe zwei Münzen, zusammen sind sie 15 Cent wert. Eine davon ist keine 5-Cent-Münze. Welche Münzen sind es?', a: 'Eine 10-Cent-Münze und eine 5-Cent-Münze. Eine von beiden (die 10-Cent-Münze) ist keine 5-Cent-Münze – die andere aber schon!' },
  { id: 'r36', t: 'raetsel', e: '🚌', q: 'Du fährst einen Bus. An der ersten Haltestelle steigen 3 Leute ein, an der zweiten steigen 2 aus und 4 ein. Wie alt ist der Busfahrer?', a: 'So alt wie du – denn du bist der Busfahrer!' },
  { id: 'r37', t: 'raetsel', e: '🏠', q: 'Ein Mann baut ein Haus mit vier Seiten, die alle nach Süden zeigen. Ein Bär spaziert vorbei. Welche Farbe hat er?', a: 'Weiß. Ein Haus mit vier Südseiten kann nur am Nordpol stehen – da leben Eisbären.' },
  { id: 'r38', t: 'raetsel', e: '🤧', q: 'Was kann man fangen, aber nicht werfen?', a: 'Eine Erkältung.' },
  { id: 'r39', t: 'raetsel', e: '😊', q: 'Was wird mehr, wenn du es mit anderen teilst?', a: 'Freude (oder Wissen).' },
  { id: 'r40', t: 'raetsel', e: '🛣️', q: 'Was geht durch Städte und Felder, ohne sich zu bewegen?', a: 'Eine Straße.' },
  { id: 'r41', t: 'raetsel', e: '⛰️', q: 'Was hat Wurzeln, die niemand sieht, ist höher als jeder Baum, wächst und wächst und steigt doch nie?', a: 'Ein Berg.' },
  { id: 'r42', t: 'raetsel', e: '🚛', q: 'Was hat vier Räder und Fliegen?', a: 'Ein Müllwagen.' },
  { id: 'r43', t: 'raetsel', e: '⭕', q: 'Ich habe weder Anfang noch Ende. Was bin ich?', a: 'Ein Kreis (oder ein Ring).' },

  // Musik (neu)
  { id: 'm01', t: 'musik', e: '🎹', q: 'Mozart schrieb schon mit etwa fünf Jahren seine ersten eigenen Musikstücke. Mit sechs ging er als Wunderkind auf Konzertreise quer durch Europa.' },
  { id: 'm02', t: 'musik', e: '🦻', q: 'Ludwig van Beethoven wurde im Lauf seines Lebens fast völlig taub. Trotzdem komponierte er weiter – sogar seine berühmte 9. Sinfonie.' },
  { id: 'm03', t: 'musik', e: '🎹', q: 'Ein Klavier hat 88 Tasten. Wie viele davon sind weiß, wenn 36 schwarz sind?', a: '52 weiße Tasten, denn 88 − 36 = 52.' },
  { id: 'm04', t: 'musik', e: '🎻', q: 'Wie viele Saiten hat eine normale Geige?', a: '4 Saiten. Sie sind auf G, D, A und E gestimmt.' },
  { id: 'm05', t: 'musik', e: '🎸', q: 'Wie viele Saiten hat eine normale Gitarre und wie viele ein E-Bass?', a: 'Die Gitarre hat 6 Saiten, der E-Bass meistens 4.' },
  { id: 'm06', t: 'musik', e: '⛪', q: 'Die Orgel wird „Königin der Instrumente“ genannt. Große Kirchenorgeln haben mehrere tausend Pfeifen – manche sogar über 10.000.' },
  { id: 'm07', t: 'musik', e: '🎶', q: 'Welche Flöte ist die kleinste im Orchester und klingt am höchsten?', a: 'Die Piccoloflöte. Sie ist nur etwa halb so lang wie eine Querflöte.' },
  { id: 'm08', t: 'musik', e: '🎼', q: 'Do, Re, Mi, Fa, Sol, La, Si: Die Namen der Töne stammen aus den Anfangssilben der Zeilen eines alten lateinischen Liedes.' },
  { id: 'm09', t: 'musik', e: '💨', q: 'Schall braucht in der Luft etwa 1 Sekunde für 340 Meter. Im Wasser ist er mit rund 1500 Metern pro Sekunde viel schneller.' },
  { id: 'm10', t: 'musik', e: '〰️', q: 'Was entscheidet darüber, ob ein Ton hoch oder tief klingt?', a: 'Wie schnell etwas schwingt. Schnelle Schwingungen klingen hoch, langsame klingen tief.' },
  { id: 'm11', t: 'musik', e: '🎶', q: 'Das A, nach dem sich ein Orchester stimmt, schwingt genau 440-mal pro Sekunde. Es heißt Kammerton.' },
  { id: 'm12', t: 'musik', e: '🎷', q: 'Das Saxofon ist nach seinem Erfinder Adolphe Sax benannt. Es ist aus Metall – gehört aber zu den Holzblasinstrumenten, weil es ein Rohrblatt aus Holz hat.' },
  { id: 'm13', t: 'musik', e: '🎶', q: 'Ist die Querflöte ein Holz- oder ein Blechblasinstrument?', a: 'Ein Holzblasinstrument – obwohl sie heute aus Metall ist. Früher waren Flöten aus Holz, der Name ist geblieben.' },
  { id: 'm14', t: 'musik', e: '🗣️', q: 'Wenn du singst, schwingen die Stimmbänder in deinem Kehlkopf. Das sind zwei kleine Hautfalten.' },
  { id: 'm15', t: 'musik', e: '👨‍👧‍👦', q: 'Johann Sebastian Bach hatte 20 Kinder. Mehrere von ihnen wurden auch berühmte Musiker.' },
  { id: 'm16', t: 'musik', e: '🔴', q: 'Der Komponist Antonio Vivaldi hatte rote Haare. Darum nannte man ihn in Italien „den roten Priester“.' },
  { id: 'm17', t: 'musik', e: '🎻', q: 'Wer hat „Die vier Jahreszeiten“ komponiert?', a: 'Antonio Vivaldi. Es sind vier Violinkonzerte, eins für jede Jahreszeit.' },
  { id: 'm18', t: 'musik', e: '✨', q: 'Im „Tanz der Zuckerfee“ aus dem Nussknacker-Ballett von Tschaikowsky klingt eine Celesta. Sie sieht aus wie ein kleines Klavier, klingt aber wie funkelnde Glöckchen.' },
  { id: 'm19', t: 'musik', e: '🎹', q: 'Das Klavier heißt eigentlich „Pianoforte“. Was bedeutet das?', a: '„Leise-laut“. Anders als beim Cembalo kann man beim Klavier leise und laut spielen, je nachdem wie fest man die Taste drückt.' },
  { id: 'm20', t: 'musik', e: '🔊', q: 'Was bedeuten „forte“ und „piano“ in der Musik?', a: 'Forte heißt laut, piano heißt leise.' },
  { id: 'm21', t: 'musik', e: '🎹', q: 'Wie viele verschiedene Töne hat eine Oktave auf dem Klavier (weiße und schwarze Tasten zusammen)?', a: '12 Töne: 7 weiße und 5 schwarze Tasten.' },
  { id: 'm22', t: 'musik', e: '💃', q: 'Wie viele Schläge hat ein Takt in einem Walzer (3/4-Takt)?', a: '3 Schläge: eins-zwei-drei.' },
  { id: 'm23', t: 'musik', e: '🎼', q: 'Eine halbe Note dauert 2 Schläge, eine Viertelnote 1 Schlag. Wie viele Achtelnoten dauern so lange wie eine halbe Note?', a: '4 Achtelnoten. Zwei Achtel sind ein Schlag, also vier Achtel sind 2 Schläge.' },
  { id: 'm24', t: 'musik', e: '🎵', q: 'In einem 4/4-Takt steht schon eine halbe Note und eine Viertelnote. Welche Note fehlt noch, damit der Takt voll ist?', a: 'Eine Viertelnote: 2 + 1 + 1 = 4 Schläge.' },
  { id: 'm25', t: 'musik', e: '🪘', q: 'Das Didgeridoo ist ein langes Blasinstrument der Aborigines in Australien. Mit einer besonderen Atemtechnik (Zirkularatmung) kann man dabei ununterbrochen spielen, auch beim Einatmen.' },
  { id: 'm26', t: 'musik', e: '🏔️', q: 'Ein Alphorn ist oft mehr als 3 Meter lang. Sein Klang trägt in den Bergen weit durch die Täler.' },
  { id: 'm27', t: 'musik', e: '🌺', q: 'Die Ukulele kommt aus Hawaii. Ihr Name wird oft mit „hüpfender Floh“ übersetzt – weil die Finger so flink darüber springen.' },
  { id: 'm28', t: 'musik', e: '👐', q: 'Welches Instrument spielt man, ohne es zu berühren?', a: 'Das Theremin. Man bewegt nur die Hände in der Nähe von zwei Antennen, und das verändert Tonhöhe und Lautstärke.' },
  { id: 'm29', t: 'musik', e: '🎻', q: 'Geigen von Antonio Stradivari sind über 300 Jahre alt und werden heute für Millionen Euro verkauft.' },
  { id: 'm30', t: 'musik', e: '🐋', q: 'Buckelwale singen lange Lieder, die sich über die Jahre verändern. Die Wale lernen neue Melodien voneinander.' },
  { id: 'm31', t: 'musik', e: '🦜', q: 'Der Leierschwanz in Australien kann Geräusche nachmachen, die er gehört hat: zum Beispiel Handyklingeln oder Kamera-Klicks.' },
  { id: 'm32', t: 'musik', e: '📀', q: 'Auf einer Schallplatte ist der Ton als winzige Wellen-Rille eingeritzt. Eine Nadel folgt dieser Rille, wird dadurch zum Schwingen gebracht und so entsteht die Musik.' },
  { id: 'm33', t: 'musik', e: '🎹', q: 'Ein Klavier hat rund 230 Saiten. Beim Spielen schlagen kleine Hämmerchen darauf.' },
  { id: 'm34', t: 'musik', e: '💃', q: 'Das Wort „Orchester“ kommt aus dem Griechischen und bedeutete ursprünglich „Tanzplatz“.' },
  { id: 'm35', t: 'musik', e: '🧠', q: 'Wenn du ein Instrument spielst, arbeiten viele Teile deines Gehirns gleichzeitig: Hören, Sehen, Bewegen und Fühlen.' },
  { id: 'm36', t: 'musik', e: '🎩', q: 'Welcher Komponist reiste schon als Kind durch Europa und galt als Wunderkind?', a: 'Wolfgang Amadeus Mozart (1756–1791).' },
  { id: 'm37', t: 'musik', e: '🎤', q: 'Wie nennt man eine Gruppe aus vier Musikern?', a: 'Ein Quartett. Zu zweit ist es ein Duo, zu dritt ein Trio, zu fünft ein Quintett.' },
  { id: 'm38', t: 'musik', e: '🎼', q: 'Was ist eine Oktave?', a: 'Der Abstand von einem Ton bis zum nächsten gleichnamigen Ton, zum Beispiel von einem C zum nächsten C. Der obere Ton schwingt genau doppelt so schnell.' },
  { id: 'm39', t: 'musik', e: '🥁', q: 'Warum klingt eine große Trommel tiefer als eine kleine?', a: 'Das große Trommelfell schwingt langsamer. Langsame Schwingungen klingen tief.' },
  { id: 'm40', t: 'musik', e: '🍾', q: 'Du pustest über den Rand einer Flasche, bis es tutet. Wird der Ton höher oder tiefer, wenn du Wasser einfüllst?', a: 'Höher. Die Luftsäule in der Flasche wird kürzer, und kürzere Luftsäulen schwingen schneller.' },
  { id: 'm41', t: 'musik', e: '🔤', q: 'Die weißen Klaviertasten heißen auf Deutsch C, D, E, F, G, A und …?', a: 'H. (In anderen Ländern heißt der Ton „B“.)' },
  { id: 'm42', t: 'musik', e: '📏', q: 'Wie viele Linien hat ein Notensystem?', a: '5 Linien.' },
  { id: 'm43', t: 'musik', e: '🗝️', q: 'Welcher Schlüssel öffnet keine Tür, steht aber am Anfang jeder Notenzeile?', a: 'Der Notenschlüssel. Er zeigt, welche Töne auf welchen Linien stehen.' },
  { id: 'm44', t: 'musik', e: '🎹', q: 'Welches Instrument hat Tasten und Saiten – wird aber auch zu den Schlaginstrumenten gezählt?', a: 'Das Klavier. Kleine Hämmerchen schlagen auf die Saiten.' },
  { id: 'm45', t: 'musik', e: '🎤', q: 'Welche vier Stimmlagen gibt es in einem gemischten Chor?', a: 'Sopran, Alt, Tenor und Bass.' },
  { id: 'm46', t: 'musik', e: '🎧', q: 'Was ist ein Ohrwurm?', a: 'Ein Lied, das dir nicht mehr aus dem Kopf geht. (Es ist aber auch ein richtiges Tier, ein Insekt!)' },
  { id: 'm47', t: 'musik', e: '🎻', q: 'Welches Streichinstrument spielt man im Sitzen und stützt es mit einem Stachel am Boden ab?', a: 'Das Cello.' },
  { id: 'm48', t: 'musik', e: '🎼', q: 'Welche berühmte Sinfonie beginnt mit vier Tönen: „Ta-ta-ta-taaa“?', a: 'Beethovens 5. Sinfonie.' },
  { id: 'm49', t: 'musik', e: '🎵', q: 'Wie nennt man Musik ohne Gesang?', a: 'Instrumentalmusik.' },
  { id: 'm50', t: 'musik', e: '🔔', q: 'Wie viele Töne hat ein Dreiklang?', a: '3 Töne, daher der Name.' },
  { id: 'm51', t: 'musik', e: '🥁', q: 'Was passiert mit dem Ton einer Gitarrensaite, wenn du sie kürzer greifst?', a: 'Er wird höher, denn eine kürzere Saite schwingt schneller.' },

  // Denk mal (neu)
  { id: 'o01', t: 'offen', e: '🎻', q: 'Wenn du ein ganz neues Instrument erfinden dürftest: Wie sieht es aus und wie klingt es?' },
  { id: 'o02', t: 'offen', e: '🎵', q: 'Welches Lied würdest du als Titelmusik für deinen eigenen Film aussuchen – und warum?' },
  { id: 'o03', t: 'offen', e: '🌍', q: 'Stell dir vor, du darfst ein neues Land gründen. Wie heißt es, wie sieht die Flagge aus und welche Regel gibt es als Erstes?' },
  { id: 'o04', t: 'offen', e: '🦸', q: 'Welche Superkraft wäre im Alltag am nützlichsten – und welche wäre am lustigsten?' },
  { id: 'o05', t: 'offen', e: '🌌', q: 'Wenn du auf einen anderen Planeten reisen könntest: Wie müsste er sein, damit du dort leben möchtest?' },
  { id: 'o06', t: 'offen', e: '🤖', q: 'Du bekommst einen Roboter geschenkt, der genau eine Sache für dich erledigt. Was soll er tun?' },
  { id: 'o07', t: 'offen', e: '🐾', q: 'Wenn du für einen Tag ein Tier sein dürftest: Welches wäre es und was würdest du als Erstes tun?' },
  { id: 'o08', t: 'offen', e: '🕰️', q: 'Wenn du eine Zeitmaschine hättest: In welche Zeit würdest du reisen und was wolltest du dort sehen?' },
  { id: 'o09', t: 'offen', e: '🧩', q: 'Welche Frage würdest du gern einmal einem klugen Forscher stellen?' },
  { id: 'o10', t: 'offen', e: '🏠', q: 'Stell dir dein Traumhaus vor. Welches Zimmer gibt es dort, das es sonst nirgendwo gibt?' },
  { id: 'o11', t: 'offen', e: '🎨', q: 'Welche Farbe klingt für dich wie Musik – und welche Musik würde zu ihr passen?' },
  { id: 'o12', t: 'offen', e: '🔮', q: 'Was glaubst du: Wie sieht die Schule in 100 Jahren aus?' },
  { id: 'o13', t: 'offen', e: '🍽️', q: 'Du darfst ein neues Gericht erfinden. Was kommt hinein und wie heißt es?' },
  { id: 'o14', t: 'offen', e: '🚗', q: 'Wenn es Fahrzeuge gäbe, die alles können: Wie sähe dein Traumfahrzeug aus und was könnte es?' },
  { id: 'o15', t: 'offen', e: '🌳', q: 'Du findest einen Zauberbaum, an dem alles wächst, was du dir wünschst. Was wächst als Erstes daran?' },
  { id: 'o16', t: 'offen', e: '🤔', q: 'Was ist etwas, das du heute gelernt hast und gestern noch nicht wusstest?' },
  { id: 'o17', t: 'offen', e: '🎲', q: 'Erfinde ein neues Brettspiel: Wie lautet der Name und was ist das Ziel?' },
  { id: 'o18', t: 'offen', e: '🌈', q: 'Wenn du einen Tag lang die Farben der Welt ändern könntest: Was würdest du umfärben?' },
  { id: 'o19', t: 'offen', e: '🧠', q: 'Wenn du eine Sache sofort perfekt können würdest, was wäre das? Und warum gerade das?' },
  { id: 'o20', t: 'offen', e: '🌙', q: 'Was glaubst du, träumen Tiere? Und wenn ja, wovon?' },
  { id: 'o21', t: 'offen', e: '🐙', q: 'Wenn Kraken drei Herzen haben: Wie viele Herzen hättest du gern – und wofür bräuchtest du sie?' },
  { id: 'o22', t: 'offen', e: '📚', q: 'Wenn du eine Figur aus einem Buch treffen könntest: Wer wäre es und was würdest du fragen?' },
  { id: 'o23', t: 'offen', e: '🎶', q: 'Welcher Ton oder welches Geräusch macht dich besonders glücklich? Und welches nervt dich am meisten?' },
  { id: 'o24', t: 'offen', e: '🚀', q: 'Stell dir vor, du bist die erste Person auf dem Mars. Was sind deine ersten Worte?' },
  { id: 'o25', t: 'offen', e: '🏝️', q: 'Du bist auf einer einsamen Insel. Du darfst drei Dinge mitnehmen. Welche?' },
  { id: 'o26', t: 'offen', e: '🕵️', q: 'Du bist Detektivin oder Detektiv: Welches Rätsel in deiner Umgebung würdest du gern lösen?' },
  { id: 'o27', t: 'offen', e: '🧸', q: 'Wenn deine Kuscheltiere nachts lebendig würden: Was würden sie wohl tun?' },
  { id: 'o28', t: 'offen', e: '🌊', q: 'Stell dir vor, du lebst für einen Tag unter Wasser. Wie wäre dein Tag?' },
  { id: 'o29', t: 'offen', e: '🔢', q: 'Wenn du eine Zahl zu deiner Lieblingszahl machen müsstest: Welche wäre es und warum?' },
  { id: 'o30', t: 'offen', e: '📖', q: 'Schreib im Kopf den ersten Satz für ein Buch, das du gern schreiben würdest.' },
  { id: 'o31', t: 'offen', e: '🧪', q: 'Welche Erfindung fehlt der Welt noch? Wie würde sie funktionieren?' },
  { id: 'o32', t: 'offen', e: '🎭', q: 'Wenn du einen Tag lang jemand anderes sein dürftest: Wer wärst du und was würdest du machen?' },
  { id: 'o33', t: 'offen', e: '🏔️', q: 'Wo auf der Erde möchtest du unbedingt einmal sein? Was würdest du dort zuerst machen?' },

/* =====================================================================
   GEO-DATEN: Länder, Hauptstädte, Flaggen (einfaches SVG), Nachbarn, sichere Fakten
   ---------------------------------------------------------------------
   Neue Kontinente: einen Eintrag in GEO.conts ergänzen und die Länder mit  cont:'asien'  an COUNTRIES anhängen.
   Quiz, Karten und Belohnungen lesen NUR diese Daten – kein Umbau der Oberfläche nötig.
   REGELN FÜR FAKTEN: nur Dinge, die 100 % sicher stimmen (Kinder sollen nichts Falsches lernen). Im Zweifel weglassen.
   Länder-Felder: id · cont · reg · name · cap (Anzeige) · alt (weitere erlaubte Schreibweisen beim Tippen) ·
                  nb (Nachbarländer mit Landgrenze, nur Ids) · tr (leicht verwechselbare Länder) · trap (große Stadt, die NICHT die Hauptstadt ist) · facts
   ===================================================================== */

};
const mkC = (id, reg, name, cap, nb, facts, o) => Object.assign({ id, cont: 'europa', reg, name, cap, nb, facts, calt: [], tr: [], trap: '' }, o || {});

  mkC('alb', 'balk', 'Albanien', 'Tirana', ['mne', 'mkd', 'grc'], ['Die Flagge zeigt einen schwarzen Doppeladler.', 'Albanien hat Küste am Adriatischen und am Ionischen Meer.']),

function mergeState(raw) {
  const d = DEF();
  if (!raw || typeof raw !== 'object') return d;
  for (const k of Object.keys(raw)) {                // unbekannte Felder bleiben erhalten
    const v = raw[k]; if (v === undefined || v === null) continue;
    if (isObj(d[k]) && isObj(v)) d[k] = Object.assign(d[k], v); else d[k] = v;
  }
  for (const s of Object.keys(d.owned)) if (!Array.isArray(d.owned[s])) d.owned[s] = [];
  if (!d.owned.theme.includes('sonne')) d.owned.theme.push('sonne');
  if (!d.owned.skin.includes('fuchs')) d.owned.skin.push('fuchs');
  if (!isObj(d.decks)) d.decks = {};
  /* Angefangene oder fertige Gruppen werden NIE angefasst (auch nicht alte ohne „pts“). Nur ganz unberührte alte Gruppen
     (keine einzige Antwort) bekommen die neuen, kniffligeren Aufgaben – dabei geht nichts verloren. */
  for (const k of Object.keys(d.decks)) {
    const dk = d.decks[k];
    const untouched = dk && Array.isArray(dk.qs) && Array.isArray(dk.res) && !(dk.i > 0) && dk.res.every(r => r === null || r === undefined) && !(dk.ans || []).some(a => a);
    if (untouched && !dk.pts) delete d.decks[k];
  }
  if ((raw.v || 1) < 2) {                            // Übernahme von Version 1
    d.starsLife = Math.max(d.starsLife, raw.stars || 0);
    for (const k of Object.keys(d.topics)) {
      const t = d.topics[k]; if (t.medal === undefined) t.medal = !t.rounds ? 0 : t.best3 >= 10 ? 4 : t.best3 >= 7 ? 3 : (t.maxLvl >= 2 ? 2 : 1);
    }
  }

  if (!raw.mig3) { if (d.flames > 0) { d.coins += d.flames * 3; } d.flames = 0; d.mig3 = 1; }
  if (!isObj(d.daily.cr)) d.daily.cr = { left: 0, grants: 0, used: 0, lvl: false, goal: false };
  if (!Array.isArray(d.earned)) d.earned = [];
  d.v = 2;
  return d;
}
function load() {
  let best = null;
  try {
    for (const k of [KEY, ...BKUP]) {
      const r = localStorage.getItem(k); if (!r) continue;
      try { const o = JSON.parse(r); if (o && (!best || (o.saved || 0) > (best.saved || 0))) best = o; if (k === KEY && o) break; } catch (e) { }
    }
  } catch (e) { persistOK = false; }
  if (!best && memStore) best = memStore;
  return mergeState(best);
}
let idbTimer = null, bakTimer = 0;
function idbOpen() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('mathe_abenteuer', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
function idbPut(j) { idbOpen().then(db => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(j, 'state'); tx.oncomplete = () => db.close(); }).catch(() => { }); }
function idbGet() {
  return idbOpen().then(db => new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => { res(q.result); db.close(); }; q.onerror = () => res(null); })).catch(() => null);
}
function save() {
  S.saved = Date.now();
  const j = JSON.stringify(S);

  catch (e) { persistOK = false; lastSaveErr = String(e && e.name || e); memStore = JSON.parse(j); }
  clearTimeout(idbTimer); idbTimer = setTimeout(() => idbPut(j), 700);
  if (persistOK && Date.now() - bakTimer > 30 * 60 * 1000) {          // rollende Schnappschüsse (alle 30 Min.)
    bakTimer = Date.now();

  }
}

const cumNeed = n => 15 * n * (n - 1) / 2;
const LV_TITLES = ['Rechen-Starter', 'Zahlen-Entdecker', 'Mathe-Maus', 'Rechen-Profi', 'Zehner-Held', 'Euro-Experte', 'Mathe-Meister', 'Rechen-Champion', 'Mathe-Legende'];

}

function topicRec(key) {

  if (t.q === undefined) t.q = 0; if (t.c === undefined) t.c = 0; if (t.medal === undefined) t.medal = 0;
  if (!Array.isArray(t.cb)) t.cb = [0, 0, 0]; if (!Array.isArray(t.sb)) t.sb = [0, 0, 0];
  if (!isObj(t.fl)) t.fl = {}; if (t.resets === undefined) t.resets = 0;

  const [m, t] = key.split('.'); const mod = MODULES.find(x => x.id === m); if (!mod) return null;

}

/* ---------- decks: feste Aufgabenreihen pro Gruppe ---------- */
const mKey = (tid, q) => tid + '|' + (q.html || q.prompt || '') + '|' + q.title;
function makeQ(tid, lvl, seen) {
  const f = findTopic(tid); let q, g = 0;
  do { q = f.topic.gen(lvl); g++; } while (seen && seen.has(mKey(tid, q)) && g < 80);
  if (seen) seen.add(mKey(tid, q));
  return q;
}
function newDeck(key) {
  const qs = [], lv = [], seen = new Set();
  BLOCK_LEVELS.forEach(([lo, hi]) => {
    const A = [], B = [];
    for (let i = 0; i < BLOCK / 2; i++) { A.push(makeQ(key, lo, seen)); B.push(makeQ(key, hi, seen)); }
    for (let i = 0; i < BLOCK / 2; i++) { qs.push(A[i], B[i]); lv.push(lo, hi); }          // leicht, schwer, leicht, schwer …
  });
  return { v: 2, qs, lv, pts: lv.map(ptsForLevel), res: Array(DECK_N).fill(null), ans: Array(DECK_N).fill(null), i: 0, ts: Date.now() };
}

const pinOk = p => !!S.pin && hashStr(p) === S.pin.h;
const recOk = p => !!S.pin && hashStr(p) === S.pin.r;

/* ---------- Tageslimit ---------- */

/* =====================================================================

   ---------------------------------------------------------------------
   PLUGIN-API für Funktionen (feat_*.js, laufen NACH app.js, VOR boot.js)
     registerFeature({ id, title, icon:'<ICO-Name>', tint:'lav|mint|peach|sky|butter',
                       group:'world'|'make'|'earn', order:Zahl, sub:()=>'Untertitel', badge:()=>Zahl|'' ,
                       view:'<VIEWS-Name>', views:{name:fn}, acts:{name:fn}, goals:()=>[{ic,label,pct,hint}], boot:()=>{} })
   KATALOG (freischaltbare Dinge, Zustand S.unl = { id: Zeitstempel })
     regKind('avhair', { group:'avatar', label:'Haare', ic:'avatar', thumb: it => html })
     regItems([{ id:'hair.bob', kind:'avhair', name:'Bob', src:{ t:'free' } , ...eigene Felder }])
     src.t:  free | shop {cur:'c'|'s'|'f', price} | chest | lvl {n} | star {n} | stamp {n} | deck {n}
     hasItem(id), unlock(id), itemsOf(kind), srcLabel(it)
   TRUHEN: giveChest() (store.js) → openChest(); Erweiterungen: regChestExtra({ w:()=>Gewicht, give:()=>({ic,title,sub}) })
   Ton: sfx('tap'|'ok'|'pop'|'magic'|'hatch'|'chest'), AC() (gemeinsamer AudioContext, respektiert S.cfg.sound)
   ===================================================================== */

/* ---------- Feature-Registry ---------- */
const FEATS = {};
function registerFeature(f) {
  FEATS[f.id] = Object.assign({ order: 50, group: 'world', tint: 'lav' }, f);
  if (f.views) Object.assign(VIEWS, f.views);
  if (f.after && f.view) AFTER[f.view] = f.after;
  if (f.acts) Object.assign(ACT, f.acts);
  if (f.view && !ACT[f.id]) ACT[f.id] = () => go(f.view);
}
const featList = g => Object.values(FEATS).filter(f => f.group === g).sort((a, b) => a.order - b.order);

/* ---------- Katalog ---------- */
const CATALOG = {}, KIND = {};
const SHOP_GROUPS = { fino: { label: 'Fino', ic: 'fox' }, avatar: { label: 'Avatar', ic: 'avatar' }, musik: { label: 'Musik', ic: 'music' } };
function regKind(id, o) { KIND[id] = Object.assign({ label: id, group: 'fino', ic: 'sparkle', thumb: it => it.svg ? `<svg viewBox="-55 -55 110 110">${it.svg}</svg>` : `<div class="ithumb">${it.e || '❓'}</div>` }, o); }
/* REGELN: Münzen sind die einzige Währung; ausgegeben wird nur im Shop. src.t: free (nur das Allernötigste) | shop {price in Münzen} | milestone {why} (wird vom Lernfortschritt geschenkt, nie gekauft). */
const TIER_PRICE = 60;
function normSrc(it) {
  const s0 = it.src || { t: 'free' }; let s = s0;
  if (s.t === 'shop') { const k = s.cur || 'c'; s = { t: 'shop', cur: 'c', price: Math.max(5, Math.round((s.price || 10) * (k === 'f' ? 3 : k === 's' ? 12 : 1) / 5) * 5) }; }
  else if (['chest', 'lvl', 'star', 'stamp', 'deck'].includes(s.t)) s = { t: 'shop', cur: 'c', price: it.price || TIER_PRICE };
  it.src = s;
}
function regItems(list) { list.forEach(it => { it.src = it.src || { t: 'free' }; normSrc(it); CATALOG[it.id] = it; }); }
const itemsOf = kind => Object.values(CATALOG).filter(i => i.kind === kind);
function hasItem(id) {
  const it = CATALOG[id];
  if (S.unl[id]) return true;
  if (!it) return false;
  if (it.src.t === 'free') return true;
  if (it.legacy && S.owned[it.legacy] && S.owned[it.legacy].includes(it.legacyId || id)) return true;
  return false;
}
function unlock(id, quiet) {
  if (hasItem(id) && S.unl[id]) return false;
  S.unl[id] = Date.now();
  const it = CATALOG[id];
  if (it && !quiet) toast('🎁', `Neu freigeschaltet: <b>${esc(it.name)}</b>`);
  return true;
}
function srcLabel(it) {
  const s = it.src;
  if (s.t === 'shop') return `🪙 ${s.price}`;
  if (s.t === 'milestone') return `🎯 ${s.why || 'Wird beim Lernen verdient'}`;
  return '';
}
function checkUnlocks() {
  let any = false;
  if (typeof checkStamps === 'function') checkStamps();
  Object.values(FEATS).forEach(f => { if (f.check) { try { f.check(); } catch (e) { console.error(e); } } });
  if (any) save();
}
function buyItem(id) {
  const it = CATALOG[id]; if (!it || it.src.t !== 'shop' || hasItem(id)) return false;
  if (S.coins < it.src.price || shopLeft() <= 0) return false;
  S.coins -= it.src.price; unlock(id, true); S.stats.bought++;
  if (S.goal === id) S.goal = null;
  checkTrophies(); save(); return true;
}
/* Gemeinsame Kachel für einen Katalog-Gegenstand. Gesperrte Dinge bleiben sichtbar (grau), zeigen aber, was sie kosten und wie weit man ist.
   o.act = Aktion beim Antippen eines eigenen Dings · o.inShop = Kachel steht im Shop (Antippen = kaufen) · sonst führt Antippen zum Ding im Shop. */
/* Gesperrte Dinge bleiben farbig erkennbar – mit Schloss und echter Bedingung/Preis */
const LOCK = `<span class="rh-lock" aria-label="Gesperrt">${ico('lock', 13)}</span>`;
function itemTile(it, o) {
  o = o || {};
  const has = hasItem(it.id), K = KIND[it.kind] || KIND.fino || {}, sh = it.src.t === 'shop';
  const th = (K.thumb || (x => `<div class="ithumb">${x.e || ''}</div>`))(it);
  const left = sh ? Math.max(0, it.src.price - S.coins) : 0;
  const st = has ? (o.sel ? '<span class="tag on">aktiv</span>' : '') : sh ? `<span class="tag pr">🪙 ${it.src.price}</span>${left ? `<span class="tag need">noch ${left}</span>` : '<span class="tag ready">bereit</span>'}` : `<span class="tag">${ico('lock', 12)} ${esc(srcLabel(it))}</span>`;
  const act = has ? (o.act ? `data-act="${o.act}" data-arg="${esc(o.arg == null ? it.id : o.arg)}"` : '') : sh ? `data-act="${o.inShop ? 'buyItemAsk' : 'shopAt'}" data-arg="${it.id}"` : '';
  return `<button class="itile ${has ? '' : 'lk'} ${o.sel ? 'sel' : ''} ${S.goal === it.id ? 'goal' : ''}" ${act} title="${esc(it.name)}">${has ? '' : LOCK}<span class="ith">${th}</span><span class="itn">${esc(it.name)}</span>${st}</button>`;
}
/* Shop öffnen und zu einem Ding springen */
function shopAt(id) {
  const it = CATALOG[id]; if (!it) return go('shop');
  const k = KIND[it.kind] || {};
  go('shop', { shopGrp: k.group || 'fino', shopKind: it.kind, shopHi: id });
}

/* Kurzschreibweise für Quellen: 0 gratis · c25 Münzen · s5 Sterne · h5 Flammen · T Truhe · L3 Stufe · S50 Sterne gesamt · P2 Stempel · D2 Gruppen */
const SRC = c => c === '0' ? { t: 'free' } : c === 'T' ? { t: 'chest' } : { t: { c: 'shop', s: 'shop', h: 'shop', L: 'lvl', S: 'star', P: 'stamp', D: 'deck' }[c[0]], ...(c[0] === 'c' ? { cur: 'c', price: +c.slice(1) } : c[0] === 's' ? { cur: 's', price: +c.slice(1) } : c[0] === 'h' ? { cur: 'f', price: +c.slice(1) } : { n: +c.slice(1) }) };

/* ---------- Truhen ---------- */
const CHEST_EXTRA = [];
const regChestExtra = x => CHEST_EXTRA.push(x);
function chestRoll() {                                                       // Eine Truhe = eine verdiente Karte. Dinge gibt es nur im Shop.
  const cards = CARDS.filter(c => !S.cards[c.id]);
  if (cards.length) { const c = rnd(cards); S.cards[c.id] = Date.now(); return { k: 'card', id: c.id }; }
  const n = 15 + Math.floor(Math.random() * 11); giveCoins(n, 'Alle Karten gesammelt');
  return { k: 'x', ic: '🪙', title: n + ' Münzen', sub: 'Du hast schon alle Karten gefunden!' };
}
function openChest() {
  if (!S.chests) return;
  S.chests--; UI.reveal = chestRoll(); UI.ans = {};
  sfx('chest'); checkTrophies(); save(); render(); confetti(70);
}
